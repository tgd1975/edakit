[[sim]]
code = "LIM.range"
place = "U2"
judged = "real"
why = "The LM301A runs from VCC, 8.73 V behind the 1N5817 – below the 10 V (±5 V) from which its data sheet specifies it (SNOSBS0D, note 1 of the electrical characteristics). Rats run on 9 V in practice; the data sheet promises nothing there – offset, swing and common-mode range are unspecified. The TL072 beside it is specified from 4.5 V."

[[sim]]
code = "LIM.v"
place = "C19"
judged = "real"
why = "C19 (10 µF electrolytic, the TS output coupling) sits with its plus – pad 1 of the CP_Radial_D5.0mm footprint, the square pad with the '+' – at ts_out, held at 0 V by R27, and its minus at R26 from Q2's emitter, 3.0–3.4 V: reverse-biased in every state. The schematic draws an unpolarized Device:C, the footprint is polarized. Turned round, the finding goes (tests/test_open_designs.py)."
[[fixed]]
what = "A base biased by resistors – the TS's 2SC1815 followers through 510 kΩ from the divider node VREF – judged as floating while 'the firmware is not running' (LVL.undefined): only a resistor to the emitter or to a net a pin types counted, not ground and not a divider's middle."
[[fixed]]
what = "A coupling capacitor in a signal path judged from extreme to extreme of its two nets' ranges – C10 and C19, 8.5 V on one side against −4.5 V on the other, 13 V × 1.5 above their 16 V (LIM.v); its two sides carry the same signal, so like ends are compared."
[[fixed]]
what = "Several wires of one net between two boards – the ground to the DC jack, both jack sleeves and both footswitches – stopped the simulation (SIM.converge): the second cable of a net found its ends on different nets."
[[fixed]]
what = "The order switch and the footswitches were never judged by REQ.value/switch: their nets run through cables, and the simulation's per-board node names ('IN__main') were looked up among the signal nets."
[[fixed]]
what = "A switch of three poles could not be described: the roles of the second and third pole were unknown, the simulation switched only the first, and REQ.value/switch took all nine lugs for one contact."
