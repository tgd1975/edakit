# What edakit check and edakit sim find on the published GuitarML Tubescreamer/Rat combo, and how each finding is judged (the words as in
# esp32-devkitc-v4/findings.toml): real (a point of the design), lacks (a fact the transcription or the datasheets
# lack), criterion (edakit's own yardstick, not the design's), known gap (edakit judges it wrong, not fixed yet – with
# the reason). The domain guitar is on. The audio path's nets are marked signal, the input instrument (a pickup, 1 MΩ: the test's figure); the loads switch the order switch and both footswitches; spread runs every DC scenario with the 2SC1815's and the 2N5458's spread at both ends. The two AC runs are information (no source states the response the design intends) – they find nothing.

