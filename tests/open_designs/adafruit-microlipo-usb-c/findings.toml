# What edakit check and edakit sim find on the published Adafruit Micro-Lipo Charger with USB Type C Jack, and how each
# finding is judged (the words as in esp32-devkitc-v4/findings.toml): real (a point of the design), lacks (a fact the
# transcription or the datasheets lack), criterion (edakit's own yardstick, not the design's), known gap (edakit judges
# it wrong, not fixed yet – with the reason). As delivered (SJ1 open, 100 mA) the charger passes every limit; what is
# real comes from the 500 mA mode and from a reversed pack. The simulation's cell is Adafruit's 500 mAh LiPo.

[[check]]
code = "DOCS.file"
place = "edakit.toml"
judged = "criterion"
why = "The transcription has no requirements file: what the published design must do stands in its own documents, not in edakit's form. edakit requires the file before a release (handbook 3.6); it is no point of the design."

[[check]]
code = "LIM.i"
grade = "charge"
place = "U1"
judged = "real"
why = "With SJ1 closed, R3 (10 kΩ) and R4 (2.2 kΩ) in parallel are 1.80 kΩ: 1000 V / 1.80 kΩ = 555 mA, above the MCP73831's 500 mA and below its PROG window of 2 … 67 kΩ (DS20001984H p. 4) – and above 1C of the 500 mAh cell the product page names for this mode. 2.5 kΩ, as the micro-USB Micro-Lipo of the same repository has, would give 500 mA; the schematic's own table says 2.0K = 500mA."

[[check]]
code = "PATH.reverse"
place = "U1.3"
judged = "real"
why = "A pack whose JST plug is wired the other way round puts −4.2 V straight on the charger's VBAT (and C2): nothing on the board blocks it. Adafruit says so itself – 'For use with Adafruit LiPoly/LiIon batteries only! Other batteries may have different voltage, chemistry, polarity or pinout' – and the plug's polarity differs between makers."

[[sim]]
code = "LIM.i"
place = "U1"
judged = "real"
why = "The 500 mA mode charges with 555 mA in the model, above the MCP73831's 500 mA (LIM.i/charge, a warning) – the static finding seen in the operating point."

[[sim]]
code = "LIM.backfeed"
place = "CN2"
judged = "real"
why = "555 mA into Adafruit's 500 mAh cell: above its quick-charge maximum of 1C (PKCELL 503035 specification, 500 mA), the cell the product page names as the smallest for this mode."

[[sim]]
code = "LIM.i"
place = "X2"
judged = "real"
why = "In the 500 mA mode the board draws 556–558 mA; with 5.1 kΩ Rd it asks a USB-C source for Default USB Power, 500 mA from a USB 2.0 port. Default power from a USB 3.x port (900 mA) carries it."

[[sim]]
code = "LIM.t"
place = "U1"
judged = "real"
why = "In the 500 mA mode the SOT-23-5 dissipates 0.57 W from a cell at 3.7 V and 1.1 W from one at 3.0 V: 157–278 °C at 230 K/W. The MCP73831 then regulates its temperature and cuts the current (DS20001984H 6.1.1.3: 1.54 W worst case) – the 500 mA the jumper promises are not reached from a low cell; edakit's model has no thermal regulation and shows the dissipation."

[[sim]]
code = "SIM.state"
place = "LED1"
judged = "known gap"
why = "The charger model does not drive STAT (the status outputs are among what the simulation leaves out, decision 17 of rules-at-scale.md: edakit check --coverage lists them): STAT floats in the model, and the two LEDs carry the current of the chain 5V – LED1 – R1 – R2 – LED2 – GND, 2 µA to 1.6 mA by the corner – the red LED too dim while charging, too bright with the cell full. On the board STAT is low while charging and lights it with about 6 mA through 470 Ω."

[[sim]]
code = "SIM.state"
place = "LED2"
judged = "known gap"
why = "As LED1: with STAT not driven by the model, the green LED carries the chain's current while the cell charges (up to 1.6 mA, expected dark) and too little with the cell full (0.7 mA, expected on) – on the board STAT high lights it with a few mA through 470 Ω."

[[fixed]]
what = "SJ1, two pads of the board's copper bridged with solder, asked for a supplier, a REACH statement and an EasyEDA device (PARTS.supplier, PARTS.fact/reach, PARTS.verified/device): the parts entry says own.what \"copper\" now – nothing bought, nothing to state (TD-127)."
[[fixed]]
what = "A charger's status LEDs, each behind its series resistor on the tri-state STAT, taken for a floating net (LVL.undefined/open_drain on STAT) – an LED cathode straight on an output counted as its load, one behind a resistor did not."
[[fixed]]
what = "R4 behind the solder jumper SJ1 – the 500 mA mode – counted by neither LIM.i/charge nor the simulation's charger model, which read only resistors straight from PROG to ground: the check now holds the position that programs the most, the model the contacts a load closes."
[[fixed]]
what = "A reversed cell carried by JP4 from its VBAT pad to 5V, and by the USB-C receptacle on to CC1 and CC2 – catalog/paths.toml let a connector pass a reversed source from every pin to every pin (PATH.reverse on U1.4, LED1.2, R5.2, R6.2): a connector now takes it on the contact it sits on and hands nothing on (TD-124)."

