# What edakit check and edakit sim find on the published GuitarML Classic Boost v2, and how each finding is judged (the words as in
# esp32-devkitc-v4/findings.toml): real (a point of the design), lacks (a fact the transcription or the datasheets
# lack), criterion (edakit's own yardstick, not the design's), known gap (edakit judges it wrong, not fixed yet – with
# the reason). The domain guitar is on. The audio path's nets are marked signal, the input jack's tip instrument (a pickup, 1 MΩ: the test's figure); spread runs every DC scenario with the 2N5088's hFE at both ends. The simulation finds nothing: the stage sits at 0.36 mA with the collector at 5.0–5.6 V over the spread, the AC run (information) gives 24 dB at 1 kHz into the collector with a pickup in front.

[[check]]
code = "DOCS.file"
place = "edakit.toml"
judged = "criterion"
why = "The transcription has no requirements file: what the published design must do stands in its own documents, not in edakit's form. edakit requires the file before a release (handbook 3.6); it is no point of the design."

[[check]]
code = "PARTS.verified"
grade = "device"
place = "POT1"
judged = "lacks"
why = "POT1, the volume (100K, the parts list's A100K): the TT Electronics P160 order code that stands in has no LCSC number in the catalogue, and a KiCad design names no EasyEDA device."

[[check]]
code = "STRUCT.prefix"
place = "SW1"
judged = "criterion"
why = "SW1 is the schematic's own reference of a wire pad – VCC to the footswitch's LED pole (board label 'SW'); KiCad does not tie references to kinds, edakit reads SW as a switch."
[[fixed]]
what = "The pads 9v1, Gnd1, In1, InG1, Out1, OutG1, SW1 and swGnd1 – the board's plated pads for a wire or a probe asked for an LCSC part or an EasyEDA device (PARTS.verified/device on the eight): their entry says own.what \"copper\" now – the board's own, nothing to buy or pick (TD-127)."
[[fixed]]
what = "The 2N5088's base, held by 430 kΩ from VCC and 43 kΩ to ground with 390 Ω under the emitter, judged as floating while 'the firmware is not running' (LVL.undefined): the board has no IC, so no pin typed VCC or ground as a rail, and a resistor to ground did not count."
