# What edakit check and edakit sim find on whbeers' Random Input, a published Fuzz Face, and how each finding is judged
# (the words as in esp32-devkitc-v4/findings.toml): real (a point of the design), lacks (a fact the transcription or the
# datasheets lack), criterion (edakit's own yardstick, not the design's), known gap (edakit judges it wrong, not fixed
# yet – with the reason). The domain guitar is on. The audio path's nets are marked signal, the effect input
# instrument (a pickup, 1 MΩ: the test's figure). The load "trimmed" holds the schematic's bias targets – TP2 (Q2's
# collector) 5.0 V, ±0.5 V the test's tolerance, and TP1 (Q1's collector) 500–700 mV – with the trimmers set for the
# typical pair of the stand-in 2N3904; spread runs it with both transistors at each end of their hFE, the extra
# scenarios with Q1 and Q2 at opposite ends, first at the same setting, then retrimmed (TP2's window only). Typical
# pair: Q2's collector at 5.0 V; trimmed so, a pair at the ends puts it anywhere from 3.4 V to 5.2 V; retrimmed, every
# pair reaches 5.0 V with TRIM2 between 3.4 and 5.4 kΩ.

[[check]]
code = "DOCS.file"
place = "edakit.toml"
judged = "criterion"
why = "The transcription has no requirements file: what the published design must do stands in its own documents, not in edakit's form. edakit requires the file before a release (handbook 3.6); it is no point of the design."

[[check]]
code = "PARTS.verified"
grade = "device"
place = "POT1"
judged = "lacks"
why = "POT1, the input volume (A100K): the TT Electronics P160 order code that stands in has no LCSC number in the catalogue, and a KiCad design names no EasyEDA device."

[[check]]
code = "PARTS.verified"
grade = "device"
place = "POT3"
judged = "lacks"
why = "POT3, the volume (A250K): the TT Electronics P160 with PC pins that stands in has no LCSC number in the catalogue (the solder-lug P160KNP-0QC20A250K, C6249458, has one), and a KiCad design names no EasyEDA device."

[[sim]]
code = "LIM.v"
place = "Q2_C"
judged = "real"
why = "The bias of a Fuzz Face rests on its transistors' gain (FT-17). Trimmed for the typical pair (TRIM2 at 5.05 kΩ: TP2 at 5.0 V), a pair at the low end of the 2N3904's hFE (40) puts Q2's collector at 3.8 V, Q1 at the low end with Q2 at the high end at 3.4 V – outside 4.5–5.5 V; the high end stays inside (5.1 V, Q1 high with Q2 low 5.2 V). Q1 weighs most: its base current through the 100 kΩ feedback sets Q2's emitter. The design's answer is its trimmers and its bias procedure: retrimmed, every pair reaches 5.0 V with TRIM2 between 3.4 and 5.4 kΩ (the extra scenarios 'retrimmed', inside the window). A builder who changes the transistors trims again."

[[sim]]
code = "LIM.v"
place = "Q1_C_Q2_B"
judged = "lacks"
why = "TP1's window, 500–700 mV, is the schematic's for 'medium gain NPN Germanium transistors': no germanium data sheet could be read, the silicon 2N3904 stands in, and with silicon Q1's collector – Q2's base – sits two base-emitter voltages above ground, 1.3–1.6 V over the spread whatever TRIM1 (Q2's emitter must carry Q1's base-emitter voltage through the 100 kΩ). A germanium pair's 0.2–0.3 V junctions put it inside; its spread and leakage need a data sheet the transcription lacks (maker-coverage GTP 1)."

[[sim]]
code = "REQ.value"
place = "POT2"
judged = "real"
why = "The fuzz control POT2 (B1K) is Q2's emitter resistor: Q2's emitter current, 0.66–0.97 mA, flows through its track, and C3 (22 µF) on its wiper sits at half the emitter voltage – 0.33–0.48 V across the half of the track between Q2's emitter and the wiper. Turned while playing, the wiper's step moves C3's charge – the crackle of a control with DC on it (maker-coverage CK-30). It is the circuit's, not this board's: the Fuzz Face's fuzz control is Q2's variable emitter degeneration, 1 kΩ bypassed through its wiper (ElectroSmash's analysis)."

[[fixed]]
what = "The test points TP1 to TP4 – the board's plated pads for a wire or a probe asked for an LCSC part or an EasyEDA device (PARTS.verified/device on each): their entry says own.what \"copper\" now – the board's own, nothing to buy or pick (TD-127)."
[[fixed]]
what = "TRIM2, Q2's collector trimmer with 3.2–4.9 V across it by design, held to one DC level on both sides like a pot turned while playing (REQ.value/switch): the kind potentiometer had no way to say trimmer. values adjust \"trimmer\" – the Bourns 3296W entries carry it – leaves it out of the rule (TD-126)."
[[fixed]]
what = "Q2's base – Q1's collector, held by TRIM1 from 9V0 – judged as floating while 'the firmware is not running' (LVL.undefined): the board has no IC, 9V0 comes in at the connector J1 from the Noise Floor IO board, and no pin types it as a supply. Now the net a source of sim.json feeds (its plus pin) is a rail for the transistors' control pins."
