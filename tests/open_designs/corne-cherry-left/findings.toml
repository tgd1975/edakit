[[fixed]]
what = "A crystal with four pads – two ground pads on its lid, the Epson FA-238V at Y1 – stopped edakit check (REQ, pin needs)."
[[fixed]]
what = "The 12 MHz crystal behind the 1 kΩ damping resistor at the RP2040's XOUT (its datasheet, 2.16, names the damping resistor) taken as missing (REQ.missing)."
[[fixed]]
what = "A bare microcontroller (kind ic, behaviour mcu) could not state the core current and on-chip regulator the model reads (PARTS.schema)."
[[fixed]]
what = "Pins on nets no simulated element reaches – the QSPI lines, SWD, the split link – judged as nan against their relative limit (LIM.v/inject, 288 rows)."
[[fixed]]
what = "The drawing put its no-connect crosses in the order of a set: with two on J1 (SBU1, SBU2) the catalog's SVG changed from run to run."
