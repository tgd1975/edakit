# Board main of led-bar: outline, holes, placement, routing, pours, silk – the PCB designer's file,
# in the layout hash (edakit handbook 10.2)

view = "top"                     # plan coordinates below are seen from the top side
edge_ok = ["U1", "J1"]           # may touch the outline (USB of the module, the connector)

[outline]                        # mm; a rectangle with rounded corners, origin lower left
rect = [90, 40]
corner_radius = 2

[[holes]]                        # M3 mounting holes: non-plated, 'keep' = radius free of parts and copper
x = 3.5
y = 3.5
d = 3.2
keep = 3.2

[[holes]]
x = 86.5
y = 36.5
d = 3.2
keep = 3.2

[tooling]                        # JLCPCB Economic PCBA tooling holes: NPTH 1.152 mm, mask 0.148 mm larger
holes = [[3.5, 36.5], [86.5, 3.5]]

[place]                          # mm, degrees, side; auto = true: a spot nobody designed – pcb place put it
                                 # next to its host, or pcb autolayout wrote back where the auto-layout left it
U1 = { x = 29, y = 14.5, rot = 0, side = "top" }
U2 = { x = 66, y = 17, rot = 90, side = "top" }
J1 = { x = 84, y = 12, rot = 90, side = "top" }
SW1 = { x = 80, y = 25, rot = 0, side = "top" }
D2 = { x = 53, y = 34, rot = 0, side = "top" }
D3 = { x = 57, y = 34, rot = 0, side = "top" }
D4 = { x = 61, y = 34, rot = 0, side = "top" }
D5 = { x = 65, y = 34, rot = 0, side = "top" }
D6 = { x = 69, y = 34, rot = 0, side = "top" }
D7 = { x = 73, y = 34, rot = 0, side = "top" }
D8 = { x = 77, y = 34, rot = 0, side = "top" }
D9 = { x = 81, y = 34, rot = 0, side = "top" }
C1 = { x = 66, y = 25, rot = 0, side = "top" }    # decoupling of U2 – the circuit wants it next to U2 (L-12)
R1 = { x = 59, y = 17, rot = 90, side = "top" }   # layout.near of the graph
C2 = { x = 29, y = 28, rot = 0, side = "top" }
D1 = { x = 75.0, y = 12.0, rot = 0, side = "top", auto = true }   # the example never ran through EasyEDA: D1 and R2
R2 = { x = 40.0, y = 30.0, rot = 0, side = "top", auto = true }   # stand where the tests put them (test_route, test_pcb)

[near]                           # the layout's own: within near_mm of the host; the circuit's are in the graph
C2 = "U1"

[routing]                        # Freerouting rules (mil); EasyEDA's DRC must accept them as well
clearance_mil = 6.5
signal_mil = 10
via = [24, 12]                   # diameter, drill
edge_clearance_um = 400
passes = 40
attempts = 5                     # retries with a reshuffled DSN when nets stay open
layer_cost = { TOP = [1.0, 1.8], BOTTOM = [1.5, 2.5] }

[routing.classes]
POWER = { width_mil = 18, nets = ["VIN", "+5V"] }
GND = { width_mil = 18, nets = ["GND"] }
SUPPLY = { width_mil = 12, nets = ["3V3"] }

[[pours]]                        # copper pours, refilled after every routing run
net = "GND"
layers = ["TOP", "BOTTOM"]

[silk]
designators = "top"              # `edakit silk` places the designators of this side where there is room
label_h_mm = 1.0
