# edakit project file: the table of contents – the project, its boards and where their files are.
# Reference: handbook/10-reference.md
#
# The example: a Raspberry Pi Pico 2 drives eight LEDs through a TLC5916 constant-current sink,
# 5 V in through a JST PH connector and a reverse-polarity diode, one push button. 2 layers, 90 x 40 mm.

[project]
name = "led-bar"                 # EasyEDA project (friendly name); edakit never creates it silently
company = "edakit example"       # schematic title block
quantity = 5                     # boards per order: the stock check (F-2) needs this many sets
graph = "hardware/graph.json"    # the single source of truth: parts, values, pins, nets, ground, check settings
parts = "hardware/parts"         # one JSON file per part
sim = "hardware/sim.json"        # simulation scenarios
schematic = "hardware/schematic.toml"   # arrangement of the schematic: blocks, notes, pin table
signoff = "hardware/signoff.json"       # sign-offs, bound to the hashes of circuit and layout
artifacts = "build/edakit"       # caches, previews, routing files, exports (not versioned)
reports = "build/release"        # one folder per release-gate run

[boards.main]
title = "LED bar"                # page name of the readable schematic
template = "generated_main"      # generated from the graph, replaced on every run
schematic = "layout_main"        # readable schematic; the PCB is linked to it
pcb = "main"                     # PCB document in EasyEDA
file = "hardware/boards/main.toml"      # outline, holes, placement, routing, pours, silk – the layout hash covers it

[release]
assembly = { sides = ["top"], smd_only = true }   # Economic PCBA: one side, SMD only (F-3)
