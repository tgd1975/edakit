# The Christmas bell's THT circuit (automatic_christmas_bell, variants/tht) on a perfboard – the plan as text, as it
# would stand in the board file of a hand-wired variant (../../perfboard-layout.md, "The plan as text").
# A prototype: written by hand on 2026-11-09, checked and drawn by perfboard.py, not by edakit.
#
# Holes: column letter and row number, A1 at the top left seen from the top (decision 10). rot is counterclockwise
# seen from the top, in steps of 90°; at is the hole of pin 1. Axial parts give their lead span in holes.

[perfboard]
kind = "pad-per-hole"                       # pad-per-hole.toml beside this file
holes = [33, 22]                            # 33 columns (A to AG) x 22 rows = 83.8 x 55.9 mm, as the PCB's 85 x 56
mounting = ["B2", "AF2", "B21", "AF21"]     # drilled out to 3.2 mm for M3 – see the README on the frame's holes

[place]
# Arduino Nano on two 1x15 female headers, USB at the left edge as on the PCB (rot 270 turns the socket end left)
U1 = { at = "P9", rot = 270 }

# The LED row along the back edge in countdown order (R-13): cathodes in row 2 on the ground wire, anodes in row 3.
# The yellow LEDs have their cathode on pin 1, the green and red ones their anode – hence 270 against 90.
LED5 = { at = "F3", rot = 90 }              # green, step 1
LED4 = { at = "I3", rot = 90 }              # green, step 2
LED3 = { at = "L2", rot = 270 }             # yellow, step 3
LED2 = { at = "O2", rot = 270 }             # yellow, step 4
LED1 = { at = "R3", rot = 90 }              # red, step 5

# Series resistors upright below their LEDs: pin 1 (Nano side) in row 8, pin 2 (anode side) in row 4
R4 = { at = "F8", rot = 90, span = 4 }
R3 = { at = "I8", rot = 90, span = 4 }
R2 = { at = "L8", rot = 90, span = 4 }
R1 = { at = "O8", rot = 90, span = 4 }
R5 = { at = "R8", rot = 90, span = 4 }

# Servo plug and its buffer capacitor at the right, the capacitor's plus on the 5 V wire of column AB
J1 = { at = "AC13", rot = 180 }             # pin 1 GND at AC13, pin 2 +5V at AB13, pin 3 signal at AA13
C1 = { at = "AB11", rot = 90 }              # plus at AB11, minus at AB9

# Buttons on the 5 V wire of row 16, their pull-downs to the ground wire of row 22, start left of reset as on the PCB
S1 = { at = "Q16", rot = 0 }                # pins 1, 2 (a) at Q16, T16; pins 3, 4 (b) at Q18, T18
S2 = { at = "W16", rot = 0 }                # a at W16, Z16; b at W18, Z18
R7 = { at = "U18", rot = 270, span = 4 }    # BTN_START to GND
R6 = { at = "AA18", rot = 270, span = 4 }   # BTN_RESET to GND

# Base load 1 W between the 5 V wire (row 16) and the ground wire (row 22)
R8 = { at = "H16", rot = 270, span = 6 }
R9 = { at = "K16", rot = 270, span = 6 }

[near]                                      # the hand-over's pairs, as in hardware/boards/tht.toml of the bell
R4 = "LED5"
R3 = "LED4"
R2 = "LED3"
R1 = "LED2"
R5 = "LED1"
R7 = "S1"
R6 = "S2"
C1 = "J1"

# ---- ground: the wire along the LED cathodes, down the right edge and back along the bottom row ----

[[wire]]
net = "GND"
path = ["F2", "AD2", "AD22", "H22"]
side = "bottom"

[[wire]]
net = "GND"
path = ["M2", "M9"]                         # to the Nano's GND (pin 4)
side = "bottom"

[[wire]]
net = "GND"
path = ["AB9", "AD9"]                       # C1 minus
side = "bottom"

[[wire]]
net = "GND"
path = ["AC13", "AD13"]                     # J1 pin 1
side = "bottom"
kind = "bridge"

# ---- +5 V: from the Nano's 5V pin into row 16, up column AB to J1 and C1 ----

[[wire]]
net = "+5V"
path = ["M15", "M16"]
side = "bottom"
kind = "bridge"

[[wire]]
net = "+5V"
path = ["H16", "AB16", "AB11"]
side = "bottom"

# ---- LED channels: resistor to anode, Nano pin to resistor ----

[[wire]]
net = "LED_G1_A"
path = ["F3", "F4"]
side = "bottom"
kind = "bridge"

[[wire]]
net = "LED_G2_A"
path = ["I3", "I4"]
side = "bottom"
kind = "bridge"

[[wire]]
net = "LED_Y1_A"
path = ["L3", "L4"]
side = "bottom"
kind = "bridge"

[[wire]]
net = "LED_Y2_A"
path = ["O3", "O4"]
side = "bottom"
kind = "bridge"

[[wire]]
net = "LED_R_A"
path = ["R3", "R4"]
side = "bottom"
kind = "bridge"

[[wire]]
net = "LED_G1"
path = ["F8", "H8", "H9"]                   # D6
side = "bottom"

[[wire]]
net = "LED_G2"
path = ["I8", "I9"]                         # D5
side = "bottom"
kind = "bridge"

[[wire]]
net = "LED_Y1"
path = ["L8", "L9"]                         # D2
side = "bottom"
kind = "bridge"

[[wire]]
net = "LED_Y2"
path = ["K9", "K10", "Q10", "Q8", "O8"]     # D3: under the Nano and out at its right end
side = "bottom"

[[wire]]
net = "LED_R"
path = ["J9", "J11", "R11", "R8"]           # D4: one row lower, around LED_Y2
side = "bottom"

# ---- servo signal under the Nano to J1 ----

[[wire]]
net = "SERVO"
path = ["F9", "F12", "AA12", "AA13"]        # D8
side = "bottom"

# ---- buttons: insulated wires on top, under the Nano between its headers and out at its right end; each ends in a
# hole beside the pin and is joined to it by a bridge below. They cross once (Q14) – on top that is allowed. ----

[[wire]]
net = "BTN_START"
path = ["C9", "C10"]                        # D11
side = "bottom"
kind = "bridge"

[[wire]]
net = "BTN_START"
path = ["C10", "C13", "Q13", "Q15", "P16", "P18"]
side = "top"
color = "orange"

[[wire]]
net = "BTN_START"
path = ["P18", "Q18"]                       # S1 pin 3
side = "bottom"
kind = "bridge"

[[wire]]
net = "BTN_START"
path = ["T18", "U18"]                       # S1 pin 4 to R7
side = "bottom"
kind = "bridge"

[[wire]]
net = "BTN_RESET"
path = ["B9", "B10"]                        # D12
side = "bottom"
kind = "bridge"

[[wire]]
net = "BTN_RESET"
path = ["B10", "B14", "R14", "R15", "V15", "V18"]
side = "top"
color = "violet"

[[wire]]
net = "BTN_RESET"
path = ["V18", "W18"]                       # S2 pin 3
side = "bottom"
kind = "bridge"

[[wire]]
net = "BTN_RESET"
path = ["Z18", "AA18"]                      # S2 pin 4 to R6
side = "bottom"
kind = "bridge"
