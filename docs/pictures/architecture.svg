<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 384" width="760" height="384" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">edakit's three layers</title>
  <desc id="d">Claude Code runs: the loop, the tools, permissions, sub-agents and hooks; bound to Claude Code. Inside it the plugin steers: skills, agents, hooks, the working agreements and the EasyEDA MCP server; bound to Claude Code's plugin format. A step that matters ends in a command of the checking core, which decides: the command line, the catalog and its engines, the simulation, the gate; bound to nothing, it runs without Claude Code. The core reads and writes the project's files, drives EasyEDA Pro or KiCad, and runs a project's own scripts and agents.</desc>
  <style>
    .bg { fill: #f4f6f6; } .station { fill: #ffffff; stroke: #d5dcdc; }
    .box { fill: #ffffff; stroke: #0e6c6a; stroke-width: 1.6; } .you { fill: #fbeee2; stroke: #b8691f; stroke-width: 1.4; }
    .ink { fill: #1d2626; } .muted { fill: #5d6b6b; } .accent { fill: #0e6c6a; } .copper { fill: #b8691f; }
    .arrow { stroke: #0e6c6a; stroke-width: 1.6; fill: none; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #111717; } .station { fill: #182020; stroke: #2c3838; }
      .box { fill: #182020; stroke: #5cc4c0; } .you { fill: #2a2118; stroke: #e0954f; }
      .ink { fill: #e3eaea; } .muted { fill: #97a6a6; } .accent { fill: #5cc4c0; } .copper { fill: #e0954f; }
      .arrow { stroke: #5cc4c0; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="accent"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="760" height="384" rx="10"/>

  <!-- Claude Code -->
  <rect class="station" x="20" y="20" width="720" height="150" rx="10"/>
  <text class="accent" x="36" y="44" font-size="14" font-weight="600">Claude Code – runs</text>
  <text class="muted" x="724" y="44" font-size="11" text-anchor="end">bound to Claude Code</text>
  <text class="ink" x="36" y="63" font-size="12">the loop, the tools, permissions, sub-agents, hooks</text>

  <!-- the plugin -->
  <rect class="box" x="40" y="80" width="680" height="72" rx="6"/>
  <text class="ink" x="56" y="104" font-size="13" font-weight="600">The plugin – steers</text>
  <text class="muted" x="704" y="104" font-size="11" text-anchor="end">bound to the plugin format</text>
  <text class="ink" x="56" y="124" font-size="12">skills, agents, hooks, the working agreements, the EasyEDA MCP server</text>
  <text class="muted" x="56" y="141" font-size="11">a project adds its own scripts and agents in edakit.toml</text>

  <!-- into the core -->
  <line class="arrow" x1="380" y1="152" x2="380" y2="210" marker-end="url(#a)"/>
  <text class="muted" x="390" y="190" font-size="11">a step that matters ends in a command: a file and an exit code</text>

  <!-- the checking core -->
  <rect class="box" x="20" y="212" width="720" height="62" rx="6"/>
  <text class="ink" x="36" y="236" font-size="13" font-weight="600">The checking core – decides</text>
  <text class="muted" x="724" y="236" font-size="11" text-anchor="end">bound to nothing – runs without Claude Code</text>
  <text class="ink" x="36" y="256" font-size="12">the command line, the catalog and its engines, the simulation, the gate</text>

  <!-- what it works on -->
  <g text-anchor="middle">
    <rect class="station" x="20" y="306" width="226" height="48" rx="6"/>
    <text class="ink" x="133" y="326" font-size="12.5">the project's files</text>
    <text class="muted" x="133" y="343" font-size="11">text in git: reads and writes</text>
    <rect class="station" x="267" y="306" width="226" height="48" rx="6"/>
    <text class="ink" x="380" y="326" font-size="12.5">EasyEDA Pro or KiCad</text>
    <text class="muted" x="380" y="343" font-size="11">drives the EDA program</text>
    <rect class="station" x="514" y="306" width="226" height="48" rx="6"/>
    <text class="ink" x="627" y="326" font-size="12.5">a project's scripts and agents</text>
    <text class="muted" x="627" y="343" font-size="11">runs them, requires their sign-offs</text>
  </g>
  <line class="arrow" x1="133" y1="274" x2="133" y2="304" marker-end="url(#a)"/>
  <line class="arrow" x1="380" y1="274" x2="380" y2="304" marker-end="url(#a)"/>
  <line class="arrow" x1="627" y1="274" x2="627" y2="304" marker-end="url(#a)"/>
  <text class="copper" x="380" y="376" font-size="12" text-anchor="middle">The core decides; the plugin steers; the harness runs.</text>
</svg>
