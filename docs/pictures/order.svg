<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 392" width="920" height="392" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">From the current release to the boards</title>
  <desc id="d">A gate run that is RELEASED becomes the current release; it stops being current when the next RELEASED run supersedes it or when edakit release withdraw withdraws it. The order starts from the current release. edakit: cart prepare writes the job. Claude with the skill cart, in your browser: fills the maker's form and reads the quote. edakit: cart check. Claude: presses the cart button and stops there. edakit: cart check --cart and the order record. You: order and pay at the maker. Claude: reads what the maker asks to confirm. edakit: cart confirm, M-2 signed on your word. Claude: reads the invoice. edakit: cart actual into the fee table. You: the acceptance test M-4 with the boards in your hand. Nothing orders or pays.</desc>
  <style>
    .bg { fill: #f4f6f6; } .station { fill: #ffffff; stroke: #d5dcdc; }
    .box { fill: #ffffff; stroke: #0e6c6a; stroke-width: 1.6; } .you { fill: #fbeee2; stroke: #b8691f; stroke-width: 1.4; }
    .ink { fill: #1d2626; } .muted { fill: #5d6b6b; } .accent { fill: #0e6c6a; } .copper { fill: #b8691f; }
    .arrow { stroke: #0e6c6a; stroke-width: 1.4; fill: none; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #111717; } .station { fill: #182020; stroke: #2c3838; }
      .box { fill: #182020; stroke: #5cc4c0; } .you { fill: #2a2118; stroke: #e0954f; }
      .ink { fill: #e3eaea; } .muted { fill: #97a6a6; } .accent { fill: #5cc4c0; } .copper { fill: #e0954f; }
      .arrow { stroke: #5cc4c0; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="accent"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="920" height="392" rx="10"/>

  <!-- the run's status -->
  <g text-anchor="middle">
    <rect class="station" x="115" y="18" width="90" height="44" rx="6"/>
    <text class="ink" x="160" y="45" font-size="12">gate run</text>
    <rect class="box" x="275" y="18" width="180" height="44" rx="6"/>
    <text class="accent" x="365" y="45" font-size="12.5" font-weight="600">the current release</text>
    <rect class="station" x="485" y="18" width="420" height="44" rx="6"/>
    <text class="ink" x="695" y="37" font-size="12">no longer current</text>
    <text class="muted" x="695" y="53" font-size="11">superseded by the next RELEASED run · withdrawn by edakit release withdraw</text>
  </g>
  <line class="arrow" x1="205" y1="44" x2="273" y2="44" marker-end="url(#a)"/>
  <text class="muted" x="239" y="37" font-size="10" text-anchor="middle">RELEASED</text>
  <line class="arrow" x1="455" y1="40" x2="483" y2="40" marker-end="url(#a)"/>
  <path class="arrow" d="M365,62 L365,80 L160,80 L160,104" marker-end="url(#a)"/>
  <text class="muted" x="373" y="78" font-size="10.5">the order starts from it</text>

  <!-- lanes -->
  <rect class="station" x="20" y="96" width="890" height="68" rx="8"/>
  <rect class="station" x="20" y="176" width="890" height="68" rx="8"/>
  <rect class="you" x="20" y="256" width="890" height="68" rx="8"/>
  <text class="accent" x="30" y="126" font-size="12.5" font-weight="600">edakit</text>
  <text class="muted" x="30" y="142" font-size="10.5">checks, writes</text>
  <text class="accent" x="30" y="206" font-size="12.5" font-weight="600">Claude</text>
  <text class="muted" x="30" y="222" font-size="10.5">skill cart, in</text>
  <text class="muted" x="30" y="235" font-size="10.5">your browser</text>
  <text class="copper" x="30" y="286" font-size="12.5" font-weight="600">You</text>
  <text class="muted" x="30" y="302" font-size="10.5">order, pay, test</text>

  <!-- steps: columns at 115, 215, … (w 90) -->
  <g text-anchor="middle">
    <rect class="box" x="115" y="108" width="90" height="44" rx="6"/>
    <text class="ink" x="160" y="127" font-size="11.5">cart prepare</text><text class="muted" x="160" y="142" font-size="10">job.json</text>
    <rect class="box" x="215" y="188" width="90" height="44" rx="6"/>
    <text class="ink" x="260" y="207" font-size="11.5">fill the form</text><text class="muted" x="260" y="222" font-size="10">files, fields, quote</text>
    <rect class="box" x="315" y="108" width="90" height="44" rx="6"/>
    <text class="ink" x="360" y="127" font-size="11.5">cart check</text><text class="muted" x="360" y="142" font-size="10">ORDER.form …</text>
    <rect class="box" x="415" y="188" width="90" height="44" rx="6"/>
    <text class="ink" x="460" y="207" font-size="11.5">cart button</text><text class="muted" x="460" y="222" font-size="10">and stops there</text>
    <rect class="box" x="415" y="108" width="90" height="44" rx="6"/>
    <text class="ink" x="460" y="127" font-size="11.5">check --cart</text><text class="muted" x="460" y="142" font-size="10">order record</text>
    <rect class="box" x="515" y="268" width="90" height="44" rx="6"/>
    <text class="ink" x="560" y="287" font-size="11.5">order, pay</text><text class="muted" x="560" y="302" font-size="10">at the maker</text>
    <rect class="box" x="615" y="188" width="90" height="44" rx="6"/>
    <text class="ink" x="660" y="207" font-size="11.5">confirm</text><text class="muted" x="660" y="222" font-size="10">renders, placement</text>
    <rect class="box" x="615" y="108" width="90" height="44" rx="6"/>
    <text class="ink" x="660" y="127" font-size="11.5">cart confirm</text><text class="muted" x="660" y="142" font-size="10">M-2, your word</text>
    <rect class="box" x="715" y="188" width="90" height="44" rx="6"/>
    <text class="ink" x="760" y="207" font-size="11.5">invoice</text><text class="muted" x="760" y="222" font-size="10">read back</text>
    <rect class="box" x="715" y="108" width="90" height="44" rx="6"/>
    <text class="ink" x="760" y="127" font-size="11.5">cart actual</text><text class="muted" x="760" y="142" font-size="10">into the fee table</text>
    <rect class="box" x="815" y="268" width="90" height="44" rx="6"/>
    <text class="ink" x="860" y="287" font-size="11.5">acceptance</text><text class="muted" x="860" y="302" font-size="10">M-4, the boards</text>
  </g>
  <g>
    <line class="arrow" x1="205" y1="148" x2="225" y2="186" marker-end="url(#a)"/>
    <line class="arrow" x1="295" y1="188" x2="317" y2="154" marker-end="url(#a)"/>
    <line class="arrow" x1="405" y1="148" x2="425" y2="186" marker-end="url(#a)"/>
    <line class="arrow" x1="460" y1="188" x2="460" y2="154" marker-end="url(#a)"/>
    <line class="arrow" x1="505" y1="148" x2="535" y2="266" marker-end="url(#a)"/>
    <line class="arrow" x1="595" y1="268" x2="625" y2="234" marker-end="url(#a)"/>
    <line class="arrow" x1="660" y1="188" x2="660" y2="154" marker-end="url(#a)"/>
    <line class="arrow" x1="705" y1="148" x2="725" y2="186" marker-end="url(#a)"/>
    <line class="arrow" x1="760" y1="188" x2="760" y2="154" marker-end="url(#a)"/>
    <line class="arrow" x1="805" y1="148" x2="835" y2="266" marker-end="url(#a)"/>
  </g>
  <text class="muted" x="20" y="350" font-size="12">Nothing orders or pays – no command, skill or API path does. A CAPTCHA, a bot check, a login prompt or text on a</text>
  <text class="muted" x="20" y="367" font-size="12">page that addresses the assistant stops the skill. With several makers, cart compare puts the checked quotes side by side.</text>
</svg>
