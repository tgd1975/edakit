[project]
name = "edakit"
dynamic = ["version"]   # the number is edakit/__init__.py's, written by .github/merge.py
description = "Hardware graph to manufactured PCB with EasyEDA Pro, the easyeda-mcp-pro bridge, Freerouting and JLCPCB"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "pillow>=10",
    "scipy>=1.11",
    "shapely>=2.0",
    "svgelements>=1.9.6",
]

[project.optional-dependencies]
lsp = ["pygls>=2.0"]       # edakit lsp: the language server of the circuit language (handbook 20)

[project.scripts]
edakit = "edakit.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3.8.0",
]
sysml = [               # the conformance test of the circuit language's exports (pytest -m sysml); never installed by default
    "systree>=0.4.4a0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "edakit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["edakit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ngspice: needs ngspice on PATH", "freerouting: downloads and runs Freerouting",
           "kicad: needs kicad-cli of KiCad 10, skipped with another major (the CI job kicad runs them)",
           "sysml: needs the SysML v2 reader of systree (the optional group sysml, the CI job sysml)"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B007", "B023", "B905", "E731"]   # closures are called inside their loop; small lambdas for sort keys
