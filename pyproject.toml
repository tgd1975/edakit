[project]
name = "edakit"
version = "0.1.0"
description = "Hardware graph to manufactured PCB with EasyEDA Pro, the easyeda-mcp-pro bridge, Freerouting and JLCPCB"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "pillow>=10",
    "scipy>=1.11",
    "shapely>=2.0",
    "svgelements>=1.9.6",
]

[project.scripts]
edakit = "edakit.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["edakit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ngspice: needs ngspice on PATH", "freerouting: downloads and runs Freerouting"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B007", "B023", "B905", "E731"]   # closures are called inside their loop; small lambdas for sort keys
