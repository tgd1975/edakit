name: Release

# A version of edakit (docs/concepts/done/versioning.md): when the number in edakit/__init__.py on main has no tag yet,
# the tag v<number> on that commit and the GitHub release with its changelog section – the marketplace entry's ref
# exists from then on. The number is written by .github/merge.py before the merge; this workflow never writes to main.
# A push that changes edakit since the last tag without a new number fails here: it came past merge.py.

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the tags
      - name: Tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(python3 .github/versions.py current)
          if git rev-parse -q --verify "refs/tags/v$n" > /dev/null; then
            echo "v$n is out already"
            python3 .github/versions.py unnumbered "v$n" HEAD
            exit $?
          fi
          python3 .github/versions.py notes "$n" > notes.md
          git tag "v$n" "$GITHUB_SHA"
          git push origin "v$n"
          gh release create "v$n" --title "edakit $n" --notes-file notes.md --verify-tag
