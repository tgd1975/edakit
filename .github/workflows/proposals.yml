name: Proposals

# Triage of proposals (issues sealed with `edakit proposal seal`, docs/concepts/done/proposals-pipeline.md, handbook
# 14.4 and 11.6): rule proposals by the repository skill triage-rule into the one open pull request from
# rules/proposals, feature proposals (Kind feature) by triage-feature into the one from features/proposals – accepted
# and built, rejected with the reason, or a question. Only the repository owner starts it: a sealed issue of the
# owner, the owner's answer to a question there, on an issue by someone else the owner's command review or accept
# (triage-request: a review, or the build) or the owner's sealed comment – either hands the issue over, label adopted
# –, or by hand (gh workflow run proposals.yml). The texts of others there reach Claude only as wrap.yml wrapped them,
# and only those before the command; the owner's reject is wrap.yml's. Every run triages the proposal that started it –
# unless a triage answered it since – and every other one still waiting, one after another through proposal.yml, at
# most eight: accepted proposals share their branch, and GitHub keeps one run waiting and cancels the one before it.
# Claude only reads; a fixed job of proposal.yml checks its commit against the pipeline's paths before anything is
# pushed – the pipeline is never changed through itself. The workflow's own token, no GitHub app; one of the secrets
# CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY; the setting "Allow GitHub Actions to create and approve pull requests".

on:
  issues:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created]
  workflow_dispatch:

concurrency:
  # only a run the job queue lets through waits in the group – the same condition as its if (a test holds them
  # equal); any other event gets a group of its own, else it cancels a waiting run (#100)
  group: >-
    ${{ (github.event.sender.login == github.repository_owner &&
    (github.event_name == 'workflow_dispatch' ||
    (!github.event.issue.pull_request &&
    ((github.event.issue.user.login == github.repository_owner &&
    contains(github.event.issue.body, 'edakit-proposal v') &&
    (github.event.action == 'opened' || github.event.action == 'reopened' ||
    (github.event.action == 'edited' && github.event.changes.body && !contains(github.event.issue.labels.*.name, 'accepted')) ||
    (github.event_name == 'issue_comment' && contains(github.event.issue.labels.*.name, 'needs-info')))) ||
    (github.event_name == 'issue_comment' && github.event.issue.user.login != github.repository_owner &&
    (contains(github.event.comment.body, 'edakit-proposal v') ||
    startsWith(github.event.comment.body, 'review') || startsWith(github.event.comment.body, 'accept'))))))
    ) && 'proposals' || format('proposals-not-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  queue:
    # started by the owner: by hand; on an issue (not a pull request) with a sealed proposal by the owner – on edits
    # only for the body and not after it was built, on comments only while the triage waits for an answer; on an issue
    # by someone else a comment of the owner that carries the seal or starts with review or accept – any other comment
    # of the owner there starts nothing (edakit/proposal.py reads the command exactly: 'reviewed' is none)
    if: >-
      ${{ github.event.sender.login == github.repository_owner &&
      (github.event_name == 'workflow_dispatch' ||
      (!github.event.issue.pull_request &&
      ((github.event.issue.user.login == github.repository_owner &&
      contains(github.event.issue.body, 'edakit-proposal v') &&
      (github.event.action == 'opened' || github.event.action == 'reopened' ||
      (github.event.action == 'edited' && github.event.changes.body && !contains(github.event.issue.labels.*.name, 'accepted')) ||
      (github.event_name == 'issue_comment' && contains(github.event.issue.labels.*.name, 'needs-info')))) ||
      (github.event_name == 'issue_comment' && github.event.issue.user.login != github.repository_owner &&
      (contains(github.event.comment.body, 'edakit-proposal v') ||
      startsWith(github.event.comment.body, 'review') || startsWith(github.event.comment.body, 'accept')))))) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    outputs:
      proposals: ${{ steps.queue.outputs.proposals }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      OWNER: ${{ github.repository_owner }}
      N: ${{ github.event.issue.number }}
      SINCE: ${{ github.event.comment.created_at || github.event.issue.updated_at }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: edakit
          persist-credentials: false
      - name: Labels
        run: |
          gh label create rule-proposal --color 1d76db --description "edakit proposal: check, hint, block, part fact" --force
          gh label create feature-proposal --color 5319e7 --description "edakit proposal: a feature a project lacked" --force
          gh label create needs-info --color fbca04 --description "triage asked back" --force
          gh label create accepted --color 0e8a16 --description "built into the proposals pull request" --force
          gh label create rejected --color b60205 --description "rejected with the reason" --force
          gh label create adopted --color c5def5 --description "an issue by someone else the owner handed to the pipeline" --force
      - name: Adopted
        # an issue by someone else, handed over by the owner's command or sealed comment: from now on the queue lists it
        if: github.event_name == 'issue_comment' && github.event.issue.user.login != github.repository_owner
        run: |
          gh issue view "$N" --json number,author,body,labels,comments > "$RUNNER_TEMP/trigger.json"
          case "$(python3 -m edakit.proposal start "$RUNNER_TEMP/trigger.json")" in
            review|accept|triage) gh issue edit "$N" --add-label adopted ;;
          esac
      - name: Queue
        # the open issues of the owner and the adopted ones; the last edit of the body of every question, so that
        # sealing again counts as an answer; the issue that started the run with its comments – then edakit/proposal.py
        id: queue
        run: |
          cd "$RUNNER_TEMP"
          gh issue list --author "$OWNER" --state open --limit 500 --json number,author,body,labels,comments > own.json
          gh issue list --label adopted --state open --limit 500 --json number,author,body,labels,comments > adopted.json
          jq -s 'add | unique_by(.number)' own.json adopted.json > open.json
          for n in $(jq '.[] | select(any(.labels[]; .name == "needs-info")) | .number' open.json); do
            gh api graphql -F owner="${GH_REPO%/*}" -F name="${GH_REPO#*/}" -F n="$n" --jq .data.repository.issue \
              -f query='query($owner: String!, $name: String!, $n: Int!) {
                repository(owner: $owner, name: $name) { issue(number: $n) { number lastEditedAt editor { login } } } }'
          done | jq -s . > edits.json
          jq --slurpfile e edits.json '[.[] | . as $i | . + ([$e[0][] | select(.number == $i.number)][0] // {})]' \
            open.json > issues.json
          if [ -n "$N" ]; then gh issue view "$N" --json number,author,body,labels,comments > trigger.json; else echo null > trigger.json; fi
          echo "proposals=$(PYTHONPATH="$GITHUB_WORKSPACE" python3 -m edakit.proposal queue issues.json trigger.json)" >> "$GITHUB_OUTPUT"

  # one proposal after another: the triage of the next starts after the publish of the one before
  p1:
    needs: queue
    if: ${{ !cancelled() && fromJSON(needs.queue.outputs.proposals || '[]')[0] }}
    uses: ./.github/workflows/proposal.yml
    with:
      n: ${{ fromJSON(needs.queue.outputs.proposals)[0] }}
    secrets: inherit
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
  p2:
    needs: [queue, p1]
    if: ${{ !cancelled() && fromJSON(needs.queue.outputs.proposals || '[]')[1] }}
    uses: ./.github/workflows/proposal.yml
    with:
      n: ${{ fromJSON(needs.queue.outputs.proposals)[1] }}
    secrets: inherit
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
  p3:
    needs: [queue, p2]
    if: ${{ !cancelled() && fromJSON(needs.queue.outputs.proposals || '[]')[2] }}
    uses: ./.github/workflows/proposal.yml
    with:
      n: ${{ fromJSON(needs.queue.outputs.proposals)[2] }}
    secrets: inherit
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
  p4:
    needs: [queue, p3]
    if: ${{ !cancelled() && fromJSON(needs.queue.outputs.proposals || '[]')[3] }}
    uses: ./.github/workflows/proposal.yml
    with:
      n: ${{ fromJSON(needs.queue.outputs.proposals)[3] }}
    secrets: inherit
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
  p5:
    needs: [queue, p4]
    if: ${{ !cancelled() && fromJSON(needs.queue.outputs.proposals || '[]')[4] }}
    uses: ./.github/workflows/proposal.yml
    with:
      n: ${{ fromJSON(needs.queue.outputs.proposals)[4] }}
    secrets: inherit
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
  p6:
    needs: [queue, p5]
    if: ${{ !cancelled() && fromJSON(needs.queue.outputs.proposals || '[]')[5] }}
    uses: ./.github/workflows/proposal.yml
    with:
      n: ${{ fromJSON(needs.queue.outputs.proposals)[5] }}
    secrets: inherit
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
  p7:
    needs: [queue, p6]
    if: ${{ !cancelled() && fromJSON(needs.queue.outputs.proposals || '[]')[6] }}
    uses: ./.github/workflows/proposal.yml
    with:
      n: ${{ fromJSON(needs.queue.outputs.proposals)[6] }}
    secrets: inherit
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
  p8:
    needs: [queue, p7]
    if: ${{ !cancelled() && fromJSON(needs.queue.outputs.proposals || '[]')[7] }}
    uses: ./.github/workflows/proposal.yml
    with:
      n: ${{ fromJSON(needs.queue.outputs.proposals)[7] }}
    secrets: inherit
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
