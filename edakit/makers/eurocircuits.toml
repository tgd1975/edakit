# Eurocircuits (Mechelen, Belgium) – the maker's profile for edakit's order form (handbook 8.4). Data, no code, no
# defaults of the board: those are edakit's keys of [order] (handbook 10.2).
#
# Recorded by ordering step 0 on 2026-10-31, signed in, up to the basket and nothing ordered
# (tests/fixtures/makers/eurocircuits/step0_2026-10-31.md): the configurator be.eurocircuits.com/shop/assembly/
# configurator.aspx with the tabs PCB Visualizer, PCBA Visualizer and Summary. The data go up as one zip of Gerber or
# ODB++ files (or .kicad_pcb, .brd); the BOM with manufacturer part numbers and the CPL in JLCPCB's columns were taken
# as edakit writes them. The basket button is on Summary, after a required tick "Accept the Eurocircuits Terms of
# Sales" – a consent in the owner's name the skill does not give. The placement opens again from the basket
# (Assembly Visualizer, CPL Editor): M-2 can wait for the basket. Values behind "More Options" were not read by step 0
# – the thickness was in live run 5.8 –: a value edakit sets there is not checked (no words).
#
# Live run 5.8 (2026-11-01, tests/fixtures/makers/eurocircuits/live_2026-11-01/): the BOM's import maps its columns
# by their names – "Manufacturer Part Number" yes, "MPN" not, and "Comment" it took for the part number ([bom]
# columns). The Assembly Editor marks a footprint whose pads differ from the board's ("does not match the board
# layout") and the PCBA tab flags "Data conflicts": that is M-2's, in the basket. Q1 so marked was a rotation
# ([cpl.turns]: the probe of the same day drew it at 270° on its pads, "No issues detected", pin 1's dot upper left
# as on the board – live_2026-11-01/turn_probe.md). C3 and R3, 0805s at 0° like C1 and R2, stayed "does not match":
# the editor hatches copper beside their pads yellow (a track meeting C3's pad at an angle, copper around R3's) – the
# board's copper, no rotation.

name = "Eurocircuits"
recorded = "2026-10-31"
start = "https://be.eurocircuits.com/shop/assembly/configurator.aspx"   # signed in on this host, not www
seat = "BE"                            # inside the EU: no import; for "sale" the owner stays the manufacturer (15.1)
currency = "EUR"
files = ["gerber", "bom_mpn", "cpl"]   # gerber_<b>.zip, bom_<b>_mpn.csv (MPN required), cpl_<b>_eurocircuits.csv
classes = ["proto", "series"]          # the services "PCB proto" and the pools (STANDARD pool …) – Eurocircuits picks
dnp = "omit"                           # a part not to place is left out of BOM and CPL
cart = "Add to basket"                 # Summary; "Proceed to Summary – to Review the Offer or Save to Basket" is a hint
never = ["Order", "Buy", "Checkout", "Proceed to checkout", "Pay", "Place order", "Confirm order", "Launch inquiry"]
excludes = []

[compliance]                           # what the maker itself states, read 2026-11-01 – the regulatory review at the order
                                       # cites it from the job (handbook 15.5)
rohs = "PCB and PCBA: a group certificate of compliance (March 2026, no signature): 'all components and all homogeneous subcomponents manufactured by the Eurocircuits Group comply with the directive 2011/65/EC [sic] … amended by Directive (EU) 2015/863'; the finishes lead-free HAL, ENIG and immersion silver – 'All of these are Lead-free and can be used for RoHS designs'; assembly with SAC 305, lead-free"
reach = "The same certificate: 'the products we supply are fully compliant with … EC 1907/2006' and 'no products from the SVHC list … nor mixtures of these products are present in the chemicals used by the Eurocircuits Group' – nothing on the 0.1 % of Art. 33 in the boards"
sources = [
  "https://www.eurocircuits.com/content/uploads/2026/03/Eurocircuits-Group-Certificates-of-Compliance-March-2026.pdf, from https://www.eurocircuits.com/downloads/ (read 2026-11-01)",
  "https://www.eurocircuits.com/technical-guidelines/pcb-manufacturing-technology/which-surface-finish-fits-your-design/ (read 2026-11-01)",
  "https://www.eurocircuits.com/services/pcb-assembly-capabilities/ (read 2026-11-01)",
]

# Fields the page shows that edakit does not set, each with its reason. The skill leaves them as Eurocircuits sets
# them; ORDER.form names any other one as a question the maker added.
[ignore]
"Select a Service" = "Eurocircuits chooses the service by the board (PCB proto, STANDARD pool) after the upload"
"Unit" = "mm, Eurocircuits' default"
"Top stencil" = "no stencil: the assembly brings its own"
"Bottom stencil" = "no stencil: the assembly brings its own"
"Bottom soldermask" = "the skill sets it to the top's colour; edakit has one mask colour"
"Bottom legend" = "the skill sets it to the top's colour; edakit has one print colour"
"Material Tg" = "Eurocircuits' standard (145-150 ºC); edakit's tg words are JLCPCB's"
"Outer layer copper foil" = "the foil before plating (18 µm, end +/-35 µm); edakit's copper_oz is the finished copper"
"Blind/Buried via runs" = "none on edakit's boards"
"Outer layer trackwidth (OL-TW)" = "measured by Eurocircuits from the data (Technology)"
"Outer layer isolation distance (OL-TT-TP-PP)" = "measured by Eurocircuits from the data (Technology)"
"Outer layer annular ring (OAR)" = "measured by Eurocircuits from the data (Technology)"
"Smallest final hole" = "measured by Eurocircuits from the data (Technology)"
"Holes <= may be reduced" = "Eurocircuits' standard (0.45 mm, live run 5.8): holes up to it may come smaller – the vias"
"Hole density" = "measured by Eurocircuits from the data (Technology)"
"Component pad pitch" = "measured by Eurocircuits from the data (Technology)"
"Technology class" = "derived by Eurocircuits"
"Peelable mask" = "not used"
"Carbon contacts" = "not used"
"UL marking" = "not used"
"Milling" = "not used"
"Specific hole tolerances" = "Eurocircuits' standard"
"Specific dimension tolerances" = "Eurocircuits' standard"
"PTH on the board edge" = "not used"                     # this and the next three: read in live run 5.8
"Round-edge plating" = "not used"
"Press-fit holes" = "not used"
"Via filling/Hole plugging" = "not used: the vias are tented"
"Depth routing" = "not used"
"Chamfered holes" = "not used"
"Copper up to board edge" = "not used"
"Edge connector gold surface mm²" = "not used"
"Edge connector bevelling" = "not used"
"Top heatsink paste" = "not used"
"Bottom heatsink paste" = "not used"
"Package quantity" = "Eurocircuits' standard"
"Wire bonding" = "not used"
"High-Voltage board" = "not used"
"Special assembly requirements" = "none"
"Automotive required" = "not used"
"Do not assemble all PCBs" = "every board is assembled"
"Total lead time" = "Eurocircuits' proposal"
"PCB Name" = "the file name of the upload"
"Purchase reference" = "the owner's, at checkout"
"Project reference" = "the owner's, at checkout"
"Article reference" = "the owner's, at checkout"
"SMS notification" = "the owner's, at checkout"
"Require Pre-Production Approval" = "pre-checked by Eurocircuits; the owner's choice"
"Accept the Eurocircuits Terms of Sales" = "a consent in the owner's name: the skill stops and asks"

[bom]
columns = ["Designator", "Quantity", "Value", "Package", "Manufacturer", "Manufacturer Part Number"]   # mapped by the
# import itself (step 0, live run 5.8); a column named "MPN" it leaves unmapped and takes "Comment" for the part number
match = "mpn"                          # Eurocircuits identifies the BOM by manufacturer part number (PARTS.fact/mpn)

[cpl]
columns = ["Designator", "Mid X", "Mid Y", "Layer", "Rotation"]   # taken as JLCPCB's: R1 at 10 mm, 10 mm, 0°, Top
unit = "mm"
zero = "IEC 61188-7"   # Eurocircuits' page "Defining Component Pin 1 and Zero-Point Rotation": pin 1 lower left,
# the polarity of a two-pole part on the left, 90° counter-clockwise – EasyEDA's footprints are not all drawn so
rotation = "cpl_<b>_eurocircuits.csv: SYNC.cpl turns each part by [cpl.turns]; the Assembly Editor showed the 0805 at 0° along X"

# Per footprint (EasyEDA's name; * and [...] as in fnmatch): the degrees Eurocircuits' rotation of a part is ahead
# of the footprint's – the footprint's zero is IEC's turned that far counter-clockwise.
# The last part of an EasyEDA name says where pin 1 sits at 0° (-BL bottom left, -BR bottom right). Live run 5.8
# drew every part on its pads but Q1, whose SOT-23 at 180° came out turned by 90°. A footprint not listed keeps its
# rotation and SYNC.cpl warns: M-2 checks it in the Assembly Editor, then it gets its line here.
[cpl.turns]
"C[0-9][0-9][0-9][0-9]" = 0                # chips: pad 1 left, pads along X (5.8: C1, C2, C4 at 0°, 270°, 90°)
"R[0-9][0-9][0-9][0-9]" = 0                # likewise (5.8: R1, R2 at 180°, 0°)
"LED-SMD_L2.0-W1.3_APTD2012SF4C" = 0       # pad 1, the cathode, left: IEC's polarity on the left (5.8: D1)
"SOIC-*-BL" = 0                            # pin 1 bottom left, the pins along X: IEC's lower left (5.8: U1)
"SOT-23-3_*-BR" = 90                       # pin 1 bottom right, pins 1 and 2 on the right, 3 on the left: IEC's
# (pin 1 lower left, pin 3 on top) turned 90° counter-clockwise (5.8: Q1 at 180°, drawn turned by 90°, is 270°)

# The form's limits: no order-number placeholder.
[rules]
thicknesses_mm = [0.2, 0.36, 0.5, 0.8, 1.0, 1.2, 1.55, 2.0, 2.4, 3.2]
thicknesses_for = "FR-4 Improved"

[fields.layers]
section = "PCB"
label = "Number of layers"

[fields.size_mm]
section = "PCB"
label = "PCB size"

[fields.quantity]
section = "PCB"
label = "PCB quantity"

[fields.delivery]
section = "PCB"
label = "Delivery format"
words = { single = "Single PCB", panel_by_customer = "Panel" }

[fields.material]
section = "PCB"
label = "Base material"
words = { "FR-4" = "FR-4 Improved" }

[fields.thickness_mm]                  # "More Options" read in live run 5.8 (2026-11-01): no 1.6 mm – 1.55 is the standard
section = "PCB"
label = "Board thickness"
unit = " mm"
values = [0.2, 0.36, 0.5, 0.8, 1.0, 1.2, 1.55, 2.0, 2.4, 3.2]

[fields.mask]
section = "PCB"
label = "Top soldermask"
words = { green = "Green", black = "Black", white = "White" }
more = true                            # "More Options" not read

[fields.silkscreen]
section = "PCB"
label = "Top legend"
words = { white = "White" }

[fields.finish]
section = "PCB"
label = "Surface finish"
words = { "LeadFree HASL" = "HAL Lead-free" }   # default "Any lead-free finish" (Eurocircuits picks)
more = true                            # ENIG and others behind "More Options", not read

[fields.electrical_test]
section = "PCB"
label = "Bare Board Testing"
words = { flying_probe = "Yes" }

# No order number at Eurocircuits: "Specific marking" stays "No"; a board with mark = "specify", a barcode or a serial
# number is refused (FILES.order), since edakit cannot say what Eurocircuits would print.
[fields.mark]
section = "PCB"
label = "Specific marking"
words = { default = "No", remove = "No" }

[fields.barcode]
section = "PCB"
label = "Specific marking"
words = { none = "No" }

[fields.serial_number]
section = "PCB"
label = "Specific marking"
words = { false = "No" }

# No such field on Eurocircuits' configurator (as read on 2026-10-31): the keys are left out of its job. The assembly
# class, the sides and the tooling follow from the data Eurocircuits analyses; the tg and the copper are its standard
# (in ignore above); shipping is chosen at checkout.
[fields]
customs = false                        # seated in the EU: no customs declaration
tg = false
copper_oz = false
inner_copper_oz = false
vias = false
outline_tolerance = false
gold_fingers = false
castellated = false
edge_plating = false
quality = false
confirm_production_file = false
paper_between = false
packaging = false
remark = false
pcba = false
sides = false
pcba_quantity = false
tooling = false
confirm_placement = false
photo_confirmation = false
bake = false
depanel = false
conformal_coating = false
function_test = false
pcba_packaging = false

[fields.ship_to]
section = "Shipping"
label = "Ship to"
checkout = true

[fields.shipping]
section = "Shipping"
label = "Shipping"
checkout = true
