# AISLER (Netherlands, with a site in Germany) – the maker's profile for edakit's order form (handbook 8.4). Data,
# no code, no defaults of the board: those are edakit's keys of [order] (handbook 10.2).
#
# Recorded by ordering step 0 on 2026-10-31, signed in, nothing ordered (tests/fixtures/makers/aisler/
# step0_2026-10-31.md). AISLER assembles only from ODB++ or the native board file: a Gerber zip gives a bare board,
# and there is no BOM or CPL upload. kicad-cli's ODB++ of led-bar was taken with every part; AISLER assigned parts by
# the component properties (it offers "Auto detect MPN", "edakit", "lcsc", "package" and "value" as the column to
# match by), left the tooling holes out (.no_pop), matched the LEDs by value only and left one diode unassigned – the
# skill reads the BOM tab back (ORDER.parts). EasyEDA's ODB++ is ordering step 0b. There is no cart: the project is
# saved as it is, and the skill stops before "Continue to Checkout"; a price shows only when every part is assigned.
#
# Live run 5.10 (2026-11-01, tests/fixtures/makers/aisler/live_2026-11-01/): AISLER assigns by the ODB++ property the
# BOM tab's "Auto assign parts using" names – "mpn" (the KiCad tool chain writes MPN and Manufacturer into every
# footprint); an MPN it lists more than once (another manufacturer, "Partner Stock") stays unassigned, and the skill
# assigns the line of the release's manufacturer – the same MPN, no other part. Stackup, colours, service and quantity
# are set on the project's page /checkout, a configuration with the price (the owner's word of 2026-11-01: the skill
# opens it by its address and stops before "Continue to Checkout"; the buttons "Checkout" and "Checkout now" stay
# untouched). Address and shipping follow "Continue to Checkout": the owner's.

name = "AISLER"
recorded = "2026-10-31"
start = "https://aisler.net/en/products/assembly"   # "Start Project" opens a new project with its upload
seat = "NL"                            # inside the EU: no import; for "sale" the owner stays the manufacturer (15.1)
currency = "EUR"
files = ["odb"]                        # odb_<b>.zip: board, parts and placement in one file (SYNC.odb)
classes = ["assembly"]                 # the service "Amazing Assembly" (also: Beautiful Boards, Simple Supply, Scalable Series)
never = ["Order", "Buy", "Checkout", "Checkout now", "Continue to Checkout", "Pay", "Place order", "Confirm order"]
excludes = []

[compliance]                           # what the maker itself states, read 2026-11-01 – the regulatory review at the order
                                       # cites it from the job (handbook 15.5)
rohs = "PCB and stencils: 'all circuit boards and stencils supplied meet the guidelines of the European Directive 2011/65/EU' (a declaration signed by the CEO, 2026-02-25). PCBA: 'components placed are project specific and hence cannot be guaranteed to comply with RoHS' – the RoHS status per component on request (compliance@aisler.net); solder paste lead-free; the form offers HASL Lead Free and ENIG (ordering step 0)"
reach = "'none of the materials falling into the criteria defined in Article 59 of REACH exceed 0.1% by net weight in our end-products' (a declaration signed by the CEO, 2026-02-25) – board and assembly not told apart"
sources = [
  "https://community.aisler.net/t/rohs-reach-compliance/85 – AISLER's knowledge base on its community site, a staff post of 2026-10-13 with the two signed declarations (read 2026-11-01)",
  "https://community.aisler.net/t/assembly-portfolio/4674 – 'Solder paste: Leadfree RoHS' (posted 2025-01-14, read 2026-11-01)",
]

[bom]                                  # no BOM upload: the parts come in the ODB++
match = "mpn"                          # AISLER assigns by manufacturer part number and knows no LCSC number (5.10, 2026-11-01)

[ignore]
"Stackup & Design Rules" = "a line AISLER derives (2L 1.6mm 35um var.)"
"Blitz Service" = "the owner's choice at checkout"
"Dimension / Size" = "the project's overview, read from the ODB++ (SYNC.odb holds its profile to the Gerber outline)"
"Layer Count" = "the project's overview, read from the ODB++"
"Minimal Drill Diameter" = "the project's overview, read from the ODB++ (SYNC.odb holds its holes to the drill files)"
"Elongated Hole Count" = "the project's overview, read from the ODB++"
"Castellated Hole Count" = "the project's overview, read from the ODB++"
"Estimated Dispatch" = "/checkout: AISLER's date for the quantity, read with the price"

# The form's limits: no order-number placeholder, no remark field.
[rules]
thicknesses_mm = [0.8, 1.6]
thicknesses_for = "2 layers, Amazing Assembly"

[fields.thickness_mm]
section = "PCB"
label = "PCB Thickness"
unit = "mm"

[fields.finish]
section = "PCB"
label = "Surface Finish"
words = { "LeadFree HASL" = "HASL Lead Free", "ENIG" = "ENIG" }

[fields.mask]
section = "PCB"
label = "PCB Color"
words = { green = "Green", white = "White", black = "Black", red = "Red", blue = "Blue" }

[fields.silkscreen]
section = "PCB"
label = "Silkscreen"
words = { white = "White", black = "Black" }

[fields.copper_oz]
section = "PCB"
label = "Copper Thickness of outer layers"
words = { 1 = "35 µm", 2 = "70 µm" }

[fields.pcba]
section = "PCBA"
label = "Service"
words = { assembly = "Amazing Assembly" }

[fields.sides]                         # the Assembly tab, from the ODB++
section = "PCBA"
label = "Sides"
words = { top = "Single-sided (top)" }

[fields.quantity]                      # /checkout: one quantity – AISLER assembles every board it makes
section = "PCB"
label = "Quantity"

[fields.ship_to]                       # after "Continue to Checkout": the owner's
section = "Shipping"
label = "Ship to"
checkout = true

[fields.shipping]
section = "Shipping"
label = "Shipping"
checkout = true

# No such field on AISLER's pages (step 0, live run 5.10): the keys are left out of its job. No order number, barcode,
# serial number or remark; the material and its tg, vias, tolerances and tests are AISLER's standard ("Stackup & Design
# Rules", in ignore); the board size and layers come from the ODB++; the tooling holes are left out (.no_pop).
[fields]
mark = false
barcode = false
serial_number = false
remark = false
customs = false                        # seated in the EU: no customs declaration
material = false
tg = false
layers = false
size_mm = false
delivery = false
vias = false
outline_tolerance = false
gold_fingers = false
castellated = false
edge_plating = false
electrical_test = false
quality = false
confirm_production_file = false
paper_between = false
packaging = false
pcba_quantity = false
tooling = false
confirm_placement = false
photo_confirmation = false
bake = false
depanel = false
conformal_coating = false
function_test = false
pcba_packaging = false
