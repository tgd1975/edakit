# The domain usb: USB-C receptacles on the board and on modules – CC termination (concept rules-at-scale.md, 5).

[domain]
name = "usb"
about = "USB-C receptacles and modules or breakouts with one: CC termination"
suggested_by = { roles = ["cc1", "cc2"], values = ["usb_c"] }   # a pin role or a value of a part in the graph

[switch]                             # the findings this domain switches on (code, or code:topic)
on = ["REQ.missing:cc", "REQ.value:cc", "REQ.forbidden:cc", "PARTS.schema:cc"]

[severity]

[review]
electrical = [
  "What an off-board module brings: a plugged-in module or breakout is a black box in the graph – its USB-C CC resistors, its VBUS diode or fuse, its regulator. What does each mean for the board: termination, a back-feed path, a second regulator on a rail? REQ.missing:cc holds the termination of a module's receptacle from values.usb_c.cc; the VBUS path and the regulator no code sees. A board bought and wired on a cable belongs in the graph as a board with bought = true (handbook 4.5).",
]

[fixtures]
clean = []
