# LCSC – the supplier's profile for the parts cart of the skill cart (handbook 8.4, docs/concepts/done/parts-order.md
# decisions 3 and 5). Data, no code: `edakit order` writes cart_lcsc.csv in the BOM tool's columns, the skill uploads
# it, reads every line back into <out>/lcsc/cart.json and stops before the checkout; `edakit order check` holds the
# cart to basket.json (ORDER.basket).
#
# Recorded on 2026-11-03 by the live run of the skill cart's mode parts (TODO.md TD-111: four projects, 23 lines,
# nothing ordered): BOM tool → "Upload BOM File" → the page "BOM Mapping" maps the three columns by itself (Comment
# becomes "Description"; "Quantity Multiple" 1, "Priority matching" Lead Time left as they are) → "Create BOM" saves
# the list in the account and matches it ("n done / n total" while it runs – the counts "Discontinued(…)" are not
# final until it is gone) → "Add to Cart" at the list's foot opens a dialog ("Include: Entire List", "Add to: <the
# current cart>") → "Add". The cart has the quantities in input fields only: the list's text carries them, so
# cart_page.txt keeps the list's line area and the cart's.

name = "LCSC"
recorded = "2026-11-03"
start = "https://www.lcsc.com/bom"
currency = "USD"
formats = ["csv", "xls", "xlsx"]          # "Support .xls, .xlsx and .csv files under 4MB" – up to 800 lines
max_lines = 800
columns = ["LCSC Part Number", "Quantity", "Comment"]   # cart_lcsc.csv, as `edakit order` writes it
upload = "Upload BOM File"
mapping = "Create BOM"                    # the foot of "BOM Mapping": saves and matches the list, orders nothing
cart = "Add to Cart"
cart_dialog = "Add"                       # the dialog's button – into the cart the dialog names "(current)"
never = ["Checkout", "Secure Checkout", "Pay", "Pay Now", "Submit Order", "Place Order", "Buy Now", "Submit BOM"]
rounds = "the BOM tool rounds each line up to LCSC's minimum and multiple on the upload (2026-11-02: 100 Ω 10 → 50; 2026-11-03: 18 of 23 lines, e.g. 5.1 kΩ 10 → 50) – a quantity above the basket's is LCSC's rounding, one below it a finding"
weight = "the cart's \"Estimated Weight\" under the shipping method: 1,500g for 26 lines on 2026-11-02 and for 23 on 2026-11-03 – apparently a flat estimate, not the parts' weight"

# The combined shipment (decision 5): a paid JLCPCB order goes to LCSC's warehouse in Hong Kong and ships with the
# LCSC order in one parcel. The skill enters this address at JLCPCB's checkout and reads it back – the one field of a
# checkout it sets; never a payment method, a coupon or a button that orders or pays – and after the owner paid
# both, ticks the JLCPCB order at LCSC's checkout, stopping before its order button.
[combine]
maker = "jlcpcb"
page = "https://www.lcsc.com/faqs/ordering-quotation/combine-lcsc-jlcpcb-orders"
read = "2026-11-02"
"Country/ Region" = "Hong Kong, China"
State = "NT"
City = "KWAI CHUNG"
"Street Address" = "NOS.35/41 TAI LIN PAI ROAD"
"Building/ House No." = "FTB1 2/F Gold Base IND. BLDG."
"Postal Code" = "999077"
"First Name" = "Sean"                    # "Recipient (Our warehouse staff or your name)": the warehouse's, so no name
"Last Name" = "Chan"                     # of the owner goes into the form
"Cell/Mobile Number" = "(+852) 36112905" # the warehouse's
conditions = [
  "both orders in the same currency and under the same customer ID",
  "one JLCPCB order only – \"LCSC cannot combine multiple JLCPCB orders\"",
  "JLCPCB's address cannot be changed after its checkout",
  "once combined, the orders cannot be split",
  "the LCSC order not shipped yet",
]
# What the first combined order showed (parts-order.md, "What the shipping cost on 2026-11-02"): together 2.8 kg LCSC
# offered express only, and combining cost 74.94 USD against 48.94 for the two cheapest separate routes – it buys
# speed and one parcel, not a lower price. LCSC shows the combined prices only after JLCPCB is paid.
express_above_g = 2000
