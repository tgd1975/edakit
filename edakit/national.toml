# National references of the regulatory review (proposal #94, handbook 15.6): per member state the national rule of
# each topic – the short reference the domains' review questions name ({national.<topic>}) and the URL of its primary
# source. A project names its country in purpose.country (graph, handbook 3.1); without it the questions name DE's
# references, as they always did. A member state without a table here gets EU – the EU rule, which the review finds
# the national transposition of. A map for the review, checked against the source on the date in `checked`; support,
# not legal advice – nothing in it is legally guaranteed, without any claim to correctness.
#
# name: what the questions and the review line name; url: the primary source; note: what stands beside it, optional.
# In EU, {country} is the member state's name.

[EU]
country = "the member state"
checked = "2026-11-01"

[EU.topics.emc]
name = "the EMC directive 2014/30/EU, Art. 4, as {country} transposes it"
url = "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32014L0030"

[EU.topics.radio]
name = "RED 2014/53/EU, Art. 7, as {country} transposes it"
url = "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32014L0053"

[EU.topics.product_safety]
name = "Regulation (EU) 2023/988 (GPSR) and {country}'s act on its market surveillance"
url = "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32023R0988"

[EU.topics.product_liability]
name = "the product liability directive 85/374/EEC, as {country} transposes it"
url = "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:31985L0374"
note = "directive (EU) 2024/2853 for products placed on the market from 9 Dec 2026"

[EU.topics.scip]
name = "the waste framework directive 2008/98/EC, Art. 9(1)(i), as {country} transposes it"
url = "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32008L0098"

[EU.topics.weee]
name = "the WEEE directive 2012/19/EU, as {country} transposes it"
url = "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32012L0019"

[EU.topics.batteries]
name = "Regulation (EU) 2023/1542 and {country}'s act on producer responsibility"
url = "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32023R1542"

[EU.topics.packaging]
name = "Regulation (EU) 2025/40 and {country}'s act on producer responsibility"
url = "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32025R0040"

