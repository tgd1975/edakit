# The codes edakit reports: one per kind of finding, ENGINE.relation (concept rules-at-scale.md, section 3).
# Each code: title, rule, why, fix, its sources, its default severity (error, warning, note, pending) and the
# severities of its grades – sub-cases a profile may grade on their own (code/grade) –, and the check IDs of
# before the restructuring it replaces (read by `edakit explain` for old protocols). Domain files set other
# severities (edakit/domains). The handbook tables are generated from this file.

[engines.STRUCT]
prefix = "STRUCT"
decides = "the graph is well-formed and names what exists"

[engines.SYNC]
prefix = "SYNC"
decides = "every artifact equals the graph and the plan"

[engines.LIMITS]
prefix = "LIM"
decides = "every quantity within its limit"

[engines.LEVELS]
prefix = "LVL"
decides = "every input defined in every state, no two drivers fight"

[engines.REQUIRES]
prefix = "REQ"
decides = "what a part requires on its pins is present and in range"

[engines.PATHS]
prefix = "PATH"
decides = "what a reversed, unfed or misplaced supply reaches"

[engines.SIM]
prefix = "SIM"
decides = "the scenarios run, are complete and reach the states they expect"

[engines.GEO]
prefix = "GEO"
decides = "copper, holes, print, widths and distances on plan and Gerber files"

[engines.FILES]
prefix = "FILES"
decides = "manufacturing files and sheets complete and consistent"

[engines.PARTS]
prefix = "PARTS"
decides = "parts entries complete, well-formed, verified, orderable"

[engines.ORDER]
prefix = "ORDER"
decides = "the order at the maker is the release: form, parts, quote, files, finish, review"

[engines.DOCS]
prefix = "DOCS"
decides = "documents and requirements quote the design"

[engines.HINT]
prefix = "HINT"
decides = "patterns that need judgement, as notes"

[retired]                  # code = "what holds it now" – out of the engines, its name never used again

[codes."STRUCT.name"]
title = "names unique"
rule = "Every designator and every net name occurs once in the graph."
why = "Everything after the graph is generated from it; two parts or nets of one name make every later step pick one of them."
fix = "Rename one of the two."
severity = "error"
details = [
  "structure: unique designators and nets, every pin in exactly one net or `nc`, nets with ≥ 2 pins, a voltage range per net, a known board per part, `bom: false` on a bought board, nets across boards only through a cable; the names in `layout` and `locks`, the `ground` net, `purpose.use` – finds e.g.: a forgotten pin, a typo in a pin reference",
]
replaces = ["G-1"]
sources = [
  "edakit handbook 3.1 and 3.2",
]

[codes."STRUCT.pin"]
title = "every pin in one net or nc"
rule = "Every pin of a part is in exactly one net or listed in the part's nc, a net names only pins the part has, and a pin in nc is in no net."
why = "A pin that is neither connected nor declared open is usually forgotten; a pin in two nets shorts them."
fix = "Connect the pin, add it to nc when it is meant to stay open, or correct the pin reference."
severity = "error"
replaces = ["G-1"]
sources = [
  "edakit handbook 3.1 and 3.2",
]

[codes."STRUCT.net"]
title = "nets well-formed"
rule = "Every net has at least two pins and a voltage range v = [min, max]; a net that spans boards does so through a cable, and the two pins of a cable wire are on one net."
why = "A net with one pin is a typo or an unfinished connection; a net without a voltage range cannot be compared with pin limits; a net across boards without a cable has no copper."
fix = "Complete the net, give it its range over all operating states, or add the cable."
severity = "error"
replaces = ["G-1"]
sources = [
  "edakit handbook 3.1 and 3.2",
]

[codes."STRUCT.board"]
title = "every part on a board"
rule = "Every part is on a board of edakit.toml [boards]; a part on a bought board stays out of the BOM (bom: false)."
why = "Plan, BOM and placement are per board; a part on no board is assembled nowhere, one on a bought board by nobody."
fix = "Set board, or bom: false for a part on a bought board."
severity = "error"
replaces = ["G-1"]
sources = [
  "edakit handbook 3.1 and 3.2",
]

[codes."STRUCT.ref"]
title = "settings name what exists"
rule = "Every name a setting of the graph uses – ground, grounds, locks, a reversible source, layout requirements, purpose.radio – is a part, pin or net of the graph."
why = "A setting that names a missing part checks nothing and says so nowhere."
fix = "Correct the name, or remove the setting."
severity = "error"
replaces = ["G-1", "G-16", "G-25"]
sources = [
  "edakit handbook 3.1 and 3.2",
  "edakit handbook 4.1 (pin types ground, power_in, power_output) and 3.3 (0 Ω bridges)",
]

[codes."STRUCT.purpose"]
title = "purpose stated"
rule = "The graph states purpose.use – private, gift or sale – and purpose.radio, where given, is \"off\" or the bands (and power) the firmware keeps, each within the part's own bands."
why = "Severities follow the purpose (the profile), and the regulatory review (M-6) starts there."
fix = "Write purpose.use; correct purpose.radio to {\"U1\": \"off\"} or {\"U1\": {\"bands_mhz\": [[from, to]], \"max_dbm\": …}}."
severity = "error"
replaces = ["G-1", "G-25"]
sources = [
  "edakit handbook 3.1 and 3.2",
  "edakit handbook 15.1 and 15.2",
]

[codes."STRUCT.lock"]
title = "pins where the firmware expects them"
rule = "Every pin in locks.pins is on its net, and a pin table in a document (locks.doc_pin_table) lists exactly the connected pins."
why = "Firmware and hardware change in different files, often in different sessions. A GPIO that moved compiles fine and fails on the board."
fix = "Change graph, firmware pin table and locks in one commit; regenerate generated tables."
severity = "error"
details = [
  "pin locks: pins the firmware relies on are on the expected nets (`locks.pins`); optionally a pin table in a Markdown document equals the graph (`locks.doc_pin_table`) – finds e.g.: firmware and hardware disagree",
]
replaces = ["G-2"]
sources = [
  "edakit handbook 3.3",
]

[codes."STRUCT.domain"]
title = "suggested domains on"
rule = "Every domain the graph suggests (edakit/domains, suggested_by) is named in [project] domains, when the project names its domains."
why = "A domain that is off reports nothing: an audio board without the domain audio passes its audio codes without a word."
fix = "Add the domain to [project] domains, or accept STRUCT.domain <domain> with the reason (edakit domains lists them)."
severity = "note"
replaces = []
sources = [
  "Concept docs/concepts/new/rules-at-scale.md, section 5: suggested domains",
]

[codes."STRUCT.entry"]
title = "graph pins = parts entry"
rule = "Every part with an LCSC number or a part number has a parts entry, its pins (number and name) equal the entry's, no supply pin is in nc, a component's config names one of its entry's configs and its states name output or bidirectional pins of the entry, each high, low or off (high not on an open-drain output), and – with the library symbol cached by edakit part import – the pins equal that symbol (case and blanks ignored); the symbol gives no number to two pins and has a pin for every pad of its footprint (grade symbol). Pins the entry's symbol_differs names follow the datasheet against the symbol on purpose: left out of the comparison and named in a note with the reason (grade declared)."
why = "Checks, simulation, schematic and BOM all read the parts entry. A shifted pin number or a missing entry makes them reason about another part than the one assembled. The library symbol is what a schematic is drawn from: a number it gives to two pins joins them on one pad (the WS2812B-V5/W's DIN on VSS), a pad it has no pin for stays unconnected (the DRV8825's PowerPAD), names swapped against the datasheet feed a regulator backwards (the XC6206) – the netlist inherits it whatever the parts entry says."
fix = "Create the entry (part-search skill); edakit part import <LCSC> reads pins from the library symbol. A symbol that differs from the datasheet: another part number whose symbol is right, an own symbol, or – where the entry follows the datasheet – symbol_differs in the entry with the reason, and the schematic checked pin by pin against the datasheet; report the symbol to the library (upstream/issue-6-easyeda-symbols.md). A config the entry does not know: one of the names the finding lists, or the configuration added to the entry's configs from the datasheet. A state: the pin's number or name in the entry, and high, low or off."
severity = "error"
grades = { symbol = "error", declared = "note" }
details = [
  "graph pins (number and name) = parts entry; an entry exists for every LCSC number; no supply pin marked `nc`; with the library's symbol cached by `edakit part import`, graph pins = that symbol (case and blanks ignored, as SYNC.schematic; `accept` on the component) – not where the entry's footprint data builds the copy's symbol as a box (`\"symbol\": \"box\"`, 4.5): the carrier's library symbol is not the copy's; the cached symbol giving one number to two pins or no pin to a pad of its footprint is grade `symbol`; pins the entry names in `symbol_differs` (`{\"<pin>\": \"reason from the datasheet\"}`) are left out of the comparison and named in a note (grade `declared`) – finds e.g.: a wrong part number, pins shifted by one, an LED whose pin 1 is the cathode, a library symbol that numbers a data input like the ground pin",
]
replaces = ["P-1"]
sources = [
  "edakit handbook 3.2 and 4.1",
]

[codes."STRUCT.identity"]
title = "graph and entry name the same part"
rule = "A component names the part of its entry: the entry's lcsc is its file name, the component's lcsc is no C99… user-library number (unless bom: false), its part names the entry's mpn, its value reads as the entry's value within 1 %, its type fits the entry's kind."
why = "A wrong LCSC number with the right value text gets the wrong part assembled while every check reasons about the entry."
fix = "Correct the component's lcsc, part, value or type, or the entry."
severity = "error"
details = [
  "part identity: the component and its parts entry name the same part – the entry's `lcsc` is its file name; the component's `lcsc` is no `C99…` user-library number (unless `bom: false`); its `part` names the entry's `mpn` (remarks in parentheses or after `;` left out, case ignored, a manufacturer before it allowed; a `part` that starts with a value, \"330 Ω 0805\", is compared as that value); its `value` reads as the entry's `value_ohm` / `value_f` / `value_h` within 1 % (\"4k7\", \"100nF\", \"2R2\"); its `type` fits the entry's `kind` (microcontroller, regulator: ic or module; transistor: npn, pnp, nmos, pmos; led: led, led_rgb; switch: switch, dip_switch; audio: buzzer; otherwise the same word); `accept` on the component. A designator prefix against the kind (R, C, L, D, Q, U, J, SW, F, BT, BZ, K, TP) is a warning – finds e.g.: C25789 written for a 74HC165 (a 464 kΩ resistor), R2 \"1k\" on a 10 kΩ entry, an LED that came in as U1",
]
replaces = ["P-6"]
sources = [
  "edakit handbook 3.1 (component fields type, lcsc, part, value), 4.1 (entry fields, kind, value parameters) and 4.2 (exact match only, C99… user libraries)",
  "reference project: decision E-15, invalid LCSC numbers checked against LCSC on 2026-10-19 (C25789, C124327, C299999, C17236, C15942, C124278, C124279, C17347) and replaced",
]

[codes."STRUCT.prefix"]
title = "designator prefix fits the kind"
rule = "The designator's letters fit the kind of its entry (R resistor, C capacitor, D diode or LED, Q transistor, U IC or module, J connector, SW switch, F fuse, BT battery holder, BZ buzzer, K relay, TP test point)."
why = "Readers of schematic and board find a part by its letters; a Q that is a diode misleads assembly and review."
fix = "Rename the part, or accept the code with the reason."
severity = "warning"
replaces = ["P-6"]
sources = [
  "edakit handbook 3.1 (component fields type, lcsc, part, value), 4.1 (entry fields, kind, value parameters) and 4.2 (exact match only, C99… user libraries)",
  "reference project: decision E-15, invalid LCSC numbers checked against LCSC on 2026-10-19 (C25789, C124327, C299999, C17236, C15942, C124278, C124279, C17347) and replaced",
]

[codes."LIM.v"]
title = "voltage within its limit"
rule = "Every voltage a part sees stays within the limit of its entry: across a capacitor, reverse across a polarized capacitor (vr_max_v, grade polarized), a pin above the supply it refers to – the pin's v_rel_max_v against the pin its ref names (null: none, a pin rated above its supply), else the part's vin_rel_max_v for its inputs, bidirectional pins and outputs against its supply; where the pin gives i_inject_max_a and only resistors feed it, the current its clamp takes against that (grade inject) –, reverse across a diode or LED – a TVS (values tvs) against its working voltage, and the rail of an ESD array (kind esd_array) against its stand-off vrwm_max_v, both without the derating factor –, VCE, VEB, VDS, VGS, on a pin (v_max_v; v_max_powered_v while the part is powered, v_max_v unpowered: grade powered; the pin's v_min_v, else an active pin not below −0.3 V, a negative rail's supply pin – role vee – excepted; against the part's own ground pin where that is not the board's ground), one supply not above another the entry orders (supply_order, grade order), on a fuse, switch, resistor or connector, and every limit a transient run sets on a net. Stage G takes the declared net ranges times the derating factor (1.5 on capacitors and semiconductors) – not the reverse voltage of a coupling capacitor in a signal path (a side on a net marked signal or instrument), whose range extremes never coincide –, stage E the simulated value against the derated limit. A net marked isolated (a MIDI-in loop, the far side of an optocoupler) has a range of its own loop: a pin there is held to it only where its part has a ground pin on an isolated net too."
why = "A part at its absolute maximum is at the edge of failure; ceramic capacitors lose capacitance and lifetime near their rated voltage, an input beyond its supply conducts through its protection diodes. The margin covers what a DC view does not see."
fix = "A part with a higher rating, level shifting at a pin, or a correct (less pessimistic) net range v."
severity = "error"
grades = { polarized = "warning", inject = "warning", powered = "warning", order = "warning" }
details = [
  "voltage domains: every net's range within `v_max_v` of every pin on it – finds e.g.: a 5-V signal on a 3.3-V GPIO",
  "voltage ratings with margin: capacitors (×1.5), diodes VRRM (×1.5), BJT VCEO, MOSFET VDS/VGS (×1.5), fuses, switches, connectors – finds e.g.: a 6.3-V capacitor on a 5-V rail",
  "stress of every part against its ratings with derating: resistor power ≤ 50 %, currents ≤ 80 %, capacitor/diode/transistor voltages ≤ 67 %, LED forward current and reverse voltage, fuse hold current at ambient, connector, switch and relay contact current, relay coil voltage, the current of every MCU output (`gpio_i_max_a`) and of all outputs together, sourced and sunk (`gpio_i_total_max_a`) – each pin may be fine and the sum beyond the package; the junction temperature of every part with `rth_ja_k_per_w` against its `tj_max_c`, and on a board of `touch_c` against the touch limit (5.3)",
  "transient limits: in every run of `transients` each limit of its `expect` – a net's lowest voltage ≥ `min_v`, highest ≤ `max_v`, a source's peak current ≤ `i_max_a` – and every MCU's supply pin, once it has reached its `vin_min_v` (`vsys_min_v`), never below it again before the run ends; actual value with the time it occurs (\"2.985 V at 1.3 ms\")",
]
replaces = ["G-3", "G-8", "E-2", "E-5"]
sources = [
  "ST USBLC6-2, Doc ID 11265 Rev 5, table 2: VRM 5.25 V (IRM 150 nA max), VBR min 6 V – an ESD array's rail against its stand-off",
  "the datasheet of each part: absolute maximum ratings, entered as vmax per pin",
  "edakit handbook 3.3 (the margins of the reference project)",
  "edakit handbook 5.3",
  "the datasheet of each part: ratings in its parts entry (MCU: gpio_i_max_a, gpio_i_total_max_a; rth_ja_k_per_w, tj_max_c)",
  "edakit handbook 5.2 (transient runs) and 5.3",
  "ngspice User's Manual, independent sources: PWL(T1 V1 T2 V2 …) holds V1 before T1; .tran starts from the DC operating point unless uic is given",
]

[codes."LIM.hazardous"]
title = "hazardous voltage recognised, not checked"
rule = "Every net's declared voltage range stays within the ES1 limit of IEC 62368-1 (60 V DC, catalog/tables/iec62368.toml); a net beyond it is hazardous voltage, and the finding says that edakit checks neither its spacing nor its isolation. An AC net is judged by its peak against the DC limit while the AC limit is not read."
why = "edakit's checks are made for safety extra-low voltage. Above the ES1 limit a fault is a shock or a fire, the safeguards – creepage, clearance, insulation, the mains input – are the standard's and a test lab's, and edakit measures none of them; a board with such a net that passed every check would look checked where it was not. So edakit says it, once per net, as an error a project must accept on purpose (rules-at-scale.md, decision 7)."
fix = "Keep the hazardous voltage off the board – a bought, certified supply that hands the board only safety extra-low voltage – or accept the finding on the net with its reason (\"mains only on the bought relay module's terminals, enclosure IP40\") and have the safeguards reviewed outside edakit (domain mains: the reviewers' questions)."
severity = "error"
sources = [
  "W. Zhang, T. LaBella: Demystifying clearance and creepage distance for high-voltage end equipment, TI Power Supply Design Seminar SLUP421: '60 V – ES1 limit', '120 V – ES2 limit' (IEC 62368-1) – https://www.ti.com/lit/pdf/SLUP421",
  "rules-at-scale.md, decision 7 (2026-10-31): mains and hazardous voltage recognised, not checked; maker-coverage CK-22",
]

[codes."LIM.i"]
title = "current within its limit"
rule = "Every current stays within its limit: through resistors, fuses (below the derated hold current), switches, connectors and cables, LEDs, diodes, collector and drain, an MCU's outputs per pin and together, a regulator's output, a supply's limit (sim.json sources); a contact's current within its rating per contact (i_contact_max_a – a supply's current at a connector shared among the connector's pins on the supply's net) and, while the contact of a switch, button, DIP switch or relay is closed, within what it may break when it opens (i_switch_max_a, grade switching); and what a fuse lets pass – its hold current at the lowest ambient – within every connector, switch and cable it protects (i_max_a, i_contact_max_a). A linear charger's programmed current (values prog_v over the resistor from its PROG pin to ground) within its own i_out_max_a and the i_charge_max_a of the cell on its battery pin – the cell state of that battery holder in any supply scenario – grade charge; with behaviour charger the simulation's charge current (precondition, float voltage and the pass element's headroom included) the same way; a constant-current LED driver's set current – the top of its sense voltage over R_S (vsense_v) – within its own i_out_max_a, and the inductor of its string saturating above the peak current, the set current × (1 + ripple_ratio / 2), within its i_sat_a (grade cc); and a pin's own current within its i_max_a, a group of pins' sourced and sunk sums within the entry's i_group_max_a, where the operating point gives them (grade pin)."
why = "A part above its current heats and wears; a connector rated below a fuse's hold current carries an overload the fuse never stops. A switch carries more than it can break: a DIP switch rated 25 mA for switching arcs and wears when it opens 100 mA. A supply above its limit drops out or switches off. A charger's PROG resistor copied from a module charges a small cell at 1 A – 2 to 7 C on a 150–500 mAh cell (maker-coverage PWR 1)."
fix = "A part with a higher rating, a fuse with a lower hold current, a driver between an MCU and its load, or less load. A trip current above a rating accepted on purpose: accept LIM.i/margin on the fuse with the reason."
severity = "error"
grades = { margin = "warning", cell = "warning", supply_pin = "warning", charge = "warning", pin = "warning", switching = "warning", cc = "warning" }
details = [
  "contacts: `i_contact_max_a` is what a closed contact carries (a connector's current rating per circuit), `i_switch_max_a` what it breaks when it opens (a switching or electrical-life rating) – the simulation holds the current through every closed contact to both; `i_max_a` stays the rating a datasheet gives without saying which – finds e.g.: a DIP switch rated 25 mA 24 V DC for its electrical life that closes a 120 Ω termination on a driven bus",
  "fuse against what it protects: the hold current of every fuse (`i_hold_a`; at the lowest ambient `ambient_min_c` of sim.json from `i_hold_vs_temp`) is at most the `i_max_a` of every connector, switch and cable its current flows through – its own nets and on through fuses and switches; a trip current (`i_trip_a`) above it is a warning – finds e.g.: a 1.5-A polyfuse in front of a connector rated 1.25 A, an overload that heats the contacts instead of tripping the fuse",
]
replaces = ["G-17", "E-2", "E-3", "E-5"]
sources = [
  "China Resources Powtech PT4115 data sheet PT4115_DS Rev EN_2.9, p. 3 mean current sense threshold A type 95 / 98 / 101 mV, p. 4 continuous SW current 1.2 A, p. 11 'IOUT = 0.1 / Rs (Rs ≥ 0.082Ω)', p. 12–13 on-time equation TON = L × ΔI / (VIN − VLED − Iavg × (Rs + rL + Rsw)), Rsw 0.6 Ω nominal, ΔI internally 0.3 × Iavg – LCSC's copy for C84512, https://datasheet.lcsc.com/datasheet/pdf/710aeebb569349bc814ba1f6ba8cbef1.pdf (grade cc)",
  "Diodes Incorporated AL8860 data sheet DS39014 Rev. 8 - 2 (April 2026), p. 3 continuous output current TSOT25 1 A, p. 4 VSENSE 96 / 100 / 104 mV and maximum duty cycle 98 %, p. 11 IOUT_NOM = 0.1 / RS, p. 13 the same on-time equation, RSW 0.3 Ω nominal, ΔI internally 0.40 × ILED – https://www.diodes.com/assets/Datasheets/AL8860.pdf (grade cc)",
  "Microchip MCP73831/2 data sheet DS20001984H (2005–2020), 5.1.2 Current Regulation Set (PROG): IREG = 1000 V / RPROG (kΩ → mA); programmable charge current 15–500 mA; RPROG range 2–67 kΩ – https://ww1.microchip.com/downloads/en/DeviceDoc/MCP73831-Family-Data-Sheet-DS20001984H.pdf (grade charge)",
  "TOPPOWER TP4056 datasheet REV_2.4, PROG pin and Programming Charge Current: IBAT = (VPROG / RPROG) × 1100, VPROG 1 V in constant-current mode; 1000 mA at RPROG 1.1 kΩ – read from LCSC's copy for C16581, https://datasheet.lcsc.com/datasheet/pdf/d328ee101cbb1f3719611cd61db479c2.pdf; other makers' TP4056 state 1200 V, so prog_v belongs to the entry (grade charge)",
  "PTTC SMD1206 HF Series, Rev. K (2017-01-03), p. 2: Ihold = maximum current the device passes without tripping, Itrip = minimum current at which it trips (23 °C still air); p. 4: thermal derating, SMD1206P150TFT 2.20 A at -40 °C, 1.50 A at 23 °C, 0.84 A at 85 °C – https://datasheet.lcsc.com/datasheet/pdf/c142bd6abe50067c0e2abbe967f2fcb5.pdf?productCode=C495353",
  "Lesson of the reference project (pytree D-31/D-32, 2026-10-20): F1 (hold 1.5 A, trip 3.0 A) in series with two JST PH connectors rated 2 A – the trip current above the contacts, judged acceptable by argument only, recorded by no check",
  "edakit handbook 5.3",
  "the datasheet of each part: ratings in its parts entry (MCU: gpio_i_max_a, gpio_i_total_max_a; rth_ja_k_per_w, tj_max_c)",
  "Espressif ESP32 Series Datasheet v5.3: table 5-4, transmit 802.11b DSSS 1 Mbps at +19.5 dBm 240 mA (50 % duty cycle), receive 95–100 mA; table 4-2, modem-sleep (radio off) 20–68 mA for the dual-core chips",
  "Universal Serial Bus Specification Revision 2.0 (April 27, 2000), 7.2.4.1 Inrush Current Limiting: at most 10 µF in parallel with 44 Ω at the downstream end of a cable",
  "Kingtek drawing DSHP01TSGER rev A (03/20/12), notes 1: '4>Electricalife Life:1000cycles 25mA 24VDC' – a switching rating without a carrying current (grade switching; LCSC's copy for C126848)",
  "JST XH connector catalogue, p. 1: 'Current rating: 3 A AC, DC (AWG #22)' – per contact (i_contact_max_a; LCSC's copy for C158012)",
]

[codes."LIM.p"]
title = "power within its limit"
rule = "Every part's dissipation stays within the derated p_max_w of its entry."
why = "Derating buys lifetime and covers worst-case supply, tolerance and ambient that a DC analysis does not see."
fix = "A part with a higher rating, another value, or another operating point."
severity = "error"
replaces = ["E-2"]
sources = [
  "edakit handbook 5.3",
  "the datasheet of each part: ratings in its parts entry (MCU: gpio_i_max_a, gpio_i_total_max_a; rth_ja_k_per_w, tj_max_c)",
]

[codes."LIM.t"]
title = "temperature within its limit"
rule = "Every part whose entry gives rth_ja_k_per_w stays at or below its junction limit (its tj_max_c, at most the criteria's) at the ambient of sim.json, and on a board people touch (touch_c) at or below the touch limit."
why = "Heat is what kills parts and burns fingers; a part in the open air can still reach its junction limit."
fix = "Lower the dissipation (a lower RDS(on), a second part, less current), more copper, or a part with a lower thermal resistance."
severity = "error"
replaces = ["E-2", "E-3"]
sources = [
  "edakit handbook 5.3",
  "the datasheet of each part: ratings in its parts entry (MCU: gpio_i_max_a, gpio_i_total_max_a; rth_ja_k_per_w, tj_max_c)",
  "UL, IEC 62368-1 Technical Brief: Touch Temperature Limits (Flore Chiang, October 22, 2010), pp. 3–4: TS1 limits derived from table 42 of IEC 62368-1, based on ISO 13732-1:2006 – metal / plastic and rubber: longer than 1 min 48 / 48 °C, 10 s to 1 min 51 / 60 °C, 1–10 s 60 / 77 °C, less than 1 s 70 / 94 °C; TS2 10 K higher",
  "AOS AO3401A Rev 3.1 (December 2023), as in edakit/parts/C15127.json: RθJA 125 K/W, TJ max 150 °C, PD 0.9 W at 70 °C",
  "ngspice: the drain current @m[id] of a MOSFET includes its body diode (@m[ibd]) – a level-1 AO3401A with its gate at its source and 5.4 V at its drain gives @m[id] = −0.947 A = @m[ibd]",
  "Diodes Incorporated DS39724 Rev. 2-2 (AP2112, June 2017), Absolute Maximum Ratings: θJA 184 °C/W in SOT25 without heatsink, TJ +150 °C – the LDO of the LILYGO T-Display, which carries the ESP32's own current",
