[codes."SYNC.odb"]
title = "ODB++ = the released files"
rule = "With a maker of [cart] makers that takes ODB++ (files = [\"odb\"] in its profile – AISLER): odb_<board>.zip, exported by EasyEDA through the patched tool easyeda_export_odb, holds to this run's files – every board layer (copper, solder mask, paste, silkscreen) rasterised as GEO.copper does and XOR'd with the Gerber layer of the same side: no spot above 0.01 mm², no layer in one and not in the other; the drill hits = the drill files (place to 1 µm, diameter, plated or not); the profile = the Gerber outline (0.05 mm); every BOM part exactly once at the place (0.01 mm), rotation (ODB++ clockwise, the CPL counter-clockwise) and side of the CPL, with the BOM's part number; a part with bom: false as the maker's profile says – left out (dnp = \"omit\"), else listed for the skill to mark; the nets of the pins as the graph's, compared as groups of pins. An export that failed or cannot be read fails. A failure for [cart] maker, a warning for another maker."
why = "AISLER assembles from ODB++, not from Gerber, and no open-source tool turns the released Gerber, BOM and CPL into ODB++: the file comes from EasyEDA, which also wrote the Gerber – but from its own state, at its own moment, through an export nobody else checks. The gate's checks hold the Gerber to the graph; SYNC.odb holds the ODB++ to the Gerber, so that what AISLER builds is what the gate released – without trusting EasyEDA."
