[codes."PARTS.library"]
title = "copy of the parts library current"
rule = "A parts entry copied from edakit's parts library (its field library) names the library version it was taken from: a library entry that has changed since is noted (grade newer), and so is a copy of an entry the owner has not signed (grade draft)."
why = "The library entry is corrected or extended after a project took its copy – a limit read again, a pin function added; the project does not learn it unless something says so. A copy stays the project's: it changes only on purpose, with edakit part add --update. An unsigned library entry is a draft – Claude wrote it from the datasheet, nobody has checked it."
fix = "Compare the versions (edakit part add <key> --update shows what changed and takes the library's version over the copy), or keep the copy and accept the note; a draft: the owner checks the library entry against its datasheet and signs it (edakit part sign <key> --by NAME), or the project signs its copy as its own entry."
severity = "note"
grades = { newer = "note", draft = "note" }
sources = [
  "rules-at-scale.md, decision 8 (2026-10-31): the library in edakit, taken over as a copy that names its version, every entry signed by the owner",
  "edakit handbook 4.1 (the parts library)",
]

[codes."PARTS.footprint"]
title = "footprint data complete"
rule = "A parts entry with footprint_data – an own footprint as text (handbook 4.5) – gives every pad its place, its shape (RECT, ELLIPSE or OVAL) and size, and a through-hole pad (MULTI) its hole; every pad number is a pin of the entry or the pad is marked mechanical, and every pin of the entry has a pad; lines, texts, polarity marks and the outline are well formed; a polarity mark '+' or '−' lies nearest to a pad whose pin role has that sign (GEO.mark's test, on the data); with \"symbol\": \"box\" the sides of the entry's symbol name pins of the entry, each once. Only where an entry of the project has footprint_data."
why = "The data is what edakit builds the project's copy from and what the layout hash covers. A pad without a pin carries no net and the board misses a connection, a pin without a pad cannot be soldered, a through-hole pad without a hole is a pad on both sides with nothing between, and a '+' next to the cathode is the reference project's 5-mm LED again (handbook 4.4). Here it is found on the text, before EasyEDA has the copy – not in the gate's silkscreen (GEO.mark) or in the polarity review M-1, whose circuit hash the data changes (decision 5)."
fix = "Complete the data in the parts entry: place, shape, size and hole of the pad from the datasheet's land pattern; a pin for every pad that carries a net, \"mechanical\": true on a mounting pad; the mark next to the pad of its sign – or the pin's role corrected where the datasheet says so. edakit part footprint KEY writes the footprint pcb dump measured as a start."
severity = "error"
details = [
  "footprint data complete – PARTS.footprint and SYNC.footprint only where a parts entry has `footprint_data` (4.5): every pad its place, its shape (`RECT`, `ELLIPSE`, `OVAL`) and size, a through-hole pad (`MULTI`) its hole; every pad a pin of the entry or `\"mechanical\": true`, every pin a pad; lines, texts, marks and outline well formed; a polarity mark nearest to a pad of its sign – GEO.mark's test (8.1) on the text; with `\"symbol\": \"box\"` the entry's `symbol` sides naming pins of the entry, each once. The same problem of several pads is one finding: `pads 1–24: shape missing` – finds e.g.: a pad the land pattern has and the entry's pins not, a \"+\" written next to the cathode",
]
replaces = ["P-9"]
sources = [
  "edakit concept 'Circuit design as code' (docs/concepts/new/design-as-text.md), gap 2, proposals 1 and 3, and decision 5 of 2026-10-28: the footprint as data in the parts entry – origin, pads in the form part import caches them, outline and print; a pad without a pin in the entry is a finding, and so is the reverse",
  "edakit handbook 4.4 (the reference project's LED footprint printed '+' next to pad 1, the cathode) and 8.1 (L-8: a sign of the silkscreen against the role of the nearest polarised pad, release/fab.py check_polarity_marks)",
  "EasyEDA Pro extension API types 0.3.50 (resources/app/assets/pro-api/0.3.50.ab46409c/api-types.d.ts, read 2026-10-29): pad shapes ELLIPSE, OVAL, RECT, NGON and POLYGON (EPCB_PrimitivePadShapeType), pad layers TOP, BOTTOM and MULTI (TPCB_LayersOfPad), holes ROUND [diameter] and SLOT [diameter, length] (TPCB_PrimitivePadHole)",
]

[codes."ORDER.form"]
title = "form = job"
rule = "edakit cart check: every field of the job (job.json, from the keys of [order] in the maker's words) is read back from the page with its value (quote.json; case and blanks ignored) – the quantities and, where the job lists parts not to place, their marks included; a field the page shows that is neither in the job nor in the profile's ignore fails."
why = "The form is the one place where the order differs from the release without any file knowing it: the reference cart still said 'Remove Mark' although the board had the placeholder, the remark was wrong three times. FILES.order holds [order] to the board; only ORDER.form holds the form to [order]. A field the maker added is a question nobody answered – the page's preset would go into the order."
fix = "Set the field on the page to the job's value and read it back; a value the form does not offer: correct [order] and run the gate. A new field: a key for it in edakit, or the field into the profile's ignore with its reason – before the order goes on."
severity = "error"
replaces = ["B-1"]
sources = [
  "edakit handbook 8.4 (the reference order: 'Remove Mark', the remark)",
  "Ordering at the manufacturer (docs/concepts/new/ordering.md, decided 2026-10-30): edakit prepares the order, Claude fills the maker's form in the owner's browser (skill cart), edakit checks what it brings back; up to the maker's cart button, never further",
]

[codes."ORDER.parts"]
title = "parts = release"
rule = "edakit cart check: the maker's matching (quote.json parts) has exactly the lines of the job's BOM – the same part numbers (LCSC or MPN, as the maker matches), the same designators; a line the maker marked (not matched, out of stock, replaced, another manufacturer, 'Standard Only') fails."
why = "The maker's BOM tool decides what is placed: a replaced part, another manufacturer or a line it could not match is a board the gate never checked and M-6 never saw. A part the maker would replace needs a new release – with it a new M-6."
fix = "A part the maker cannot place: another part in the graph (part-search), a new gate run and a new order. Never accept a replacement on the page."
severity = "error"
replaces = ["B-2"]
sources = [
  "Ordering at the manufacturer (docs/concepts/new/ordering.md, decided 2026-10-30): edakit prepares the order, Claude fills the maker's form in the owner's browser (skill cart), edakit checks what it brings back; up to the maker's cart button, never further",
  "edakit handbook 8.4 and 15.4 (M-6 reviews the parts of the release)",
]

[codes."ORDER.quote"]
title = "quote against the estimate"
rule = "edakit cart check: the board's price lines of the quote without shipping and VAT – PCB, assembly fees, parts – against the estimate of edakit cost for the board in the job, each above [cart] tolerance per price line a warning with both values; the board total above [cost] budget a warning. A maker without a fee table: the board total against the budget only."
why = "edakit cost came within about 1 $ of the reference carts; a larger difference is a fee edakit does not know, a class or a side that changed, or a field set otherwise than the job says. Shipping and VAT belong to the order, which may hold several boards – edakit cart actual compares them."
fix = "Find the line that differs: a field of the form (ORDER.form), a part line (ORDER.parts), a fee the table lacks (edakit cart actual brings real costs into the project's fee table). Accept a difference that is understood, or stop the order."
severity = "warning"
replaces = ["B-3"]
sources = [
  "edakit handbook 8.4 (the estimate within about 1 $ of the cart of 2026-10-25)",
  "Ordering at the manufacturer (docs/concepts/new/ordering.md, decided 2026-10-30): edakit prepares the order, Claude fills the maker's form in the owner's browser (skill cart), edakit checks what it brings back; up to the maker's cart button, never further",
]

[codes."ORDER.read"]
title = "read, not made up"
rule = "edakit cart check: every value of quote.json – the fields, the part numbers and designators, the price amounts, the file names, the lead time – occurs in quote_page.txt, the page text Claude kept."
why = "Both files come from Claude: ORDER.read cannot prove the page, but it finds a value that was not read – one filled in from the job or from memory, which would make ORDER.form to ORDER.quote compare the job with itself."
fix = "Read the page again and write what it shows; keep the page text whole (form, matching, quote)."
severity = "error"
replaces = ["B-4"]
sources = [
  "Ordering at the manufacturer (docs/concepts/new/ordering.md, decided 2026-10-30): edakit prepares the order, Claude fills the maker's form in the owner's browser (skill cart), edakit checks what it brings back; up to the maker's cart button, never further",
]

[codes."ORDER.files"]
title = "the same files"
rule = "edakit cart check: the SHA-256 of every upload file is still that of the job and of the current release's manifest, the job's run is still the current release, and the names – and sizes, where the page shows them – of the uploads the page lists are the job's files, none more."
why = "The second lesson of the reference order: the upload of another run's files. edakit release verify had to be run by hand right before the upload; ORDER.files checks the files and what the page says it received."
fix = "Upload the job's files again from the paths in job.json; after a new release, edakit cart prepare again."
severity = "error"
replaces = ["B-5"]
sources = [
  "edakit handbook 8.4 (release verify before the upload)",
  "Ordering at the manufacturer (docs/concepts/new/ordering.md, decided 2026-10-30): edakit prepares the order, Claude fills the maker's form in the owner's browser (skill cart), edakit checks what it brings back; up to the maker's cart button, never further",
]

[codes."ORDER.finish"]
title = "lead in the finish"
rule = "edakit cart check: a surface finish with lead (HASL that is not lead-free) in the job or on the page fails for purpose.use sale, warns for gift and is a note for private."
why = "The finish is in the layout and fab hash, not in the circuit hash M-6 reviewed: leaded HASL puts lead into the product. For a board that is sold RoHS forbids it; for a gift lead is a substance of very high concern that REACH Art. 33 asks to name to a consumer who asks."
fix = "finish = \"LeadFree HASL\" or \"ENIG\" in [order] and a new gate run; a gift with lead: accept with the statement at hand, or change the finish."
severity = "error"
replaces = ["B-6"]
sources = [
  "edakit handbook 15.1 and 15.2 (RoHS, REACH Art. 33, graded by purpose)",
  "Directive 2011/65/EU (RoHS 2) Annex II: lead 0.1 % by weight in homogeneous materials",
  "Ordering at the manufacturer (docs/concepts/new/ordering.md, decided 2026-10-30): edakit prepares the order, Claude fills the maker's form in the owner's browser (skill cart), edakit checks what it brings back; up to the maker's cart button, never further",
]

[codes."ORDER.review"]
title = "regulatory review of this order"
rule = "edakit cart check: regulatory.md, the result of the agent regulatory-reviewer on the order, exists, names the SHA-256 of job.json and quote.json as they are now and ends with the line 'Order: OK'. Without it the check is open (exit 3); another hash, 'Order: not OK' or another last line fails."
why = "M-6 reviewed the circuit; the order adds what M-6 never saw – the finish and the other keys, the quantity against the purpose, where the maker sits, parts the owner supplies. A new quote is another order: its hash changes and the review must see it. Whether every finding 'important' is settled is the agent's judgement, as for M-6; edakit checks the line and the hashes."
fix = "Run the agent regulatory-reviewer on the order (skill cart, step 8) and write its result unchanged to regulatory.md; settle a 'block' with a new release, an 'important' as a numbered decision."
severity = "error"
grades = { open = "pending" }
replaces = ["B-7"]
sources = [
  "edakit handbook 15.4 (M-6) and the agent regulatory-reviewer, section 'At the order'",
  "Ordering at the manufacturer (docs/concepts/new/ordering.md, decided 2026-10-30): edakit prepares the order, Claude fills the maker's form in the owner's browser (skill cart), edakit checks what it brings back; up to the maker's cart button, never further",
]

[codes."DOCS.quote"]
title = "documents quote the design data"
rule = "Every value block in a Markdown file of [docs] files equals its source – a graph value, a parts entry field, the simulation result or the text of a need or requirement of [project] requirements (req:) – and every source quoted in a block or in a placeholder of the schematic notes exists; a need or requirement quoted is not dropped."
why = "Numbers in descriptions, decisions and schematic notes are typed once and then lag behind the circuit: a resistor swapped, a margin changed, a part removed. Reviewers and the next session read the stale number as a fact. A requirement copied into a README lags behind the requirements file the same way, and a dropped one still reads as if it held."
fix = "edakit docs --write fills in the current values. A source that no longer exists: quote the part or net that replaced it, or drop the block. A dropped need or requirement: quote the entry that holds now, or drop the block; req: needs [project] requirements. Documents are in no hash, so this voids no sign-off."
severity = "error"
details = [
  "documents quote the design data: every value block of `[docs] files` equals its source – a requirement's text too (`req:`, 3.6) –, every source of a block or a schematic-note placeholder exists, a quoted need or requirement is not dropped – run by `edakit docs` and the gate's stage G, not by `edakit check` (6.6) – finds e.g.: a description still on an old graph version, a current that changed with R1, a README with last month's R-4",
]
replaces = ["G-19"]
sources = [
  "edakit handbook 6.6 and 3.6",
  "Concept docs/concepts/new/requirements.md, 'Scope': the documents quote a requirement by its ID in a value block (step 3.5)",
]

[codes."DOCS.ref"]
title = "requirement references resolve"
rule = "In the requirements file of [project] requirements, every reference of a requirement that is not dropped resolves: a need or requirement in from (N-…, R-…) stands in the files, a manual check in from or in verify signoff (M-…) is one of the sign-off file or one the gate requires, a rows pattern that starts with a code names a code of the catalog (one that starts with a check ID of before is a finding naming the codes that replace it), and verify script names an entry [scripts.<name>] of kind check or the id of a [[release.stages]]. A from that names a dropped need or requirement is a warning. About a draft – status draft, or no status – every finding is a warning in edakit check and information in the gate: a draft never blocks; it is an error once the user accepts the requirement."
why = "A requirement is traced through its references: where it comes from and what tests it. A typo in an ID – N-12 for N-2, LIM.vv for LIM.v, M-7 for M-6 – breaks the chain without anybody noticing: the gate finds no protocol row for the pattern and the requirement fails for the wrong reason, or it points to an origin that does not exist. A requirement that comes from a dropped need may no longer be wanted at all."
fix = "Correct the ID, or add what it names: the need or requirement to the requirements file, the manual check to the sign-off file, the check to [scripts]. A from that names a dropped entry: drop the requirement too, or name what it comes from now. Decisions (D-…), standards and documents in from are words to edakit, it does not resolve them."
severity = "error"
grades = { margin = "warning", draft = "warning" }
details = [
  "requirement references resolve – DOCS.ref to DOCS.draft only with `[project] requirements` (3.6), on every entry that is not dropped: a need or requirement in `from` (N-…, R-…) is in the files, a manual check in `from` or in `verify` `signoff` (M-…) is one of the sign-off file or a required one (8.2), a `rows` pattern that starts with a code names a code of the catalog – a check ID of before is a finding with the codes that replace it –, a `script` is an entry `[scripts.<name>]` of kind `check` or the id of a `[[release.stages]]`; a `from` that names a dropped need or requirement is a warning. Decisions, standards and words in `from` are not resolved. About a draft every finding is a warning – an error once the user accepts the requirement (3.6) – finds e.g.: `from = [\"N-12\"]` for N-2, `rows = \"LIM.vv *\"`, `rows = \"E-3 *\"`, `signoff = \"M-7\"`, a requirement that still comes from a dropped need",
]
replaces = ["G-20"]
sources = [
  "edakit handbook 3.6, 8.7 and 10.4",
  "Concept docs/concepts/new/requirements.md, 'Traceability and the gate' and its decisions of 2026-10-28",
  "The user's decision of 2026-10-28, after step 1.6: a draft never blocks – errors and blocking start with status = \"accepted\"",
]

[codes."DOCS.need"]
title = "accepted need has a requirement"
rule = "Every accepted need of the requirements file is named in from of at least one requirement that is not dropped."
why = "A need says what someone wants, in their words; only a requirement makes it testable – a quantity, a limit, a condition – and points to its evidence. An accepted need that no requirement takes up is a wish the circuit is never measured against: the chain from the need to the evidence ends before it starts."
fix = "Write the requirement that follows from the need (from = [\"N-…\"], with binding and verify), or name the need in the from of an existing requirement. A need that is no longer wanted gets status = \"dropped\" with its reason."
severity = "error"
grades = { draft = "warning" }
details = [
  "accepted need has a requirement: every accepted need is in `from` of a requirement that is not dropped – finds e.g.: a need the user accepted that no requirement made testable",
]
replaces = ["G-21"]
sources = [
  "edakit handbook 3.6 and 10.4",
  "Concept docs/concepts/new/requirements.md, 'Traceability and the gate': every need leads to requirements",
]

[codes."DOCS.evidence"]
title = "requirement has evidence"
rule = "Every requirement of the requirements file that is not dropped has evidence: at least one entry in verify – rows of the gate protocol, a manual check, a project script or a step of the acceptance test. For a draft – status draft, or no status – it is a warning in edakit check and information in the gate; an error once the user accepts the requirement."
why = "A requirement without evidence is a promise nobody checks: the gate cannot tell whether the circuit meets it, and its binding decides nothing. The evidence often exists already – a simulation scenario, a check, a review – and only the pointer to it is missing. While a requirement is a draft, the file is being written and its evidence may still be missing: the pre-commit hook lets it pass; once the user accepts it, the gate must be able to evaluate it."
fix = "Add verify: rows of the gate protocol ({ rows = \"SIM.state * J1 current from the supply\" }), a manual check whose note names the requirement ({ signoff = \"M-1\" }), a project script ({ script = \"…\" }) or a step of the acceptance test ({ accept = \"…\" }) – what only a delivered board can show is an acceptance step."
severity = "error"
grades = { draft = "warning" }
details = [
  "requirement has evidence: every requirement that is not dropped has `verify` – for a draft a warning, an error once accepted – finds e.g.: a requirement the gate has nothing to evaluate for",
]
replaces = ["G-22"]
sources = [
  "edakit handbook 3.6, 8.7 and 10.4",
  "Concept docs/concepts/new/requirements.md, 'Traceability and the gate': every requirement ends in evidence",
  "The user's decision of 2026-10-28, after step 1.6: a draft never blocks – errors and blocking start with status = \"accepted\"",
]

[codes."DOCS.draft"]
title = "draft not approved"
rule = "A need or requirement of the requirements file that is a draft – status draft, or no status – is a warning in edakit check until the user accepts it or drops it with a reason. In the gate it is information: a draft binds nothing yet – it never blocks the release and needs no acceptance; section 11 of the protocol lists a draft requirement with its evidence as evaluated."
why = "Claude drafts requirements, only the user approves them: like accepting a warning, it is one of the user's decisions. Until then the requirement binds nothing – the gate evaluates and lists it, but does not hold the circuit to it: a draft left standing is a requirement the release was never held to."
fix = "The user decides: status = \"accepted\", the text changed and then accepted, or status = \"dropped\" with a reason. Nothing to accept in the sign-off file: a draft does not hold up the release."
severity = "warning"
grades = { draft = "warning" }
details = [
  "draft not approved: a need or requirement with `status = \"draft\"`, or without `status`, is a warning until the user accepts or drops it; in the gate information – a draft never blocks the release and needs no acceptance (8.7) – finds e.g.: a requirement Claude wrote and nobody approved, which the release is not held to",
]
replaces = ["G-23"]
sources = [
  "edakit handbook 3.6, 8.7 and 11.4 (working agreement 4: only real decisions go to the user)",
  "Concept docs/concepts/new/requirements.md, 'Proposal: the requirements file': the agent drafts, the user approves",
  "The user's decision of 2026-10-28, after step 1.6: a draft never blocks – errors and blocking start with status = \"accepted\"",
]

[codes."HINT.datasheet"]
title = "notes of the parts entries"
rule = "A parts entry's own warnings – hints of the part, hint of a connected pin (an ESP32 pin of ADC2: no analog reads while Wi-Fi is on) – are shown for every part and pin of the graph they belong to."
why = "A datasheet's warning that no check can decide is still knowledge; it belongs where the part is used."
fix = "Consider the note where the part is used; what is taken care of: accept HINT.datasheet <place> with how."
severity = "note"
replaces = []
sources = [
  "edakit handbook 4.1 (hints and hint in a parts entry)",
]

[codes."HINT.bulk"]
title = "bulk capacitor at the power input"
rule = "Bulk capacitor at the power input: consider it where it applies."
why = "A supply cable has inductance. With only ceramic capacitors at the input, plugging in rings, and the voltage can overshoot to about twice the supply. Load steps (a servo starting, LEDs switching) also need charge close to the input."
fix = "An electrolytic or polymer capacitor of 10–100 µF near the input connector - its series resistance damps the ringing - rated at least 1.5 × the input voltage (LIM.v)."
severity = "note"
when = { match = "power_input" }
replaces = ["H-1"]
sources = [
  "Linear Technology AN88, Ceramic Input Capacitors Can Cause Overvoltage Transients (2001) – https://www.analog.com/media/en/technical-documentation/application-notes/an88f.pdf",
]

[codes."HINT.gate"]
title = "MOSFET gate resistor"
rule = "MOSFET gate resistor: consider it where it applies."
why = "The gate capacitance and the inductance of the drive loop form a resonant circuit; a fast edge makes it ring, which can exceed VGS max and radiate. A GPIO that switches a small MOSFET slowly rarely needs anything."
fix = "10–100 Ω in series with the gate, close to the gate, when the driver is fast or far from the gate; keep the gate-source resistor (LVL.undefined)."
severity = "note"
when = { match = "driven_gate" }        # a MOSFET whose gate a signal drives – not one on a rail (a level shifter)
replaces = ["H-2"]
sources = [
  "TI SLUA618A, Fundamentals of MOSFET and IGBT Gate Driver Circuits (2018), 2.8 Effects of parasitic components – https://www.ti.com/lit/ml/slua618a/slua618a.pdf",
]

[codes."HINT.debounce"]
title = "debounce buttons and switches"
rule = "Debounce buttons and switches: consider it where it applies."
why = "Mechanical contacts bounce: Ganssle measured about 1.6 ms on average and up to 6 ms, one switch 157 ms. A counter or an interrupt sees several presses."
fix = "Debounce in firmware: sample every 5–10 ms and accept a level after it was stable several times. An RC filter with a Schmitt-trigger input only where firmware cannot, for example a wake-up from sleep."
severity = "note"
when = { match = "read_switch" }        # a button or switch an MCU pin reads – not a DIP switch nobody reads
replaces = ["H-3"]
sources = [
  "Jack Ganssle, A Guide to Debouncing – http://www.ganssle.com/debouncing.htm",
]

[codes."HINT.inductive"]
title = "inductive load off the board"
rule = "Inductive load off the board: consider it where it applies."
why = "A motor, solenoid or relay at the end of a cable stores energy in its coil like one on the board, but REQ.missing sees only coils that are parts of the graph. When the transistor switches off, the coil's voltage spike lands on it."
fix = "If the load at this connector is inductive: a diode across the connector's load pins on the board, cathode at the supply pin; a Schottky for PWM."
severity = "note"
when = { match = "transistor_at_connector" }
replaces = ["H-4"]
sources = [
  "TE Connectivity, The Application of Relay Coil Suppression with DC Relays (white paper) – https://www.te.com/en/products/relays-and-contactors/relays/intersection/relay-coil-suppression-dc-relays.html",
]

[codes."HINT.switcher"]
title = "switching regulator layout"
rule = "Switching regulator layout: consider it where it applies."
why = "The loop of input capacitor, switch and diode or second switch carries pulsed current; its area radiates and its inductance rings. A ceramic input capacitor helps only next to the IC's VIN pin."
fix = "Input capacitor next to the VIN and GND pins, the loop as small as possible, and the loop listed in layout.loops of the graph so that GEO.loop checks it."
severity = "note"
when = { match = "switching_regulator" }
replaces = ["H-5"]
sources = [
  "TI SNVA021C, AN-1149 Layout Guidelines for Switching Power Supplies (2013), 3 Filter capacitors – https://www.ti.com/lit/an/snva021c/snva021c.pdf",
]

[codes."HINT.lithium"]
title = "lithium cells need protection"
rule = "Lithium cells need protection: consider it where it applies."
why = "Li-ion and LiPo cells must not be over-discharged (below about 2 V per cell), overcharged or short-circuited, and protection circuits are mandatory for Li-ion packs. Alkaline and NiMH cells tolerate all of this far better."
fix = "For lithium cells: protected cells or a protection IC between holder and circuit; a cut-off in the firmware is not enough while the MCU is off. For alkaline or NiMH cells nothing is needed."
severity = "note"
when = { match = "unprotected_cell" }   # a holder whose cell no protection IC guards (od/oc driving a MOSFET in its minus)
replaces = ["H-6"]
sources = [
  "Battery University BU-304, Why are Protection Circuits Needed? – https://batteryuniversity.com/article/bu-304-why-are-protection-circuits-needed",
  "Battery University BU-304a, Safety Concerns with Li-ion – https://batteryuniversity.com/article/bu-304a-safety-concerns-with-li-ion",
]

[codes."HINT.esd"]
title = "ESD at external connectors"
rule = "ESD at external connectors: consider it where it applies."
why = "A connector that a person touches or plugs a cable into sees electrostatic discharges of several kilovolts. A line that runs straight to an IC pin relies on the IC's internal protection."
fix = "For lines that leave the enclosure: an ESD diode (TVS) per line, as near to the connector as the design rules allow; a series resistor on slow signal lines."
severity = "note"
when = { match = "connector_signal" }
replaces = ["H-7"]
sources = [
  "TI SLVA680A, ESD Protection Layout Guide (2022) – https://www.ti.com/lit/an/slva680/slva680.pdf",
]

[codes."HINT.two_supplies"]
title = "two supplies on one net"
rule = "Two supplies on one net: consider it where it applies."
why = "Where two supplies meet on one net, the higher one feeds the other whenever its path has nothing that blocks: primary cells get charged, a PC's USB port takes current, a body diode conducts and heats. A single P-MOSFET switched off by the other supply is no block – its body diode conducts from drain to source. PATH.reverse looks at a reversed source only, and the simulation shows the back-feed only in a scenario with both supplies on and the other one higher. Whether it matters – cells that may be charged, a host that tolerates it, an operating rule – is a judgement."
fix = "A blocking element in every path that must not be fed: a Schottky diode (0.3–0.5 V drop), two P-MOSFETs back-to-back with a common source (block power-or-pmos), or an ORing controller. Or an operating rule that firmware or manual enforce (one of the two unplugged). The hint names the net and marks the supplies that reach it without a block; record how it is handled: \"accept\": {\"HINT.two_supplies\": \"Q8/Q9 back-to-back, D40\"}."
severity = "note"
when = { match = "two_supplies" }
replaces = ["H-8"]
sources = [
  "AOS AO3401A, Rev 3.1 (December 2023), p. 2: body diode forward voltage VSD -0.7 V typ., -1 V max. at IS = -1 A and VGS = 0 V, body-diode continuous current IS -2 A – the diode conducts with the MOSFET off – https://datasheet.lcsc.com/datasheet/pdf/fee353dd1e9e0bc90b295f14f381aa4c.pdf?productCode=C15127",
  "Lesson of the reference project (pytree D-44, 2026-10-23): with one AO3401A cutting three AA cells off while USB-C was plugged, fresh lithium cells (5.4 V) fed through its body diode, about 0.7 W and up to 125 °C on a touchable underside; a second AO3401A back-to-back fixed it",
  "Lesson of the reference project (pytree D-47, USB tree, 2026-10-25): the module's 5V pin is its USB VBUS without a diode and J1 feeds the same rail through D32 – a source at J1 above the PC's VBUS feeds the PC through the module (about 0.2 A at 5.25 V against 4.75 V, second check M-1); accepted with an operating rule",
]

[codes."HINT.readback"]
title = "read-back of a serial output"
rule = "Read-back of a serial output: consider it where it applies."
why = "Shift registers and constant-current LED drivers shift on the rising clock edge and change their serial output a propagation delay after it – the STP08CP05 typically 21–24 ns and at most 32 ns at 3.3 V, the TLC5916 12–30 ns at 3 V. SPI mode 0 samples on that same rising edge: a read-back in mode 0 works only while the delay is longer than the MCU's input hold time, and only the datasheet's minimum delay counts – the STP08CP05 states none. Mode 1 samples on the falling edge, but shifts the MCU's own data out on the rising edge, where the part samples its serial input. The SPI mode is the firmware's, so no program decides this from the graph, and the question gets lost between the concept and the code."
fix = "Look up the output's delay after the clock edge (out_edge and t_pd_ns on the pin of the parts entry) and the MCU's SPI input hold time in the mode the firmware uses. If the minimum delay is not safely longer: read back by bit-bang, sampling after the falling edge, or test the SPI read on the first board with bit-bang as the planned fallback. Record the decision in the graph: \"accept\": {\"HINT.readback\": \"…\"}."
severity = "note"
when = { match = "read_back" }
replaces = ["H-9"]
sources = [
  "ST DocID13524 Rev 8 (STP08CP05, August 2018), table 8 Switching characteristics: CLK-SDO tPLH 21/28 ns (typ/max) at VDD 3.3 V and 17/22 ns at 5 V, tPHL 24/32 ns at 3.3 V and 19/25 ns at 5 V, no minimum; table 9 and figure 8: data shifts and SDO changes on the rising CLK edge",
  "TI SLVS695D (TLC591x, June 2007, revised January 2015), pin functions: CLK \"Clock input for data shift on rising edge\"; 7.7 Switching Characteristics (VDD 3 V): tPLH4 and tPHL4 CLK to SDO 12/20/30 ns (min/typ/max)",
  "Wikipedia, Serial Peripheral Interface, section Mode numbers (read 2026-10-26): mode 0 (CPOL 0, CPHA 0) shifts data out on the falling SCLK and samples on the rising SCLK; mode 1 shifts on the rising and samples on the falling SCLK",
]

[codes."HINT.motor_supply"]
title = "motor supply: bulk capacitor and returned energy"
rule = "A motor on the board: consider the bulk capacitor at its driver's motor supply and where its returned energy goes."
why = "A motor draws its start current from the supply in pulses and gives energy back when it brakes or its driver switches off. Without a bulk capacitor at the driver the supply rings and dips; behind a series diode the returned energy has nowhere to go and lifts the motor supply above the driver's rating (maker-coverage MOT 5, MOT 9)."
fix = "A bulk electrolytic at each driver's motor supply pin, sized from the driver's datasheet; no series diode in front of the motor supply, or a clamp (TVS, a braking resistor) behind it. Run the start and the stall as load steps in a transient run (edakit handbook 5.2)."
severity = "note"
when = { kinds = ["motor", "solenoid"] }
sources = [
  "docs/concepts/new/maker-coverage.md, appendix MOT 5 (TI DRV8833 datasheet, tagged to verify) and MOT 9 (Pololu A4988 product page, tagged extracted)",
]

[codes."HINT.heater"]
title = "a heater needs a second interruption"
rule = "A heater on the board: consider a second, independent way to switch it off."
why = "The MOSFET or solid-state relay that switches a heater fails closed often enough; then the firmware can no longer stop it, and a heated bed or a cartridge runs away (maker-coverage MOT 30)."
fix = "A thermal fuse at the heater, a relay or the supply's enable that a watchdog or the firmware's thermal protection drops, independent of the switching transistor."
severity = "note"
when = { kinds = ["heater"] }
sources = [
  "docs/concepts/new/maker-coverage.md, appendix MOT 30: Marlin Configuration.h (thermal protection), Klipper Config_Reference, Voron documentation – read in full in the maker-coverage research",
]

[codes."HINT.audio_ground"]
title = "audio: ground loops and shared returns"
rule = "A speaker or an analog path on the board: consider where its ground returns and what shares it."
why = "Hum and buzz come from loops through USB or mains earth, from large currents returning under an input's reference, from an amplifier's supply shared with switching loads or a radio, and from RF rectified at an input (maker-coverage AUD 6, AUD 8)."
fix = "One return point for the audio path; the amplifier's supply filtered from switching loads and the radio; an RC low-pass or a ferrite at inputs on a board with a radio."
severity = "note"
when = { kinds = ["speaker"] }
sources = [
  "docs/concepts/new/maker-coverage.md, appendix AUD 6 (ESP-IDF ADC documentation, read in full) and AUD 8 (OpenEnergyMonitor documentation, read in full)",
]

[codes."HINT.class_d"]
title = "filterless class-D output on a cable"
rule = "A bridge-tied output reaches a connector: consider a filter at the output."
why = "A filterless class-D amplifier relies on the speaker's inductance near the board; on a lead its switching edges radiate (maker-coverage AUD 1, HT-13)."
fix = "A ferrite or an LC filter at the outputs above the lead length the amplifier's datasheet allows; the speaker on short, twisted leads."
severity = "note"
when = { match = "btl_output" }
sources = [
  "docs/concepts/new/maker-coverage.md, appendix AUD 1 (PAM8403 and Adafruit MAX98357A, tagged to verify)",
]

[codes."HINT.audio_switching"]
title = "switching in the audio band"
rule = "A switching regulator, a charge pump or a PWM net on a board with an audio path: consider what it puts into the audio band."
why = "Charge pumps whine near 10 kHz, boost converters burst at light load, LED and tap-tempo PWM ticks through supply and ground into the signal (maker-coverage AUD 12, GTP 17)."
fix = "Switching above 20 kHz or filtered from the audio rail; a separate return for the switching current; PWM of LEDs on a board with audio above the audio band."
severity = "note"
when = { match = "switching_near_audio" }
sources = [
  "docs/concepts/new/maker-coverage.md, appendix GTP 17 (ElectroSmash CE-2 analysis and Bontempo, read in full) and AUD 12 (TC1044S, LT1054, tagged to verify)",
]

[codes."HINT.signal_ceramic"]
title = "class-2 ceramic in a signal path"
rule = "A class-2 ceramic capacitor (X5R, X7R, Y5V …) on a net with an analog pin: consider whether it sits in the signal path."
why = "The capacitance of class-2 ceramics changes with the voltage across them, so a signal through one is distorted; C0G and film capacitors do not (maker-coverage GTP 24, GTI 36)."
fix = "C0G or film in the signal path; class-2 ceramics for decoupling only."
severity = "note"
when = { match = "ceramic_in_signal_path" }
sources = [
  "docs/concepts/new/maker-coverage.md, appendix GTI 36 (PJRC Audio library, read in full)",
]

[codes."HINT.jack_battery"]
title = "battery switched by the input jack"
rule = "A battery on a board with an instrument input: consider how it is switched off."
why = "Pedals and active instruments switch the battery through the ring of the input or output jack: a cable left plugged drains it, a stereo cable leaves the circuit off, and a DC jack's switch lug that does not break battery plus lets both supplies meet (maker-coverage GTP 32, GTI 8)."
fix = "The battery's minus through the jack's ring contact as the circuit expects, the DC jack's lug breaking battery plus; say in the documentation that the cable switches it on."
severity = "note"
when = { match = "battery_with_jacks" }
sources = [
  "docs/concepts/new/maker-coverage.md, appendix GTP 32 (ElectroSmash analyses, read in full)",
]

[codes."HINT.pedal_supply"]
title = "a pedal's supply among others"
rule = "An instrument board with a supply input: consider the other pedals and amplifiers on the same supply and ground."
why = "Positive-ground pedals put their sleeves on +9 V and short a shared supply; daisy chains form ground loops; a series part in the DC jack's ground leg is bypassed by the audio cables' shields (maker-coverage GTP 2, GTP 35, GTI 32)."
fix = "A centre-negative 9 V input with reverse protection in the plus leg; say whether the board needs an isolated outlet."
severity = "note"
when = { match = "pedal_power_input" }
sources = [
  "docs/concepts/new/maker-coverage.md, appendix GTP 2 (ElectroSmash germanium fuzz and Rangemaster) and GTP 35 (ElectroSmash CE-2), read in full",
]

[codes."HINT.string_ground"]
title = "the player on the amplifier's ground"
rule = "An instrument input: consider what ties the player to ground."
why = "The bridge ground connects the player's hand to the amplifier's ground; a fault there, or a capacitor from mains to chassis, puts the player in the path (maker-coverage GTI 7, GTI 27)."
fix = "No capacitor from mains to chassis on the instrument's side; a resistor or capacitor in the string ground only of a safety class rated for it."
severity = "note"
when = { match = "instrument_input" }
sources = [
  "docs/concepts/new/maker-coverage.md, appendix GTI 7 and GTI 27 (tagged extracted)",
]

[codes."HINT.jack_supply"]
title = "a supply on a jack contact"
rule = "A jack whose tip, ring or a switch contact carries a supply (roles tip, ring, sleeve, tip_switch, ring_switch, sleeve_switch): consider what happens while a plug goes in and comes out."
why = "A plug's tip slides across the ring and sleeve springs on its way in and out: a supply on the tip or ring is shorted to the sleeve – usually ground – for a moment and fed into whatever the plug's contacts touch; split keyboards with TRRS links between their halves are known to fail when plugged live (maker-coverage HT-7)."
fix = "A series resistor or a PTC between the supply and the jack, a switch contact that connects the supply only with the plug home, or no hot-plug stated in the documentation; accept the hint with the reason where the supply is current-limited anyway."
severity = "note"
when = { match = "jack_supply" }
sources = [
  "docs/concepts/new/maker-coverage.md, HT-7 (QMK on TRRS links between the halves of a split keyboard; asp_pro's expression pedal on a TRS jack)",
]

[codes."HINT.relay_load"]
title = "relay contacts switching a load off the board"
rule = "A relay whose contacts (common, no, nc) reach a connector or run through a cable: consider the load they switch."
why = "A relay's contact rating is stated for a resistive load: an LED driver or a switch-mode supply draws many times its current for a moment when switched on, a motor or solenoid arcs when switched off – contacts weld or wear long before their rated current; the load is off the board, so nothing in the graph tells what it is (maker-coverage HT-14)."
fix = "The load's inrush and its kind against the relay's ratings for that kind of load (the datasheet's tables), an NTC or soft start for a capacitive load, a snubber or a diode across an inductive one; accept the hint naming the load."
severity = "note"
when = { match = "relay_off_board" }
sources = [
  "docs/concepts/new/maker-coverage.md, HT-14 (appendix AUD 20)",
]

[codes."HINT.flicker"]
title = "LED flicker from PWM"
rule = "A net with pwm_hz lights LEDs: consider whether its frequency flickers."
why = "Dimmed by PWM, an LED flickers at the PWM frequency; at a few hundred hertz people see it in motion and cameras record it as bands – Arduino's analogWrite runs at about 490 Hz (maker-coverage LED 18)."
fix = "A PWM frequency high enough for the use – IEEE 1789 relates frequency and modulation depth to the risk –, or a constant-current driver dimmed by its current."
severity = "note"
when = { match = "pwm_leds" }
sources = [
  "docs/concepts/new/maker-coverage.md, appendix LED 18 (Arduino analogWrite reference, read in full; IEEE 1789-2015, tagged extracted)",
]

[codes."HINT.boost_enable"]
title = "a boost converter switched off by its enable"
rule = "A boost converter whose enable an MCU drives: consider what its output does with EN low."
why = "Without a load disconnect a boost converter's inductor and diode still connect its input to its output: with EN low the output sits one diode below the input instead of at 0 V (maker-coverage PWR 15)."
fix = "A converter with load disconnect, or a switch in its output path, where the load must be off. With behaviour boost the simulation shows the level in a load with EN low; an expect of the load on the output net holds it."
severity = "note"
when = { match = "boost_enable" }
sources = [
  "docs/concepts/new/maker-coverage.md, appendix PWR 15 (MT3608, tagged extracted)",
  "TI SLVA191A (Load Disconnect for the TPS6510x, May 2004, revised February 2017), abstract: 'Many boost converters have an external rectifier diode. The input voltage … is connected to the output voltage when the device is disabled' – https://www.ti.com/lit/an/slva191/slva191.pdf",
  "Xi'an Aerosemi MT3608 data sheet Rev1.1, p. 1 fig. 1 and p. 5 fig. 2: inductor and diode outside the IC, the only switch from SW to GND; p. 2 EN 'a low input turns it off' – LCSC's copy for C84817",
]

[codes."HINT.usb_budget"]
title = "the current a USB port gives"
rule = "A USB receptacle that powers the board: consider what the port gives – 100 mA before the device is configured, 500 mA after (USB 2.0), 900 mA on USB 3.2 single lane, 1.5 A or 3 A only where a Type-C source advertises it on CC and the board reads the advertisement."
why = "A board that takes what its LEDs, motors or radio need from VBUS works at a phone charger and browns out or trips a laptop's port: the host gives five unit loads only after enumeration, and 1.5 A or 3 A only to a sink that reads the Rp advertisement on CC (maker-coverage PWR 25, LED 7, LED 8, MCU 35). Rd alone on CC says the board is a sink, not how much it may draw."
fix = "Keep the board's draw within 500 mA (100 mA before configuration) – count it with edakit sim against the source's i_max_a –, or read the advertisement (a CC comparator or a PD controller) and limit the load to it, or supply the heavy load from its own input."
severity = "note"
when = { match = "usb_port" }
sources = [
  "Universal Serial Bus Specification Revision 2.0 (April 27, 2000), 7.2.1: a unit load is 100 mA, up to five unit loads after configuration – https://www.usb.org/document-library/usb-20-specification",
  "USB Type-C Cable and Connector Specification Release 2.0 (August 2019), 2.3.4 and Table 2-1: Default (500 mA USB 2.0, 900 mA or 1,500 mA USB 3.2), USB Type-C Current @ 1.5 A and @ 3.0 A – https://www.usb.org/document-library/usb-type-cr-cable-and-connector-specification-release-20",
  "catalog/tables/usb.toml [budget], [typec_current]",
]

[codes."HINT.usb_inrush"]
title = "more than 10 µF on USB VBUS"
rule = "A USB receptacle whose VBUS net carries more than 10 µF directly (the capacitors' value_f): consider a soft start or less capacitance ahead of it – USB 2.0 allows a device 10 µF at attach; HINT.bulk asks for a bulk capacitor at the same input, and the two meet here."
why = "At attach the device's capacitance charges from the hub's VBUS; above 10 µF in parallel with 44 Ω the hub's VBUS droops more than 330 mV and the other ports' devices may reset (USB 2.0, 7.2.4.1). A bulk capacitor at a power input is good advice for a supply cable (HINT.bulk) and too much for a USB port."
fix = "Keep at most 10 µF on VBUS and put the bulk capacitance behind a load switch with soft start (or a regulator that limits its inrush), or accept the hint with the inrush measured or the port known (a charger, not a hub)."
severity = "note"
when = { match = "usb_attach_capacitance" }
sources = [
  "Universal Serial Bus Specification Revision 2.0 (April 27, 2000), 7.2.4.1 Inrush Current Limiting: the maximum load at the downstream end of a cable is 10 µF in parallel with 44 Ω; hub VBUS droop at most 330 mV; more capacitance needs surge current limiting – https://www.usb.org/document-library/usb-20-specification",
  "catalog/tables/usb.toml [attach]",
]

[codes."HINT.power_path"]
title = "a load on the charging cell"
rule = "A charger (behaviour charger) whose battery pin feeds a load – an IC's supply pin, an LED, a motor – with nothing between that the input switches off: consider a power path. The graph shows one as a MOSFET whose gate the charger's input holds (AN1149's P-MOSFET), or as a diode onto a rail the input feeds as well; a charger with a system output of its own keeps the load off its battery pin. The cell's protection IC and a divider into an input are no load."
why = "A linear charger ends its charge once the current into the cell falls below a fraction of the programmed current – TP4056 1/10, MCP73831-2AC 7.5 %. A load on the cell draws through the charger too: the charger measures cell and load together, and while the load takes more than the termination current the charge never ends and the cell is held at the float voltage; cell and load also share the programmed current (Microchip AN1149, p. 5). No run shows it – the simulation has no end of charge (HINT.charge_termination)."
fix = "Feed the load from the input while it is there and from the cell only without it: a Schottky from the input to the system rail and a P-MOSFET from the cell to the rail whose gate the input holds, with a pull-down (AN1149 fig. 5–7, block lipo-charger), or a charger with a power-path output. Or a charger without automatic termination, or a load the firmware switches off while charging – accept the hint naming it."
severity = "note"
when = { match = "loaded_cell" }        # the cell's net reaches an IC supply pin, an LED … without a power path
sources = [
  "Microchip AN1149, Designing A Li-Ion Battery Charger and Load Sharing System With Microchip's Stand-Alone Li-Ion Battery Charge Management Controller, DS01149C (2008), p. 5 'Connecting the system load to the battery': (1) the charge may never end – termination is based on the ratio of charge current to the preset constant current, and a system drawing from the battery keeps the charge current from meeting it; (2) the total system current is limited by the charge current; (3) a switch that turns the system off before charging; note: chargers without automatic termination (MCP73811/2) for a load on the cell; fig. 5–7 p. 5–6: a P-channel MOSFET from the cell to the system load whose gate is high while VIN is present, RPULL 100 kΩ to ground, a Schottky D1 from the input to the load – https://ww1.microchip.com/downloads/en/AppNotes/01149c.pdf",
  "NanJing Top Power ASIC Corp. TP4056 REV_2.4, p. 2: terminates the charge cycle when the charge current drops to 1/10 of the programmed value after reaching the float voltage; p. 9: once terminated, all loads on the BAT pin must be supplied by the battery – https://datasheet.lcsc.com/datasheet/pdf/d328ee101cbb1f3719611cd61db479c2.pdf?productCode=C16581",
  "Microchip MCP73831/2 DS20001984H (June 2020), p. 4 and p. 26: charge termination at ITERM/IREG 7.5 % (5.6–9.4 %) for option AC – https://ww1.microchip.com/downloads/en/DeviceDoc/MCP73831-Family-Data-Sheet-DS20001984H.pdf",
  "docs/concepts/new/maker-coverage.md, HT-5 and appendix PWR 2",
]

[codes."HINT.charge_termination"]
title = "a charger's end of charge is not simulated"
rule = "A linear charger (behaviour charger): consider the end of its charge cycle – the termination, the recharge and the status outputs that follow them; the simulation charges while the cell is below the float voltage and never terminates."
why = "A charger ends the charge in its constant-voltage phase once the current has stayed below a fraction of the programmed current for a filter time – TP4056 1/10 (ITERM 120–140 mA at RPROG 1.1 kΩ, 0.8–4 ms), MCP73831-2AC 7.5 % (5.6–9.4 %, 0.4–3.2 ms) –, latches it off, and starts again once the cell has fallen below a recharge threshold (TP4056 100–200 mV below the float voltage, about 4.05 V; MCP73831-2AC 96.5 % of VREG). The TP4056 does not terminate while it trickle-charges or while its thermal regulation limits the current. An operating point has no history: the simulation's charger leaves the termination out (handbook 5.1), so no run shows the end of charge, the recharge, or what CHRG, STDBY and STAT do then (rules-at-scale.md, decision 17)."
fix = "Read the end of the charge cycle in the charger's datasheet – the termination fraction, its filter time, the recharge threshold – and check what follows from it on the board: what the status outputs do at the end of charge and what reads them, whether anything on the cell keeps the current above the threshold (HINT.power_path), a full charge on the first board. Accept the hint with how it is handled."
severity = "note"
when = { match = "charger" }            # every part whose entry names the behaviour charger
sources = [
  "NanJing Top Power ASIC Corp. TP4056 REV_2.4, p. 2: terminates when the charge current drops to 1/10 of the programmed value after reaching the final float voltage; p. 5: ITERM 60/70/80 mA at RPROG 2.2 kΩ and 120/130/140 mA at 1.1 kΩ, tTERM 0.8/1.8/4 ms, ΔVRECHRG 100/150/200 mV, tRECHARGE 0.8/1.8/4 ms (min/typ/max); p. 9: termination when PROG stays below 100 mV for the filter time, the charge current latched off, C/10 termination disabled in trickle charging and thermal limiting, a new cycle below the 4.05 V recharge threshold – https://datasheet.lcsc.com/datasheet/pdf/d328ee101cbb1f3719611cd61db479c2.pdf?productCode=C16581",
  "Microchip MCP73831/2 DS20001984H (June 2020), p. 4: ITERM/IREG 5.6/7.5/9.4 %, VRTH/VREG 94/96.5/99 %; p. 5: tTERM 0.4/1.3/3.2 ms; 4.7 and 4.8 p. 14: terminated in constant-voltage mode when the average charge current falls below the factory-set percentage, latched off (Charge Complete), a new cycle below the recharge threshold; p. 26: option AC – ITERM/IREG 7.5 %, VRTH/VREG 96.5 % – https://ww1.microchip.com/downloads/en/DeviceDoc/MCP73831-Family-Data-Sheet-DS20001984H.pdf",
  "edakit handbook 5.1, behaviour charger (sim/netlist.py ic_charger): termination belongs to the charge cycle, not to an operating point",
  "docs/concepts/new/rules-at-scale.md, decision 17 (2026-10-31): behaviour over time gets no state model; a hint names the risk where the part is used",
]

[codes."HINT.protection_timing"]
title = "a cell protection's release and delays are not simulated"
rule = "A cell protection IC (behaviour protection): consider its release voltages and its detection delays – the simulation switches the cell off and on at the detection thresholds, the moment the cell crosses them."
why = "A protection IC cuts the cell off only after a delay, and lets it go again at other voltages or events. PUOLOP's DW01A opens the discharge MOSFET 55 ms typ., 200 ms max. after the cell falls below 2.40–2.60 V and releases it above 2.80–3.00 V; it opens the charge MOSFET 110/200 ms after 4.25–4.35 V and releases below 4.05–4.15 V; an overcurrent trips 7/20 ms after 130–170 mV across the MOSFETs, a short 400/600 µs after 0.82–1.75 V. Its timing diagrams show the discharge coming back when a charger is connected after an overdischarge and when the load is removed after an overcurrent, the charge when a load is connected after an overcharge. An operating point has no history: the simulation's protection is a cell coming from the normal range (handbook 5.1), and a transient run switches at a threshold without delay – a load step shorter than the delay cuts the cell off there and not on the board, and no run shows the board staying off until its release (rules-at-scale.md, decision 17)."
fix = "Hold the board's load steps – a motor start, a radio burst, capacitors charging – against the overcurrent threshold and its delay, and the cell's voltage under load against the overdischarge threshold; decide how the board starts again after a cut-off. Accept the hint with how it is handled."
severity = "note"
when = { match = "cell_protection" }    # every part whose entry names the behaviour protection
sources = [
  "PUOLOP DW01A data sheet Rev B (2016-04-12), p. 4: VOC 4.25/4.30/4.35 V, VOCR 4.05/4.10/4.15 V, VOD 2.40/2.50/2.60 V, VODR 2.80/2.90/3.00 V, VEDI 130/150/170 mV, Vshort 0.82/1.36/1.75 V (min/typ/max); TOC 110/200 ms, TOD 55/200 ms, TEDI 7/20 ms, Tshort 400/600 µs (typ/max); p. 5–7 timing diagrams 1–3, read from the graphs: after an overcharge OC returns to VCC when a load is connected, after an overdischarge OD returns when a charger is connected, after an overcurrent or a short OD returns when the load is removed – https://datasheet.lcsc.com/datasheet/pdf/0d2b2b5e8d1207bf276387cb4ff3a495.pdf?productCode=C351410",
  "edakit handbook 5.1, behaviour protection (sim/netlist.py ic_protection): no hysteresis, no delays – the state of a cell coming from the normal range",
  "docs/concepts/new/rules-at-scale.md, decision 17 (2026-10-31): behaviour over time gets no state model; a hint names the risk where the part is used",
]

[codes."HINT.pd_negotiation"]
title = "a USB PD sink's negotiation is not simulated"
rule = "A USB PD sink (behaviour pd_sink): consider the board at 5 V before the negotiation and at the requested voltage after it, and what PG and the CC lines do – the simulation takes VBUS at the voltage a scenario's source gives."
why = "At attach a Type-C source puts vSafe5V on VBUS and only then starts the USB PD communication, carried on the CC wire (USB Type-C R2.0, 4.5.2.2.9.1, 4.6.2.4): the voltage the sink's configuration requests (REQ.value/pd_request) follows once source and sink have agreed, and only from a source that offers it – the CH224 manual does not say what the CH224K does when the source does not. The CH224K signals power good on PG, active low and open drain, and talks to the source on CC1 and CC2 itself, in its reference schematic straight to the receptacle (manual V2.1, table 4-2, 6.2). The simulation's pd_sink is the VDD shunt alone (handbook 5.1): no negotiation, no PG, no CC (rules-at-scale.md, decision 17)."
fix = "Run the parts on VBUS at both voltages – a scenario with the source at 5 V and one at the requested voltage –, switch on by PG (or in firmware) what needs the requested voltage, and say what the board does when a source does not offer it; the CC lines from the receptacle to the PD sink as its reference schematic draws them. Accept the hint with how it is handled."
severity = "note"
when = { match = "pd_sink" }            # every part whose entry names the behaviour pd_sink
sources = [
  "WCH CH224 手册1 (CH224 data sheet, manual 1), V2.1 (PDF of 2025-01-23), table 4-2 p. 3: CH224K CC1, CC2 'Type-C CC 信号线' (the Type-C CC lines), PG 'OD, 默认 Power Good 指示，低电平有效' (open drain, by default the Power Good indication, active low); 6.2 p. 9 CH224K reference schematic: CC1 and CC2 straight to the receptacle, PG left open; the manual gives no timing for PG and does not say what happens when the source does not offer the requested voltage – https://datasheet.lcsc.com/datasheet/pdf/4f12eebccb4eda2c0038806df0155265.pdf?productCode=C970725",
  "USB Type-C Cable and Connector Specification Release 2.0 (August 2019), 4.5.2.2.9.1 p. 177: a source supplies VBUS within tVBUS ON of entering Attached.SRC and does not initiate USB PD communications until VBUS reaches vSafe5V; 4.6.2.4 p. 220: USB PD communication is Bi-phase Mark Coded on the CC wire, VBUS operationally stable before it starts – https://www.usb.org/sites/default/files/USB%20Type-C%20Spec%20R2.0%20-%20August%202019.pdf",
  "edakit handbook 5.1, behaviour pd_sink (sim/netlist.py ic_pd_sink): the VDD shunt; the requested voltage is REQ.value/pd_request's, the charger the project's source",
  "docs/concepts/new/rules-at-scale.md, decision 17 (2026-10-31): behaviour over time gets no state model; a hint names the risk where the part is used",
]

[codes."HINT.input_polarity"]
title = "a power input without a polarity check"
rule = "A supply connector the graph does not mark as reversible: consider whether it can be plugged the wrong way round. Not a battery holder – PATH.reverse checks every one as a source that may be reversed."
why = "There is no polarity standard for many plugs: JST-PH battery packs differ between vendors, barrel jacks are centre-positive or – after Boss – centre-negative; PATH.reverse checks a connector only when it is marked reversible (maker-coverage PWR 7, PWR 32)."
fix = "Give it \"source\": \"reversible\" so that PATH.reverse checks what a reversed source reaches, or a keyed connector whose polarity cannot be swapped."
severity = "note"
when = { match = "unmarked_power_input" }
sources = [
  "docs/concepts/new/maker-coverage.md, appendix PWR 7 and PWR 32 (tagged extracted)",
]

[codes."HINT.thermal_copper"]
title = "thermal resistance needs its copper"
rule = "A part whose temperature rests on rth_ja_k_per_w: consider whether the layout gives the copper that figure assumes."
why = "Rth(j-a) is measured on the datasheet's test board – often a large copper area; on a small pad the part runs hotter than LIM.t computes (maker-coverage MOT 11, PWR 3, PWR 12)."
fix = "The copper and vias of the datasheet's layout under the part, named in the hand-over (layout.notes); or a figure for the board's copper."
severity = "note"
when = { match = "rated_by_copper" }
sources = [
  "docs/concepts/new/maker-coverage.md, appendix PWR 3, PWR 12, MOT 11 (tagged to verify)",
]

[codes."HINT.cable_line"]
title = "a signal line on a cable"
rule = "A signal net runs through a cable: consider what the cable's length and the world at its end do to it."
why = "A long lead picks up interference and has capacitance: an input needs a stronger pull and filtering, an output's edges ring, a clock or data line needs its return beside it (maker-coverage MOT 31, AUD 28–30, LED 4)."
fix = "Inputs: a pull-up of 10 kΩ or less, an RC with a Schmitt-trigger input, a TVS; outputs: a series resistor at the source; data and clocks: a return wire beside each signal, twisted pairs."
severity = "note"
when = { match = "cable_line" }
sources = [
  "docs/concepts/new/maker-coverage.md, appendix MOT 31 (Marlin and Voron documentation, read in full)",
]

