[codes."GEO.drc"]
title = "DRC"
rule = "EasyEDA's design rule check reports nothing after save and reload. A \"Netlist Error – Import Changes\" item is checked on its own: schematic and PCB are compared as edakit pcb parts and pcb nets do. With [routing] drc_rules = \"check\" in the board file, the rule set the DRC ran with is the board file's: the clearance and edge clearance, the least track width of every net (signal_mil, the classes of [routing.classes]), the least via and the net classes."
why = "Clearances, widths and open connections below the manufacturer's limits. Right after API changes the DRC reports false errors, so it runs after a reload. After parts were placed in the schematic, EasyEDA reports Import Changes until its import view has been opened once – even when schematic and PCB are equal; in the reference project that held the gate for 2¾ h and ten runs. A DRC without findings says only that the board keeps the rules EasyEDA holds, which are set in its GUI and in no file: the reference project's DRC ran with 0.102 mm from track to track, so a track drawn by hand closer than the 6.5 mil the board was routed with passed it."
fix = "edakit route reload, then fix what remains (route all, the plan). Import Changes with no difference (\"EasyEDA waits for the import acknowledgement\"): open Design → Import Changes once in EasyEDA – it shows no changes. With differences: edakit pcb parts --write (parts, links, properties) or edakit pcb nets --write (pad nets), as the row says. A rule set that is not the board file's: set the values the row names in EasyEDA (Design → Design Rule: Safe Spacing, Track, Via Size, the net classes), or change [routing] of the board file."
severity = "error"
grades = { margin = "warning" }
details = [
  "EasyEDA DRC 0 (after save and reload), two rows: other kinds; schematic and PCB in sync – an Import Changes item with no difference in `netlist_diff.json` is \"EasyEDA waits for the import acknowledgement\" (still a fail, one click), otherwise the differences and `pcb parts --write` / `pcb nets --write`. With `[routing] drc_rules = \"check\"` a third row: the rule set the DRC ran with (`drc_rules.json`, read right after it) = the board file's – clearance, edge clearance, the least track width of every net, the least via, the net classes (7.5) – named, each difference with both numbers – why it exists: a DRC without findings says only that the board keeps the rules EasyEDA holds: the reference project's ran with 0.102 mm from track to track, while the board was routed with 6.5 mil",
]
replaces = ["L-3"]
sources = [
  "edakit handbook 7 and 9",
  "EasyEDA Pro 3.2.206: the rule configuration, net rules and net classes as PCB_Drc answered on 2026-10-22 (tests/fixtures/easyeda/drc_rules_3.2.206.json)",
  "EasyEDA Pro 3.2.206, its extension API types (pro-api 0.3.50, api-types.d.ts), class PCB_Drc",
]

