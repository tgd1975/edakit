[codes."LIM.range"]
title = "supplied inside the operating range"
rule = "Every part with an operating range – vdd_op_min_v … vdd_op_max_v, a pin's v_op, vin_min_v of a regulator, module or MCU, a relay's must-operate and must-release voltage, a driver output's knee – is supplied inside it in every scenario, measured at its own ground pin, and an MCU's supply never falls below its minimum again once it has reached it (transient runs). An op-amp's inputs stay inside its common-mode range (vicm_v) and its outputs inside their swing (vout_swing_v) unless it is a comparator – grade opamp. A MOSFET switch is off or on at a VGS its RDS(on) is specified at, not in between (rds_on_max_ohm as a table of VGS, vgs_th_v), the drive taken in the device's sense – VSG for a P-MOSFET, a gate driven the other way is off – grade gate. An ADC pin's voltage stays inside the converter's window (adc.range_v) – grade adc. A regulator that needs a minimum load to regulate (i_load_min_a – LM317, AMS1117) is loaded at least that much – grade min_load. A photo-MOS output's LED current is either at its turn-on current or above (if_on_a: guaranteed on) or at its turn-off current or below (if_off_a: guaranteed off) – in between the datasheet promises neither – grade photomos. A constant-current LED driver's input stays above what its string needs – the voltage across R_S, the LEDs and the inductor over the maximum duty cycle (duty_max_ratio, else 1), plus the set current through its switch (r_on_ohm): the on-time equation of the PT4115 and AL8860 datasheets – grade cc."
why = "A circuit can stay within every rating and still not work: a regulator without headroom at the low end of the USB voltage, a 5 V-only IC behind a 3.3 V rail, a reset whenever the supply changes, an LM358 at 5 V whose output cannot rise above about 3.5 V or whose inputs leave their common-mode range."
fix = "Supply the part from a rail inside its range, choose a part whose range fits the rail, or bridge the gap (bulk capacitance, a path that conducts before the other lets go). For an op-amp: bias the stage inside its ranges, a rail-to-rail part, or a higher supply."
severity = "error"
grades = { opamp = "warning", gate = "warning", adc = "warning", clock = "warning", min_load = "warning", photomos = "warning", cc = "warning" }
replaces = ["E-3", "E-5"]
sources = [
  "China Resources Powtech PT4115 data sheet PT4115_DS Rev EN_2.9, p. 3 mean current sense threshold A type 95 / 98 / 101 mV, p. 4 continuous SW current 1.2 A, p. 11 'IOUT = 0.1 / Rs (Rs ≥ 0.082Ω)', p. 12–13 on-time equation TON = L × ΔI / (VIN − VLED − Iavg × (Rs + rL + Rsw)), Rsw 0.6 Ω nominal, ΔI internally 0.3 × Iavg – LCSC's copy for C84512, https://datasheet.lcsc.com/datasheet/pdf/710aeebb569349bc814ba1f6ba8cbef1.pdf (grade cc)",
  "Diodes Incorporated AL8860 data sheet DS39014 Rev. 8 - 2 (April 2026), p. 3 continuous output current TSOT25 1 A, p. 4 VSENSE 96 / 100 / 104 mV and maximum duty cycle 98 %, p. 11 IOUT_NOM = 0.1 / RS, p. 13 the same on-time equation, RSW 0.3 Ω nominal, ΔI internally 0.40 × ILED – https://www.diodes.com/assets/Datasheets/AL8860.pdf (grade cc)",
  "Panasonic ASCTB133E 202103 (AQY21xGS PhotoMOS): LED operate current IFon max 3 mA, LED turn off current IFoff min 0.3 mA (AQY212GS) at IL 100 mA – the photomos grade",
  "edakit handbook 5.3",
  "Advanced Monolithic Systems AMS1117 datasheet (1A low dropout voltage regulator), Electrical Characteristics: Minimum Load 5 typ / 10 max mA at (VIN − VOUT) = 1.5 V, Note 5 – read from LCSC's copy for C6186, https://datasheet.lcsc.com/datasheet/pdf/e6935943fc6b1bbf350a1a0f3e90dc4a.pdf (grade min_load)",
  "TI SLVS695D (TLC591x, June 2007, revised January 2015), 7.3 Recommended Operating Conditions: VDD 3–5.5 V; VIH 0.7 × VDD … VDD and VIL 0 … 0.3 × VDD for CLK, OE(ED2), LE(ED1) and SDI",
  "TI SLIS032D (TPIC6B595, July 1995, revised April 2025), 5.3 Recommended Operating Conditions: VCC 4.5–5.5 V, VIH ≥ 0.85 VCC, VIL ≤ 0.15 VCC",
  "ST DocID13524 Rev 8 (STP08CP05, August 2018), table 6 Recommended operating conditions: VDD 3.0–5.5 V, VIH 0.7 VDD … VDD + 0.3 V, VIL −0.3 … 0.3 VDD",
  "PL9823 addressable RGB LED, datasheet (one page, copy at shop-archive.boxtec.ch/pub/diverse/P9823.pdf): the input voltage of 4.5 V to 6.5 V",
  "edakit handbook 5.2 (transient runs) and 5.3",
  "ngspice User's Manual, independent sources: PWL(T1 V1 T2 V2 …) holds V1 before T1; .tran starts from the DC operating point unless uic is given",
  "Raspberry Pi Pico 2 datasheet: VSYS 1.8–5.5 V – the vsys_min of the example's Pico 2 entry (tests/fixtures/led-bar/hardware/parts/C41407547.json)",
]

[codes."LIM.declared"]
title = "net inside its declared range"
rule = "Every net's simulated voltage lies inside its declared range v (± the criteria's net_range_tol_v); a net marked isolated is not compared – its range is its own loop's, not against this board's ground."
why = "Stage G checks every rating against the declared ranges; a range the simulation exceeds makes those checks pass on numbers that are not true."
fix = "Correct v of the net to what the circuit does, or fix what drives the net outside."
severity = "error"
replaces = ["E-3"]
sources = [
  "edakit handbook 5.3",
]

[codes."LIM.backfeed"]
title = "no supply fed backwards"
rule = "The current into a source against its direction stays at or below its i_back_max_a, into a cell at or below its state's i_charge_max_a (default the criteria's blocking_max_a, 1 mA)."
why = "Where two supplies meet, the higher one feeds the lower one wherever nothing blocks: into a PC's USB port, into a primary cell, which may leak or burst."
fix = "A blocking element in the path – a Schottky diode, two P-MOSFETs back to back, an ORing controller."
severity = "error"
replaces = ["E-3"]
sources = [
  "Raspberry Pi Pico 2 Datasheet (build d4e0f1799616, 03/07/2026), 5.5 Powering Pico 2: a second supply goes into VSYS through a Schottky diode, with the diodes preventing either supply from back-powering the other; a P-FET in its place needs care, its body diode may conduct",
  "Energizer Alkaline Manganese Dioxide Handbook and Application Manual (©2018), Battery Description, p. 4: in abusive conditions (i.e. charging or electrically shorting) high levels of hydrogen can be produced",
]

[codes."LIM.eirp"]
title = "radio power within the band's limit"
rule = "A part that transmits stays within the e.i.r.p. limit of each EU band it transmits in (2400–2483.5 MHz 100 mW, 5150–5350 MHz 200 mW, 5470–5725 MHz 1 W): eirp_dbm, else max_dbm at the RF port + antenna_dbi, with the power the firmware keeps where purpose.radio states it. Over the limit, not known, or no bands stated: the firmware keeps the power – the severity follows the purpose."
why = "The EU limits are e.i.r.p.; a datasheet states the power at the chip's RF port. An ESP32's 20.5 dBm read as e.i.r.p. is over the 100 mW of the 2.4 GHz band."
fix = "Fill in antenna_dbi or eirp_dbm; over the limit a lower power the firmware keeps (purpose.radio max_dbm) or an antenna with less gain. Support, not legal advice."
severity = "note"
grades = { unknown = "note" }
details = [
  "radio power within the band's limit: a part that transmits (`compliance.radio` with `bands_mhz`, 4.1) stays within the limit of each EU band it transmits in whose limit is an e.i.r.p. – the band's highest: 100 mW in 2400–2483.5 MHz, 200 mW in 5150–5350 MHz, 1 W in 5470–5725 MHz; its e.i.r.p. is `eirp_dbm`, else `max_dbm` (conducted, at the RF port) + `antenna_dbi`. Over the limit, not known without them, or no `bands_mhz`: graded by `purpose.use` (8.1): a warning for a board that is sold (`\"sale\"`), information for one built for oneself or given away, or without a purpose – the finding says what the firmware must keep (\"the firmware must keep the conducted power at or below 17.0 dBm\"); a radio value that is no number an error; `accept` on the component. A lower limit of a category of device, power density, duty cycle and the e.r.p. bands (433, 868 MHz) stay with the regulatory review M-6 (chapter 15 – support, not legal advice) – finds e.g.: an ESP32 module with an external 3-dBi antenna at its 20.5 dBm: 23.5 dBm e.i.r.p. where 20 are allowed",
]
replaces = ["G-24"]
sources = [
  "Espressif, ESP32 Series Datasheet v5.3 (2026-07): 5.4 (its RF measurements are taken at the RF port) and table 5-6 (TX power in 11b mode 18.5/19.5/20.5 dBm min/typ/max; note 3: target TX power is configurable) – https://documentation.espressif.com/esp32_datasheet_en.pdf",
  "BNetzA Vfg. 91/2025 (November 2025), table 2 entries 57a (2400–2483.5 MHz, non-specific short range devices, 10 mW EIRP) and 57c (wideband data transmission devices, 100 mW EIRP), table 3 entry D57c (WLAN, 100 mW EIRP) – https://www.bundesnetzagentur.de/DE/Fachthemen/Telekommunikation/Frequenzen/Allgemeinzuteilungen/_DL/vfg91_2025.pdf",
  "BNetzA Vfg. 136/2022 as amended by Vfg. 49/2023, section 1 (EIRP: the power delivered to the antenna times its gain relative to an isotropic antenna) and tables 1–3 (WAS/RLAN: 200 mW mean EIRP in 5150–5250 and 5250–5350 MHz, 1 W in 5470–5725 MHz) – https://www.bundesnetzagentur.de/DE/Fachthemen/Telekommunikation/Frequenzen/Allgemeinzuteilungen/_DL/MobilfunkDectWlanCBFunk/vfg136_2022.pdf",
  "Lesson of the Christmas bell (tgd1975/automatic_christmas_bell, D-18 from the M-6 reviews of D-16 and D-17): the T-Display's max_dbm 20.5 was the ESP32's conducted maximum, and the review computed 20.5 − 4.32 ≈ 16.2 dBm e.i.r.p. by hand with the antenna gain its parts entry cites",
]

[codes."LIM.band"]
title = "transmitter in the EU bands"
rule = "Every range a part transmits in lies within an EU licence-exempt band (433.05–434.79, 863–870, 2400–2483.5, 5150–5350, 5470–5725 MHz). A part that reaches into no EU band at all is an error; a range beyond the bands otherwise is the firmware's to keep (grade firmware, severity by purpose)."
why = "Many radio chips can do more than the EU allows – Wi-Fi channel 14, the US LoRa band. Whether the board stays legal is decided by its firmware, and the graph must say so."
fix = "Keep the firmware to the EU bands and state it in purpose.radio; a part made for other bands: another part, or accept with the allocation of a licensed use. Support, not legal advice."
severity = "error"
grades = { firmware = "note" }
details = [
  "transmitter in the EU bands: every range a part transmits in (`compliance.radio` `bands_mhz`, 4.1) lies within an EU licence-exempt band – 433.05–434.79, 863–870, 2400–2483.5, 5150–5350 or 5470–5725 MHz; where `purpose.radio` (3.1) states how the firmware uses the radio – `\"off\"`, or the bands it keeps, each within the entry's `bands_mhz` – the stated bands count. A part none of whose bands reaches into an EU band is an error – no firmware makes it comply –, unless `purpose.radio` keeps it off; a use edakit does not list (NFC at 13.56 MHz, a mobile network under the operator's licence) gets `accept` on the component with its allocation. Any other range beyond the EU bands is the firmware's to keep, graded by `purpose.use` (8.1): a warning for a board that is sold (`\"sale\"`), information for one built for oneself or given away, or without a purpose: `U1: 2412–2484 MHz (…) reaches beyond the EU band 2400–2483.5 MHz – the firmware must keep to 2400–2483.5 MHz (for Wi-Fi: channels 1–13)`. `purpose.radio` is optional; a statement within the EU bands ends the message, one that names no part with bands, a band the part lacks or a wrong shape is an error (chapter 15 – support, not legal advice) – finds e.g.: an ESP32 whose bands reach Wi-Fi channel 14 (2484 MHz), a LoRa module for 902–928 MHz – both passed `edakit check` without a word",
]
replaces = ["G-25"]
sources = [
  "Espressif, ESP32 Series Datasheet v5.3 (2026-07), table 5-6: operating frequency range 2412–2484 MHz; note 1: 'Device should operate in the frequency range allocated by regional regulatory authorities. Target operating frequency range is configurable by software.' – https://documentation.espressif.com/esp32_datasheet_en.pdf",
  "BNetzA Vfg. 91/2025 (November 2025), table 2: entries 44a, 44b and 45c (433.05–434.79 MHz), the entries from 46a (863–865 MHz) to 56b (869.7–870 MHz), 57a to 57c (2400–2483.5 MHz); table 3 entry D57c (WLAN, 2400–2483.5 MHz) – https://www.bundesnetzagentur.de/DE/Fachthemen/Telekommunikation/Frequenzen/Allgemeinzuteilungen/_DL/vfg91_2025.pdf",
  "BNetzA Vfg. 136/2022 as amended by Vfg. 49/2023: WAS/RLAN in 5150–5250, 5250–5350 and 5470–5725 MHz – https://www.bundesnetzagentur.de/DE/Fachthemen/Telekommunikation/Frequenzen/Allgemeinzuteilungen/_DL/MobilfunkDectWlanCBFunk/vfg136_2022.pdf",
  "edakit handbook 15.1 and 15.2",
  "Lesson of the Christmas bell (tgd1975/automatic_christmas_bell, D-18 from D-13 'Radio' and D-17): the T-Display's bands_mhz reach 2484 MHz and edakit check reported nothing; the M-6 review needed a firmware requirement in the decision log instead – country DE with 802.11d off, channels 1–13",
]

[codes."LVL.undefined"]
title = "input defined while the firmware is not running"
rule = "Every input has a driver or a pull resistor, an input that only MCU pins drive has a pull, a bipolar transistor has a base-emitter resistor and a MOSFET a resistor from its gate to its source or a rail. Graded as warnings while new: an input pin of an IC left in nc (nc), a net only open-drain or tri-state outputs drive – unless their enable pins are tied active – and that no resistor path holds (open_drain; a bridge output, drive bridge, defines its net), an analog node only capacitors reach (analog; a pin the part biases itself, biased = true, gives it its level)."
why = "A floating CMOS input reads random values and can rest where both input transistors conduct. An MCU pin is an input until the firmware configures it, so an enable line it drives floats at every reset."
fix = "A pull resistor to the inactive level (10–100 kΩ); a base-emitter or gate-source resistor next to the transistor. Harmless on purpose: accept on the net with the reason."
severity = "error"
grades = { nc = "warning", open_drain = "warning", analog = "warning" }
details = [
  "no floating input: an input needs a driver or a pull resistor; an input driven only by MCU pins needs a pull (floats until the firmware runs); every BJT needs a base-emitter resistor, every MOSFET a resistor from its gate to the source or a rail – finds e.g.: a floating OE or EN pin at power-up, a MOSFET half on while the MCU boots",
]
replaces = ["G-4"]
sources = [
  "TI SCBA004E, Implications of Slow or Floating CMOS Inputs (2021), section 1 – https://www.ti.com/lit/an/scba004e/scba004e.pdf",
  "TI SLUA618A, Fundamentals of MOSFET and IGBT Gate Driver Circuits (2018), 3.5 dv/dt protection: a gate-source resistor holds the MOSFET off during power-up – https://www.ti.com/lit/ml/slua618a/slua618a.pdf",
]

[codes."LVL.contention"]
title = "one driver per net"
rule = "At most one push-pull output or supply output drives a net."
why = "Two outputs that disagree short the supply through their output stages: high current, heat, an undefined level."
fix = "Separate the nets, make one side an input, or use open-drain outputs with a pull-up."
severity = "error"
details = [
  "at most one push-pull output / supply output per net – finds e.g.: two outputs against each other",
]
replaces = ["G-5"]
sources = [
  "edakit handbook 3.3",
]

[codes."LVL.boot"]
title = "strapping pins at their level at reset"
rule = "A pin whose entry gives strap high or low is at that level at reset: no pull, ground, supply or output on its net says otherwise, and something – an external pull or the pin's own pull – holds it there."
why = "Many MCUs read boot options from pins at reset: the ESP32 starts its download mode with GPIO0 low and sets its flash supply to 1.8 V with GPIO12 high."
fix = "Keep pulls and outputs that disagree off strapping pins, or move the function to another pin."
severity = "error"
details = [
  "strapping pins: a pin with `strap` in its parts entry is at that level at reset – no pull, rail or output on its net says otherwise, and something holds it (a pull, or the pin's internal `pull`) – finds e.g.: a pull-down on the ESP32's GPIO0, an I2C pull-up on GPIO12",
]
replaces = ["G-12"]
sources = [
  "Espressif ESP32 Series Datasheet v5.3, 3 Boot Configurations, table 3-1 – https://documentation.espressif.com/esp32_datasheet_en.pdf",
]

[codes."LVL.threshold"]
title = "logic levels reach the thresholds"
rule = "Every input with thresholds (vih/vil on the pin or in the values) sits at ≤ VIL or ≥ VIH in every scenario, and the high level of every MCU output reaches the VIH of what it drives."
why = "A 3.3 V MCU output into a 5 V shift register with VIH 0.7 × VDD = 3.5 V works on the bench and fails at the next batch."
fix = "A level shifter, a part with thresholds that fit the rail, or the part on the lower rail."
severity = "error"
replaces = ["E-3"]
sources = [
  "edakit handbook 5.3",
  "TI SLVS695D (TLC591x, June 2007, revised January 2015), 7.3 Recommended Operating Conditions: VDD 3–5.5 V; VIH 0.7 × VDD … VDD and VIL 0 … 0.3 × VDD for CLK, OE(ED2), LE(ED1) and SDI",
  "TI SLIS032D (TPIC6B595, July 1995, revised April 2025), 5.3 Recommended Operating Conditions: VCC 4.5–5.5 V, VIH ≥ 0.85 VCC, VIL ≤ 0.15 VCC",
  "ST DocID13524 Rev 8 (STP08CP05, August 2018), table 6 Recommended operating conditions: VDD 3.0–5.5 V, VIH 0.7 VDD … VDD + 0.3 V, VIL −0.3 … 0.3 VDD",
]

[codes."LVL.direction"]
title = "outputs only on pins that drive"
rule = "The simulation drives an MCU output only on a pin that can drive (output or bidirectional)."
why = "An input-only pin – the ESP32's GPIO34–39 – never drives its net; the load stays off."
fix = "Move the function to a pin that can drive."
severity = "error"
replaces = ["E-3"]
sources = [
  "edakit handbook 5.3",
]

[codes."REQ.missing"]
title = "what a part requires is there"
rule = "What a part requires on its pins is in the graph: a capacitor to ground – or to a net of the graph's grounds – per supply pin (power_in), a pull-up per I2C line, a diode across a switched coil (cathode at its plus), Rd on each CC pin of a USB-C receptacle without controller, a layout.loops entry on each net of a hot loop (hot_loop), and what a pin's parts entry says it needs (needs: a capacitor to ground or between two of its pins, a pull-up or pull-down, a series resistor, ground, a crystal between two of its pins, a tie to another of its pins) – grade pin. Warnings while new: D+ and D− of a USB-C receptacle joined across both rows (usb_data), a series resistance on a signal net that leaves the board – through a cable, or on a connector the graph marks off_board (leave), a diode per key of a matrix (matrix), balancing resistors across capacitors in series (balance), a termination at each end of an RS-485 or CAN bus – the transceivers' pins with the roles rs485_a/rs485_b or canh/canl; one behind a switch or jumper counts closed (termination), diodes to the supply and from ground at an output without clamp diodes of its own (pin clamp = \"none\", the L298's bridges) that drives a winding or a connector (clamp), the divider of an adjustable regulator (values vref_v, a pin adj or fb – feedback)."
why = "Each requirement is a datasheet's or a standard's: an IC draws its current in pulses, open-drain lines never go high alone, a coil's turn-off spike breaks the switch, a USB-C source gives no power without Rd, a long hot loop rings and radiates."
fix = "Add the part next to the pin (blocks: i2c-pullups, usb-c-sink), or write the loop into layout.loops."
severity = "error"
grades = { pin = "warning", balance = "warning", usb_data = "warning", leave = "warning", matrix = "warning", termination = "warning", clamp = "warning", feedback = "warning" }
details = [
  "decoupling: per net at least one capacitor to ground per IC supply pin (`power_in`) – finds e.g.: the missing 100 nF",
  "I2C pull-ups: every I2C line has a pull-up to a supply between (V − 0.4 V) / 3 mA and 10 kΩ, parallel ones added up; a line is I2C by the net's `bus`, an SDA/SCL net name, a pin role `sda`/`scl` or a pin name with SDA/SCL (a role decides over the name); pins with `pull`/`pull_ohm` count (modules) – finds e.g.: a bus without pull-ups, 47 kΩ, a module's pull-ups plus your own below 1 kΩ",
  "flyback diode: a relay coil or a buzzer with `coil_ohm`, switched by a transistor or an output, has a diode across it with the cathode at its plus terminal – finds e.g.: a relay that kills its transistor at the first switch-off",
  "USB-C sink: a receptacle with `cc1`/`cc2` pins has its own 5.1 kΩ ± 10 % to ground on each CC pin; silent when an IC is on the CC lines. A module or breakout states its receptacle's termination in `values.usb_c` (4.1): `rd_5k1` or `controller` passes, `none` has its CC pins checked the same way and fails without them – finds e.g.: no 5 V from a USB-C charger, CC1 and CC2 on one resistor, a breakout without its two resistors",
  "hot loop in the hand-over: a part whose entry names its hot-loop pins (`hot_loop`, 4.1) has a `layout.loops` entry on every net of the loop – the nets of those pins and, one diode further, the net behind the rectifier on its switch node (`sw`); a buck, boost, buck-boost or constant-current LED buck IC (`behavior`) without `hot_loop` is a warning; `accept` on the part, or on a net whose part of the loop closes over a pour – finds e.g.: a boost whose output loop was routed 61 mm across the board, passing every check because nobody listed it",
]
replaces = ["G-6", "G-11", "G-13", "G-14", "G-18"]
sources = [
  "Analog Devices MT-101, Decoupling Techniques (Rev. 0, 2009) – https://www.analog.com/media/en/training-seminars/tutorials/MT-101.pdf",
  "NXP UM10204 Rev. 7.0, I2C-bus specification and user manual (2021), 7.1 Pull-up resistor sizing and table 10 – https://www.nxp.com/docs/en/user-guide/UM10204.pdf",
  "TE Connectivity, The Application of Relay Coil Suppression with DC Relays (white paper) – https://www.te.com/en/products/relays-and-contactors/relays/intersection/relay-coil-suppression-dc-relays.html",
  "Richtek AN064, USB Type-C/PD Brief Introduction and Analysis (2021): a sink asserts Rd on the CC pins – https://www.richtek.com/~/media/AN%20PDF/AN064_EN.pdf",
  "USB Type-C Cable and Connector Specification (USB-IF): sink termination Rd = 5.1 kΩ",
  "TI SNVA021C, AN-1149 Layout Guidelines for Switching Power Supplies, Rev. C (2013), 5 Traces and Ground Plane: inductor, output capacitors and output diode as close to each other as possible; the grounds of IC, input capacitors, output capacitors and output diode connected close together directly to a ground plane – https://www.ti.com/lit/an/snva021c/snva021c.pdf",
  "Lesson of the reference project (pytree D-41, 2026-10-23): in the released run 20261023-000107 the MT3608 boost's diode cathode (D33) reached its output capacitor C13 over 61 mm of copper across the board; DRC, the gate and the electrical review passed it, the layout review (M-5) found it; the fix listed four pad pairs (L1.2–U6.1 ≤ 6 mm, U6.1–D33.2 ≤ 5 mm, D33.1–C13.1 ≤ 5 mm, C13.2–U6.2 ≤ 8 mm), the 61-mm segment on V_LED, a net without a pin of U6",
  "TI SLLA272D, The RS-485 Design Guide (revised May 2021), 6: 120-Ω resistors, one at each cable end – https://www.ti.com/lit/pdf/slla272; TI SLOA101B (revised May 2016), 6: CAN terminated at both ends with 120 Ω – https://www.ti.com/lit/pdf/sloa101 (grade termination)",
  "STMicroelectronics L298 Dual Full-Bridge Driver datasheet (January 2000), 3 Applications: 'An external bridge of diodes are required when inductive loads are driven and when the inputs of the IC are chopped'; diodes fast recovery, trr ≤ 200 ns – read from LCSC's copy for C19922, https://datasheet.lcsc.com/datasheet/pdf/c23fc6a8cabb45a298a1d3a512b515a9.pdf (grade clamp)",
]

[codes."REQ.value"]
title = "what a part requires is in range"
rule = "A required part has its value inside the range: an I2C pull-up (in parallel with the pins' own pulls) between (V − 0.4 V) / 3 mA and 10 kΩ, Rd 5.1 kΩ ± 10 % on a CC pin, what a pin needs inside the window its entry gives – a capacitor's window on the capacitors layout.near places next to the part where it names any on the net, else on the net's sum; a crystal's frequency; a required capacitor's voltage rating at least its v_min_v (grade pin), a capacitor minimum the nominal values meet but the capacitance left at the highest DC the nets' declared ranges put across them does not – the maker's curve, values dc_bias; a capacitor without one counts with its nominal value (grade bias), a capacitor need's ESR window (esr_min_ohm, esr_max_ohm: a regulator's output capacitor) filled by capacitors whose esr_ohm lies inside it, up to the need's minimum after DC bias (grade esr), the source resistance an ADC pin sees (adc.r_source_max_ohm, unless a hold capacitor, after DC bias; grade adc), the DC load on an instrument input – a resistor in series into capacitors and high-impedance pins no load (net load_min_ohm; grade instrument), an op-amp's closed-loop gain against its minimum stable gain (gain_min_ratio; grade gain), a termination of an RS-485 or CAN bus of the cable's 120 Ω (grade termination), the idle voltage an RS-485 bias pair sets across the terminations at least 200 mV at the supply's lowest voltage, the far end's termination assumed where the graph holds one end (grade failsafe), a configuration pin that reads its setting by voltage window (pin windows, with the pin's own pull in the operating point) inside one window, not between two (grade window, stage E), the output an adjustable regulator's divider sets within the output net's declared range – VOUT = VREF × (1 + R2/R1) with ADJ, × (1 + R1/R2) with FB (grade feedback), and in the simulation the DC across a switch, relay contact or pot whose sides are both in a signal path (nets with signal or instrument) within 10 mV in every scenario (grade switch), and every voltage a USB PD sink's configuration pins can request (values pd_request_v by the CFG levels on the board: ground, a supply, or either where a pin floats or the firmware sets it) within the declared range of the VBUS net its sense pin reaches (grade pd_request), the DC through a closed contact at least the minimum load of its entry (min_load_a), a contact in a signal path rated for signal currents – min_load_a at most 10 µA (grade min_load); and an output's load – its DC resistance to fixed levels at least the pin's r_load_min_ohm, the capacitors on its net at most its c_load_max_f (grade load); the sense resistor of a constant-current LED driver at least the r_sense_min_ohm of its entry – the PT4115's 0.082 Ω (grade cc, stage E)."
why = "A weak I2C pull-up makes the edges too slow, a strong one cannot be pulled low; a CC resistor outside its window reads as another device."
fix = "4.7 kΩ for 100 kHz, 2.2 kΩ for 400 kHz on I2C; 5.1 kΩ per CC pin."
severity = "error"
grades = { pin = "warning", adc = "warning", instrument = "warning", gain = "warning", termination = "warning", failsafe = "warning", window = "warning", feedback = "warning", switch = "warning", pd_request = "warning", load = "warning", min_load = "warning", bias = "warning", esr = "warning", cc = "warning" }
details = [
  "DC bias: a class-2 ceramic (X5R, X7R …) keeps only part of its capacitance at a DC across it – KEMET's 4.7 µF 6.3 V 0603 X5R (C5126849) 43 % at 5 V, its 10 µF 16 V 0805 (C2167271) 56 %. A capacitor's `dc_bias` is the maker's curve as [[V, ratio], …], linear between its points; a minimum (`c_min_f` of a pin need, an ADC's `c_hold_min_f`) is judged on the capacitance left at the highest DC the declared ranges of its two nets put across it, a maximum on the nominal value; a capacitor without a curve counts nominal and the coverage report names it. The transient and AC netlists take the same value – finds e.g.: a regulator's 1 µF-effective output met on paper by a 2.2 µF 0603 on 5 V",
  "ESR window: an LDO compensated by its output capacitor's ESR zero needs that ESR inside a window – TI's LM1117 0.3 … 22 Ω with at least 10 µF tantalum, Richtek's RT9080 at least 1 mΩ; a pin need's `esr_min_ohm`/`esr_max_ohm` against the capacitors' `esr_ohm` (at 100 kHz; [min, typ, max] – the lowest known against the minimum, the highest against the maximum). Holds when the capacitance inside the window reaches the need's minimum; a capacitor without esr_ohm leaves it unjudged (coverage) – finds e.g.: an LDO that needs ESR with only ceramics on its output",
  "minimum load: a contact needs a least current to close reliably – a film on the contact that no current breaks; a relay's datasheet calls it \"minimum applicable load\" (values `min_load_a`). The simulation compares the DC through every closed contact with it, except in a signal path: there a contact carries no DC by design (grade switch) and the signal a few µA, and its entry is held to at most 10 µA – the minimum applicable load of a relay made for signals (Hongfa HFD4: 10 µA at 10 mV, a reference value), edakit's line for a contact rated for signal currents (rules-at-scale.md, decision 14) – finds e.g.: a relay with a 1 mA minimum load in a guitar's bypass, a gold DIP switch that closes onto a CMOS input with no pull and so carries no current",
]
replaces = ["G-11", "G-14"]
sources = [
  "China Resources Powtech PT4115 data sheet PT4115_DS Rev EN_2.9, p. 3 mean current sense threshold A type 95 / 98 / 101 mV, p. 4 continuous SW current 1.2 A, p. 11 'IOUT = 0.1 / Rs (Rs ≥ 0.082Ω)', p. 12–13 on-time equation TON = L × ΔI / (VIN − VLED − Iavg × (Rs + rL + Rsw)), Rsw 0.6 Ω nominal, ΔI internally 0.3 × Iavg – LCSC's copy for C84512, https://datasheet.lcsc.com/datasheet/pdf/710aeebb569349bc814ba1f6ba8cbef1.pdf (grade cc)",
  "WCH CH224 手册1 version 2.1: CH224K reference 6.2 p. 9 – CFG1 1 → 5 V; CFG1 0 with CFG2 CFG3 00 → 9 V, 01 → 12 V, 11 → 15 V, 10 → 20 V – the pd_request grade",
  "docs/concepts/new/maker-coverage.md, CK-30 (appendix GTP 31, 37; GTI 31; AUD 13) – no DC where signals are switched; the 10 mV is edakit's choice for its \"within a few mV\"",
  "Hongfa HFD4 data sheet, 2024 Rev. 1.00, contact data: 'Min. applicable load 10mV 10µA', note 2: 'Min. applicable load is reference value' (grade min_load, and the 10 µA a contact in a signal path may need at most; LCSC's copy for C64399)",
  "NXP UM10204 Rev. 7.0, I2C-bus specification and user manual (2021), 7.1 Pull-up resistor sizing and table 10 – https://www.nxp.com/docs/en/user-guide/UM10204.pdf",
  "USB Type-C Cable and Connector Specification (USB-IF): sink termination Rd = 5.1 kΩ",
  "TI SLLA272D, The RS-485 Design Guide (revised May 2021), 6 and 7: 120 Ω at each cable end; idle-bus failsafe VAB = 200 mV + noise – https://www.ti.com/lit/pdf/slla272 (grades termination, failsafe)",
  "TI SLOA101B, Introduction to the Controller Area Network (CAN) (revised May 2016), 6: terminated at both ends with 120 Ω – https://www.ti.com/lit/pdf/sloa101 (grade termination)",
  "Maxim MAX98357A/MAX98357B datasheet 19-6779 Rev 11 (5/18): SD_MODE comparator trip points B0 0.08/0.16/0.355 V, B1 0.65/0.77/0.825 V, B2 1.245/1.4/1.5 V, pull-down RPD 92/100/108 kΩ, Table 5 SD_MODE Control, Table 6 pull-up examples – read from LCSC's copy for C910544, https://datasheet.lcsc.com/datasheet/pdf/9dd365a93d191d8d6f09766b0e3ea172.pdf (grade window: the example of pin windows)",
  "Advanced Monolithic Systems AMS1117 datasheet, Application Hints, Output Voltage: a 1.25 V reference between the output and the adjust terminal, VOUT = VREF (1 + R2/R1) + IADJ R2 (Figure 2); Reference Voltage 1.232/1.250/1.268 V – read from LCSC's copy for C6186, https://datasheet.lcsc.com/datasheet/pdf/e6935943fc6b1bbf350a1a0f3e90dc4a.pdf (grade feedback)",
  "KEMET part sheets C0603C475K9PACTU and C0805C106K4PACTU (YAGEO group), generated 2026-10-31, p. 2 'Capacitance Change vs. DC Voltage Bias' and 'Impedance and ESR' (K-SIM, the typical part, not a specification), read from the graphs – https://search.kemet.com/download/specsheet/C0603C475K9PACTU (grade bias: the curves of the library entries C5126849 and C2167271)",
  "TI LM1117 data sheet SNOS412Q (February 2000, revised January 2023), 9.2.2.1.3 Output Capacitor: minimum 10 µF if tantalum, ESR of the output capacitor 0.3 Ω to 22 Ω – https://www.ti.com/lit/ds/symlink/lm1117.pdf (grade esr)",
  "Richtek RT9080 data sheet DS9080-05 (June 2017), Operation p. 3: 1 µF effective capacitance after the temperature and voltage coefficient; Application Information p. 11: output capacitor ESR at least 1 mΩ – LCSC's copy for C841192 (grades bias and esr)",
]

[codes."REQ.forbidden"]
title = "what must stay apart is apart"
rule = "What a part forbids does not happen: CC1 and CC2 of a USB-C receptacle on one net (one resistor for both), a pin whose entry says never_to_ground on ground, an external pull resistor on a pin whose entry says no_pull, a series resistor on one that says no_series (grade pin), two devices on one bus at one address (grade address: base and address pins of the entries – a pin with four states, tied to low, high, SDA or SCL, adds what its entry gives for each), a bridge-tied output (roles out_p, out_n) on ground, on another part's net or on another channel's (grade btl), the diodes of a key matrix pointing both ways (grade matrix), more than two terminations on an RS-485 or CAN bus (grade termination)."
why = "With CC1 and CC2 on one resistor an electronically marked cable reads as a fault and the source gives no power."
fix = "One resistor per CC pin."
severity = "error"
grades = { pin = "warning", address = "warning", btl = "warning", matrix = "warning", termination = "warning" }
replaces = ["G-14"]
sources = [
  "Richtek AN064, USB Type-C/PD Brief Introduction and Analysis (2021): a sink asserts Rd on the CC pins – https://www.richtek.com/~/media/AN%20PDF/AN064_EN.pdf",
  "USB Type-C Cable and Connector Specification (USB-IF): sink termination Rd = 5.1 kΩ",
  "TI SLLA272D, The RS-485 Design Guide (revised May 2021), 6: the cable trunk terminated with 120-Ω resistors, one at each cable end – https://www.ti.com/lit/pdf/slla272 (grade termination: more than two)",
]

[codes."REQ.function"]
title = "pin functions"
rule = "A net's fn (pwm, adc, spi.sck, i2c.sda, uart.tx, …) is on a pin of a microcontroller or module whose entry lists it in functions – or that its GPIO matrix serves (entry matrix: the fn kinds routed to any GPIO; an output to a pin that drives, an input line also to an input-only pin) –, the nets of one fn_bus use one peripheral instance (not asked of a matrix), and PWM nets of one slice have one fixed pwm_hz and a channel each. A peripheral's own pin functions do not answer for the MCU. A UART line crosses: on uart.tx another part receives, on uart.rx another part transmits (grade uart)."
why = "On most MCUs a peripheral reaches only some pins, and pins share hardware: two neighbouring RP2040 GPIOs share one PWM slice and with it one frequency."
fix = "Move the net to a pin that has the function, or give the nets of a slice one frequency. Bit-banged on purpose: leave fn out."
severity = "error"
grades = { uart = "warning" }
details = [
  "pin functions: a net with `fn` is on a pin whose parts entry lists that function (`functions`), the nets of one `fn_bus` on one peripheral instance, two PWM nets of one slice with the same fixed `pwm_hz` and a channel each; a net with `fn` on pins without `functions` is a note – finds e.g.: SPI data on the clock pin, an analog input without ADC, a buzzer on the PWM slice of an LED",
]
replaces = ["G-15"]
sources = [
  "pico-sdk 2.1.1, src/rp2350/hardware_regs/include/hardware/regs/io_bank0.h: IO_BANK0_GPIOn_CTRL_FUNCSEL_VALUE_* – the SPI, UART, I2C and PWM function of every GPIO – https://github.com/raspberrypi/pico-sdk/blob/2.1.1/src/rp2350/hardware_regs/include/hardware/regs/io_bank0.h",
  "pico-sdk 2.1.1, src/rp2_common/hardware_pwm/include/hardware/pwm.h: each slice drives two outputs from one counter; PWM_GPIO_SLICE_NUM = (gpio >> 1) & 7 below GPIO 32, channel = gpio & 1; src/rp2350/hardware_regs/include/hardware/platform_defs.h: RP2350A ADC_BASE_PIN 26",
  "Lesson of the reference project (pytree D-14, 2026-10-19): the star's blue LED at 1 kHz and the buzzer on GP20/GP21 shared PWM slice 2 – every note would have changed the blue PWM; found by chance in a review",
]

[codes."PATH.reverse"]
title = "reverse polarity blocked"
rule = "What a reversed source (a battery holder, a source marked reversible) reaches through fuses, switches, push buttons and connectors is only capacitors without polarity, holders, the anode of a blocking diode – on a negative rail (the protected net declared at or below 0 V) its cathode – or the drain of a PMOS whose source and gate are outside; a polarized capacitor it reaches is reverse biased (grade polarized)."
why = "A battery inserted the wrong way drives the supply negative; every IC on that rail conducts through its substrate diodes and dies within milliseconds."
fix = "A Schottky diode in series, or a PMOS in the supply path with its gate to ground (block reverse-pmos)."
severity = "error"
grades = { polarized = "warning" }
details = [
  "reverse polarity from the topology: what a reversed source (battery holders, `\"source\": \"reversible\"` on the component) reaches through fuses, switches, push buttons and connectors may only be a capacitor, the anode of a diode whose cathode is outside, or the drain of a PMOS whose source and gate are outside – finds e.g.: the protection diode bypassed, an IC directly on the battery",
]
replaces = ["G-10"]
sources = [
  "TI SLVA139, Reverse Current/Battery Protection Circuits (2003) – https://www.ti.com/lit/an/slva139/slva139.pdf",
]

[codes."PATH.unfed"]
title = "every supply pin reached by a supply"
rule = "Every supply pin (power_in) is on a net a supply reaches – a power output, a battery holder, a connector with a vbus pin or marked as a source, a simulation source – directly or through fuses, switches, push buttons, connectors, inductors, MOSFETs, resistors up to 100 Ω and diodes in forward direction – on a negative rail from cathode to anode."
why = "A rail split by a typo in a net name kills every board and passes every other check."
fix = "Put the pin on its rail; usually a typo in a net name or two pins swapped."
severity = "error"
details = [
  "ground and supply pins: every `ground` pin on the ground net (or one joined to it by a 0 Ω bridge or an inductor, or in `grounds`); every `power_in` pin on a net that a supply reaches – a `power_output` pin, a battery holder, a connector with a `vbus` pin or in `\"source\": \"reversible\"` on the component, a simulation source – directly or through fuses, switches, push buttons, connectors, inductors, MOSFETs, resistors up to 100 Ω and diodes in forward direction – finds e.g.: a rail split by a typo in its name, a ground pin on a net of its own, VDD swapped with a signal",
]
replaces = ["G-16"]
sources = [
  "Lesson of the reference project (pytree MVP risk review, item 10, 2026-10-23): pin-to-net checked by hand for every IC, about 20 minutes, and nothing repeats it after the next change",
  "edakit handbook 4.1 (pin types ground, power_in, power_output) and 3.3 (0 Ω bridges)",
]

[codes."PATH.ground"]
title = "ground pins on ground"
rule = "Every ground pin is on the ground net (or one joined to it by an inductor, or in the graph's grounds), and no supply pin is on ground."
why = "A ground pin on a net of its own leaves the part unpowered; a supply pin on ground shorts the rail."
fix = "Put the pin on ground; a ground separate on purpose goes into the graph's grounds."
severity = "error"
replaces = ["G-16"]
sources = [
  "Lesson of the reference project (pytree MVP risk review, item 10, 2026-10-23): pin-to-net checked by hand for every IC, about 20 minutes, and nothing repeats it after the next change",
  "edakit handbook 4.1 (pin types ground, power_in, power_output) and 3.3 (0 Ω bridges)",
]

[codes."SIM.config"]
title = "simulation config readable"
rule = "The simulation config names existing parts, nets and boards, and every value has the form the config needs; a part whose thresholds are ratios has one supply pin to take them of."
why = "A config the simulation cannot read checks nothing."
fix = "Correct sim.json as the message says."
severity = "error"
grades = { off = "note" }
replaces = ["E-1", "E-3"]
sources = [
  "edakit handbook 5.1",
]

[codes."SIM.converge"]
title = "every scenario converges"
rule = "The operating point of every scenario converges, every transient run reaches its end."
why = "A scenario that does not converge checks nothing. Usually a node has no DC path to ground or a parameter is missing."
fix = "Give a floating node a path (often a real design fault), or complete the parts entry."
severity = "error"
details = [
  "the operating point converges, a transient run runs to its end; a net of `copper` that stays one node is noted (info) with the reason",
]
replaces = ["E-1"]
sources = [
  "edakit handbook 5.1",
]

[codes."SIM.state"]
title = "the circuit does what the scenario expects"
rule = "In every scenario the circuit reaches the state its load expects: LEDs on or dark, each LED of a driver channel at its share of the set current and parallel LEDs sharing it, a regulator's output at its set voltage, a blocking diode blocking, the board drawing at least a supply's minimum load, an LED the right way round, each LED in the string of a constant-current LED driver at its share of the set current or dark while the driver's dim pin is low (grade cc), and what the project plugin checks. A boost converter its enable switches off has no set voltage to reach: its output – what its inductor and diode pass from the input – is a row of information, and what hangs on it is judged at that level."
why = "A circuit can stay within every rating and still not work. The simulation is the polarity check of the graph: a reversed LED stays dark where it should light."
fix = "Depends on the item; the protocol gives the actual and the expected value per scenario."
severity = "error"
details = [
  "function: current from every source (≤ `i_max_a`; ≥ `i_min_a` with every MCU at its `i_core_min_a` – 5.1), no source and no cell fed backwards (≤ `i_back_max_a`, `i_charge_max_a`, 1 mA by default), regulator outputs within tolerance, input above `vin_min_v`, LDO junction temperature – an MCU module's own LDO too, with the core current it carries (5.3) – against the same limit as LIM.t's, MCU supply voltage and load on its regulator, MCU inputs at a defined level (≤ VIL or ≥ VIH – a 3.3 V signal into a 5 V AVR is the classic case), every part with an operating supply range inside it, every input pin with thresholds at a defined level and the high level of every MCU output reaching the VIH of the inputs on its net (5.3), MCU outputs only on pins that can drive (an output on an input-only pin is reported and not driven), LED driver output headroom and junction temperature, every LED on or dark as the load says (driver channels: ≥ 80 % of its share of the set current, also for an LED behind 0 Ω bridges or one resistor; parallel LEDs share within a ratio – 5.3), relays pull in (`v_operate_v`) and release (`v_release_v`) as the load says, an own board supplied inside the range it was simulated for (`vin_min_v` … `vin_max_v`, 4.5), diodes that must block (`expect_blocking`), every net inside its declared range `v` (a net of `copper`: its lowest and highest pin), plus the plugin's checks",
]
grades = { cc = "warning" }
replaces = ["E-3"]
sources = [
  "China Resources Powtech PT4115 data sheet PT4115_DS Rev EN_2.9, p. 3 mean current sense threshold A type 95 / 98 / 101 mV, p. 4 continuous SW current 1.2 A, p. 11 'IOUT = 0.1 / Rs (Rs ≥ 0.082Ω)', p. 12–13 on-time equation TON = L × ΔI / (VIN − VLED − Iavg × (Rs + rL + Rsw)), Rsw 0.6 Ω nominal, ΔI internally 0.3 × Iavg – LCSC's copy for C84512, https://datasheet.lcsc.com/datasheet/pdf/710aeebb569349bc814ba1f6ba8cbef1.pdf (grade cc)",
  "Diodes Incorporated AL8860 data sheet DS39014 Rev. 8 - 2 (April 2026), p. 3 continuous output current TSOT25 1 A, p. 4 VSENSE 96 / 100 / 104 mV and maximum duty cycle 98 %, p. 11 IOUT_NOM = 0.1 / RS, p. 13 the same on-time equation, RSW 0.3 Ω nominal, ΔI internally 0.40 × ILED – https://www.diodes.com/assets/Datasheets/AL8860.pdf (grade cc)",
  "TI SLVA191A (Load Disconnect for the TPS6510x, May 2004, revised February 2017), abstract: 'Many boost converters have an external rectifier diode. The input voltage … is connected to the output voltage when the device is disabled' – https://www.ti.com/lit/an/slva191/slva191.pdf",
  "Xi'an Aerosemi MT3608 data sheet Rev1.1, p. 1 fig. 1 and p. 5 fig. 2: inductor and diode outside the IC, the only switch from SW to GND; p. 2 EN 'a low input turns it off' – LCSC's copy for C84817",
  "edakit handbook 5.3",
]

[codes."SIM.driver"]
title = "every LED has a known driver"
rule = "Every LED – each colour of an RGB LED – has a state the simulation checks in every scenario: its cathode on a driver output (directly, behind 0 Ω bridges or a balancing resistor), or the load lists it in leds_on. An LED a multiplexing driver scans (behaviour matrix_driver, pins on both its nets) has no DC state: a row of information."
why = "Only an LED with an expected state is checked; without one a reversed LED passes without a word."
fix = "Give every load leds_on, or put the LED's cathode on a driver output; an LED left out needs its roles."
severity = "error"
details = [
  "LED has a known driver: in every scenario every LED – each colour of an RGB LED – has a state SIM.state checks, its cathode on a driver output (directly, behind 0 Ω bridges or one resistor) or the load's `leds_on`; an LED with neither, or one the netlist left out because its parts entry lacks a role it reads (anode, cathode and their colours, 4.1), fails as \"LED without a known driver\"",
]
replaces = ["E-4"]
sources = [
  "edakit handbook 5.3: a reversed LED elsewhere stays dark where it should light – the polarity check of the graph",
  "edakit rules.json G-7 (retired): polarity is checked by the simulation",
]

[codes."SIM.response"]
title = "frequency response as expected"
rule = "Every expectation of an AC run of the simulation config (ac) holds: the gain from its input to its output at the frequencies named (grade gain), and the lower and upper −3 dB corners within their ranges (grade corner). The gain is 20·log10 |V(output) / V(source)| for 1 V AC behind the run's source_ohm, linearised around a DC scenario; a corner is where the gain falls 3.01 dB below its largest value in the sweep. Runs only where sim.json names an expectation, only with the domain audio or guitar on."
why = "A coupling capacitor ten times too small, a filter resistor of the wrong decade or a gain resistor swapped passes every DC check – the operating point is the same – and shows only as thin bass, a dull top or a level that clips the next stage. The DC-first simulation sees none of it; an expectation written next to the circuit (the corner the designer computed) holds it, the way a load's expected state holds the DC function."
fix = "Find the part that sets the corner or the gain (an RC: f = 1 / (2π·R·C); a non-inverting stage: 1 + Rf/Rg) and correct its value, or correct the expectation where it was wrong. A corner from the op-amp's bandwidth is not modelled (no gain-bandwidth in the model) – judge it from the datasheet."
severity = "warning"
grades = { gain = "warning", corner = "warning" }
sources = [
  "rules-at-scale.md, decision 9 (2026-10-31): AC analysis opt-in, where sim.json names an expectation, in the domains audio and guitar, warnings first; maker-coverage FT-12",
  "ngspice 42 (Ubuntu package 42+ds-3build1): the control command ac dec <points per decade> <fstart> <fstop> and wrdata of mag(v(node)), as edakit runs them (tests/test_sim_ac.py); the manual on ngspice.sourceforge.io was not reachable from the environment where this was built",
]

