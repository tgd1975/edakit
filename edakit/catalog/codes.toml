]

[codes."PARTS.verified"]
title = "parts signed"
rule = "Every parts entry is verified against its datasheet (verified), no component has an open verify note, and every part is an LCSC part or an EasyEDA device."
why = "The parts database feeds every check. A value copied from a distributor's table without a look at the datasheet is an assumption; the sign-off records who checked what against which revision."
fix = "Check the part (handbook 4.3) and fill in verified; resolve verify notes in the graph."
severity = "pending"
grades = { device = "warning" }
details = [
  "sign-off: every part `verified` against its datasheet, no open `verify` note (pending – blocks only the release) – finds e.g.: an unchecked part going into an order",
]
replaces = ["G-9"]
sources = [
  "edakit handbook 4.3",
]

[codes."PARTS.stock"]
title = "parts orderable"
rule = "For the maker of [cart] makers that orders from JLCPCB's catalogue – a failure for the planned maker, a warning for another one (grade other_maker), not run without such a maker (a note): every assembled part is listed at JLCPCB, in stock for [project] quantity boards with the assembler's attrition, under the MPN of its entry, not 'Standard Only' on an Economic order – from the snapshot of edakit stock. A thin margin, MSL 5 or more, another class: margin; an old snapshot: stale."
why = "What the assembler can place is decided when the part is chosen, not when the BOM is uploaded. A part only LCSC stocks is 'pre-order only' at JLCPCB; a 'Standard Only' part (large holders, modules) turns a one-sided Economic order into Standard with setup per side and loading fees on every type; an MSL 5 part is baked for a fee and two days; a catalogue entry under another part number is another part. Found in the quote, each of these costs a part swap, sign-offs again and gate runs."
fix = "edakit stock after every part change. A part that fails: another part (part-search, edakit stock --lcsc for the candidates), the part soldered by hand (bom: false), or Standard PCBA chosen on purpose ([release] assembly.pcba = \"standard\"). A wrong MPN: correct the parts entry or the LCSC number. Accept a warning in the sign-off file with its reason."
severity = "error"
grades = { margin = "warning", stale = "pending", unchecked = "note", other_maker = "warning" }
details = [
  "parts orderable (4.2): every assembled part listed at JLCPCB, in stock for `quantity` boards (with the attrition under Standard), its entry's MPN, not \"Standard Only\" on an Economic order – from the snapshot of `edakit stock`; MSL ≥ 5, a thin margin, another class warn; an old snapshot is pending, none a note – finds e.g.: a part that is pre-order only, Standard-only or baked, found in the quote",
  "for the maker of `[cart] makers` that orders from JLCPCB's catalogue (fail as the planned maker, warning as another one, not run without it): every BOM line in JLCPCB's public assembly catalogue with stock for `quantity` boards (otherwise only pre-order), under the MPN of its parts entry; another class than `jlc_class` warns – PARTS.stock checks the same and more from the stock snapshot when the part is chosen",
]
replaces = ["P-4", "F-2"]
sources = [
  "edakit handbook 4.2 and 8.4",
  "JLCPCB part pages (PCBA Type, MSL, X-ray) and the quotes of 2026-10-24 and 2026-10-25 (attrition)",
  "edakit handbook 4.2",
]

[codes."PARTS.supplier"]
title = "supplier per part"
rule = "Every part bought separately and fitted by hand (bom: false) has an LCSC number or an order entry in its parts entry ({supplier: code} or {supplier: {code, moq, step}}), so that edakit order can put it into a cart. A C99… number is an EasyEDA user-library entry, not an LCSC number: LCSC does not sell it. A warning."
why = "The assembler's BOM leaves out every hand-soldered part, module and cable. What has no supplier and no order code is written into an order list by hand, late and without spares or the supplier's minimum – a 50-pack that does not exist, one LED short for the last board."
fix = "Add order to the parts entry, e.g. {\"berrybase\": \"OSM5DK7331A\"} or {\"lcsc\": {\"moq\": 20, \"step\": 20}}, or give the component its LCSC number – for a C99… library number the supplier the part really comes from; then edakit order. Accept the warning in the sign-off file if the part is at hand already."
severity = "warning"
details = [
  "supplier per part: a part bought separately (`bom: false`) has an LCSC number – a `C99…` EasyEDA library number is none – or `order` in its parts entry (warning) – finds e.g.: a module or LED nobody wrote an order code for, found when the order list is written by hand",
]
replaces = ["P-5"]
sources = [
  "edakit handbook 4.1 and 8.4",
]

[codes."PARTS.fact"]
title = "required facts given"
rule = "Every fact a check needs and the profile requires is in the entry: lead for a through-hole part, functions on MCU pins a net's fn uses, hot_loop of a switching regulator, compliance.radio of a module or microcontroller, mpn and manufacturer of every assembled part with a maker of [cart] makers that matches the BOM by manufacturer part number (Eurocircuits; an error for the planned maker, a warning for another one, grade other_maker). The grade names the fact; its severity is the profile's."
why = "A check without its fact checks nothing and says so only here."
fix = "Fill in the fact from the datasheet (handbook 4.1)."
severity = "note"
grades = { lead = "pending", functions = "note", hot_loop = "warning", radio = "note", mpn = "error", other_maker = "warning" }
details = [
  "manufacturer part number (4.1): with a maker of `[cart] makers` that matches parts by manufacturer part number (Eurocircuits) every assembled part's entry names its `mpn` and its `manufacturer` – an error for the planned maker, a warning for another one – finds e.g.: a part the maker cannot match, found at its BOM upload",
  "radio stated: every part of graph type `module` or `microcontroller` has `compliance.radio` in its parts entry – its bands and power (4.1), or `\"none\"` when it does not transmit; missing is graded by `purpose.use` (8.1): a warning for a board that is sold (`\"sale\"`), information for one built for oneself or given away, or without a purpose – `accept` on one of its components –, other parts need it only if they transmit; a `radio` of another shape is an error. The entry is in the circuit hash: the statement renews M-1 and M-6 (8.2) – finds e.g.: an Arduino Nano whose entry says nothing about a radio – found by the regulatory review from the part's name; a plug-in board with an ESP32 its name does not show",
  "Eurocircuits, BOM requirements (MPN and designators required): https://www.eurocircuits.com/?p=9450 – search result of 2026-10-30, the page not reachable from the session (docs/concepts/new/ordering.md)",
  "Ordering at the manufacturer (docs/concepts/new/ordering.md, decided 2026-10-30): BOM with MPN and PARTS.fact/mpn, in stage P",
]
replaces = ["P-7", "G-15", "G-18", "P-11", "P-12"]
sources = [
  "JLCPCB PCB capabilities: hole size tolerance +0.13/-0.08 mm, minimum plated slot width 0.5 mm on 2 layers – https://jlcpcb.com/capabilities/pcb-capabilities (read 2026-10-27)",
  "edakit handbook 13.6 and 8.1 (L-9)",
  "pico-sdk 2.1.1, src/rp2350/hardware_regs/include/hardware/regs/io_bank0.h: IO_BANK0_GPIOn_CTRL_FUNCSEL_VALUE_* – the SPI, UART, I2C and PWM function of every GPIO – https://github.com/raspberrypi/pico-sdk/blob/2.1.1/src/rp2350/hardware_regs/include/hardware/regs/io_bank0.h",
  "pico-sdk 2.1.1, src/rp2_common/hardware_pwm/include/hardware/pwm.h: each slice drives two outputs from one counter; PWM_GPIO_SLICE_NUM = (gpio >> 1) & 7 below GPIO 32, channel = gpio & 1; src/rp2350/hardware_regs/include/hardware/platform_defs.h: RP2350A ADC_BASE_PIN 26",
  "Lesson of the reference project (pytree D-14, 2026-10-19): the star's blue LED at 1 kHz and the buzzer on GP20/GP21 shared PWM slice 2 – every note would have changed the blue PWM; found by chance in a review",
  "TI SNVA021C, AN-1149 Layout Guidelines for Switching Power Supplies, Rev. C (2013), 5 Traces and Ground Plane: inductor, output capacitors and output diode as close to each other as possible; the grounds of IC, input capacitors, output capacitors and output diode connected close together directly to a ground plane – https://www.ti.com/lit/an/snva021c/snva021c.pdf",
  "Lesson of the reference project (pytree D-41, 2026-10-23): in the released run 20261023-000107 the MT3608 boost's diode cathode (D33) reached its output capacitor C13 over 61 mm of copper across the board; DRC, the gate and the electrical review passed it, the layout review (M-5) found it; the fix listed four pad pairs (L1.2–U6.1 ≤ 6 mm, U6.1–D33.2 ≤ 5 mm, D33.1–C13.1 ≤ 5 mm, C13.2–U6.2 ≤ 8 mm), the 61-mm segment on V_LED, a net without a pin of U6",
  "edakit handbook 4.1 (field compliance) and 15.3 (what the review needs)",
