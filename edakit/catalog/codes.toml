title = "copper annotated"
rule = "A net listed for copper is simulated with its routed copper; where it is not, it stays one ideal node."
why = "Information: the voltage drop along that net is not in the results."
fix = "Route the net, or take it off the list."
severity = "note"
replaces = ["E-1"]
sources = [
  "edakit handbook 5.1",
]

[codes."SYNC.schematic"]
title = "schematic = graph"
rule = "Every schematic in EasyEDA has exactly the graph's parts (LCSC number, designator) and nets (pins, no-connects)."
why = "The schematic is generated, but EasyEDA can lose or move things: a generated schematic once drifted (a pin on two nets) without anyone writing to it."
fix = "Generate it again (edakit schematic create, layout); never edit a schematic by hand."
severity = "error"
replaces = ["S-2"]
sources = [
  "edakit handbook 6 and 13.2",
]

[codes."SYNC.pcb"]
title = "PCB = graph"
rule = "The PCB has exactly the graph's parts, every pad carries the graph's net, and every graph pin has a pad."
why = "Bringing parts into the PCB can lose, double or mismatch them, and a pad on the wrong net is routed wrong without any DRC error."
fix = "edakit pcb parts --write and edakit pcb nets --write."
severity = "error"
details = [
  "parts in the PCB = graph; every pad carries the graph's net; every graph pin has a pad – why it exists: the import may lose or mismatch parts",
]
replaces = ["L-1"]
sources = [
  "edakit handbook 7 and 8.1",
]

[codes."SYNC.footprint"]
title = "footprint = its source"
rule = "Every part on the board has the footprint its entry names, every pad sits where the library footprint has the pad of its number (intended swaps in pad_map), and a copy built from footprint data equals that data (pads within 0.02 mm, holes within 0.01 mm)."
why = "A footprint that differs from its source puts pads where the part has no pins."
fix = "Correct the footprint or the entry; an intended swap goes into pad_map."
severity = "error"
grades = { unknown = "note" }
details = [
  "footprint per part = parts database – why it exists: a swapped footprint variant",
  "every pad sits where the library footprint has the pad with that number (`pad_map` for intended swaps) – why it exists: a pad swap that was reset by EasyEDA",
  "the copy equals the footprint data: the footprint `pcb dump` measured on the board (`<board>.geometry.json`) has the entry's footprint name and the data's pads – the same numbers, each within 0.02 mm of its place (SYNC.plan's tolerance), the same hole within 0.01 mm, and where the dump measured them shape, size, rotation and layer; `accept` on the component. A part not dumped yet, or a dump without holes or shapes, is a note. In the gate SYNC.footprint holds the PCB's pads to the same dump (4.5) – finds e.g.: `U1: the copy differs from the footprint data of C18722937 – pad 3 at (11.430, -8.891) instead of (11.430, -8.790) mm` – a pad changed in the text and the copy in the PCB still the old one, found before anything is routed on it",
]
