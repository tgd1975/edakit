[codes."PARTS.schema"]
title = "parts entries well-formed"
rule = "Every field of a parts entry has the form its kind's schema gives (edakit part lint): known names with their unit, numbers where numbers belong, ranges with min ≤ max, pin roles the kind knows."
why = "A value of the wrong form is read as missing or wrong by every check that uses it."
fix = "Correct the field as the message says; edakit part lint lists all."
severity = "error"
replaces = ["G-14", "G-18", "G-24", "P-11"]
sources = [
  "edakit handbook 4.1 (field compliance) and 15.3 (what the review needs)",
  "Lesson of the Christmas bell (tgd1975/automatic_christmas_bell, D-18 from the M-6 reviews of D-16): on the boards main, smd and tht U1 is an Arduino Nano without a transmitter, no parts entry said so, and the M-6 reviews of 2026-10-26 established it from the part's identity; on esp32 the T-Display's compliance.radio was added by hand during the review",
