[codes."GEO.mark"]
title = "polarity marks"
rule = "Every '+' or '-' in the silkscreen – a PCB text, or a '+' a footprint draws as two crossing strokes of 0.3–2 mm in the silk Gerber file – sits next to a pad of that sign: the nearest pad on its side whose pin role has a sign (anode…, plus…, vbus '+'; cathode…, minus… '-') has the same one."
why = "A sign at the wrong pole makes whoever solders or inspects the board turn the part the wrong way. The sign that counts most is the footprint's own print: the assembler, the hand-solderer and JLCPCB's assembly preview go by it. In the reference project the library footprint of a 5-mm LED printed '+' at the pad that symbol and datasheet call the cathode. GEO.mark read only PCB texts, and a cathode had no sign, so a '+' at a cathode was compared with the anode next to it and passed; a review found it before five boards were assembled with the LED turned."
fix = "Compare the footprint with the datasheet. The print is right: correct the roles in the parts entry. The datasheet is right: put the anode's net on the pad with the '+' and give that pin the role anode (handbook 4.4), or use another footprint. A cross inside the box of a [[silk.art]] item is artwork and is not read; a decorative cross elsewhere is accepted on the nearest part (accept GEO.mark)."
severity = "error"
grades = { margin = "warning" }
details = [
  "every \"+\" and \"−\" of the silkscreen next to a pad of that sign: the PCB texts \"+\", \"−\", and the \"+\" a footprint draws as two crossing strokes in the **silk Gerber files** (each 0.3–2 mm, as long as the other, at right angles, middles within 0.1 mm). Each is compared with the nearest pad on its side whose role has a sign – `anode…`, `plus…`, `vbus` \"+\", `cathode…`, `minus…` \"−\". Strokes of a PCB text with a \"+\" are that text (a \"+5V\" is a label); a cross inside the box of a `[[silk.art]]` item is artwork. `waive: {\"GEO.mark\": \"…\"}` on the nearest part lists its sign as waived – why it exists: the footprint of a 5-mm LED printed \"+\" at the cathode: GEO.mark read only PCB texts and gave the cathode no sign, so nothing saw it; a review did, before five boards would have been assembled with the LED turned (4.4)",
]
replaces = ["L-8"]
sources = [
  "edakit handbook 4.4 and 8.1",
  "the reference project's second review (M-1), 2026-10-22, and its decision on it: the footprint LED-TH_BD5.0-P2.54-FD prints '+' at pad 1, symbol and datasheet call pad 1 the cathode; the nets were swapped so that pad 1 carries the anode",
]

[codes."GEO.formed"]
title = "formed leads fit one way"
rule = "A through-hole part whose plated holes the board's footprint (pcb dump) moves away from its library footprint – a hole more than 0.05 mm from the library's hole of the same number, the two footprints laid on each other by their numbers – and that has three or more plated holes is not laid onto itself by a turn of 90°, 180° or 270° about its holes, every hole within 0.25 mm of a hole, with a pin in the hole of a pin on another net of the graph. Pins on one net do not count, two holes and a part on its library pattern are not judged; without the library footprint of edakit part import it is a note."
why = "A part fitted by hand with formed leads loses the cues of its library pattern: the longest lead is bent like the others, and the body's flat stands millimetres above the silkscreen mark. If the formed pattern maps onto itself, the part goes in turned as easily as the right way – an RGB LED with its anode in a cathode's hole stays dark, a transistor or regulator is reversed. No other check sees it: SYNC.footprint compares the PCB with the board's own footprint, GEO.mark judges a sign next to a pad, GEO.hole and GEO.ring the hole size, ring and spacing, and part diff sees the symmetry only when a part is swapped. In the reference project the star LED's four legs in one row at 1.25 mm got two of them bent 1.6 mm the same way: turned by 180° the anode's hole lay on the green cathode's and red on blue, to 0.00 mm, the print had its '+' at the anode, and every check passed; the second datasheet check found it by hand. Bending one of the two legs the other way left no turn that fits (the closest 1.25 mm off)."
fix = "Choose the offsets so that no turn lays the pattern onto itself: two leads in opposite directions, one lead only, or different amounts – then check ring and hole spacing again (GEO.ring). Where the pattern stays symmetric for a mechanical reason, accept GEO.formed on the component with that reason and let the print show the orientation (GEO.mark)."
severity = "error"
grades = { margin = "warning", unknown = "note" }
details = [
  "formed leads fit only one way round: a part whose plated holes the board's footprint (`pcb dump`) moves away from the library footprint of `edakit part import` – a hole more than 0.05 mm (SYNC.footprint's tolerance) from the library's hole of its number, the two laid on each other by their numbers –, with three or more of them, is not laid onto itself by a turn of 90°, 180° or 270°, every hole within 0.25 mm of a hole, with a pin in the hole of a pin on another net; pins on one net do not count, two holes and a part on its library pattern are not judged (its orientation is the print's job, GEO.mark). The pads are matched as `part diff` matches them (7.3). The finding names the turn and the pins: `D31: its formed holes lie on each other turned by 180° – pin 1 (V_LED) in the hole of pin 3 (STAR_G_K), pin 2 (STAR_R_K) in the hole of pin 4 (STAR_B_K)`; `accept` on the component; without the library footprint a note – finds e.g.: an RGB star LED with two legs bent the same way, which went in turned by 180° as easily – anode in a cathode's hole, the star dark –, with a \"+\" at the anode and every check passed",
]
replaces = ["P-8"]
sources = [
  "The reference project (pytree), decision D-49 of 2026-10-27 (docs/hardware.md, bullets 'Biegen' and 'Footprint'): pin 1 bent 1.6 mm towards the tip, pin 4 1.6 mm towards the trunk – the opposite offsets make the hole pattern asymmetric; with both legs towards the tip the star also fitted turned by 180° and would have stayed dark",
  "The reference project, hardware/release/signoff.json, the second datasheet check M-1 of 2026-10-27: all nine bend patterns computed, only the right one fits (turned 1.25 mm off); in the first round the hole pattern with pins 1 and 4 towards the tip was point-symmetric (finding 'important', fixed with pin 4 towards the trunk)",
  "The reference project's gate runs 20261027-211238 (round 1) and 20261027-214622 (round 2): D31's pads in pcb.json – pads 1 and 4 1.6 mm off the row the same way in round 1, pad 4 1.6 mm the other way in round 2; the library footprint LED-TH_4P-BD5.8-P1.25 as edakit part import C7371895 cached it (2026-10-28): one row at 1.25 mm, holes Ø 0.70 mm",
  "0.05 mm: L-10's tolerance (pad against library position); 0.25 mm: about the radius of a formed lead (the reference project's star LED: legs 0.49 mm) – the triage's choice, no standard was opened",
  "edakit handbook 3.3 (P-7) and 7.3 (part diff: pads matched by position under each turn, 'symmetric: the numbers decide')",
]

[codes."GEO.pour"]
title = "copper per side"
rule = "Per copper layer the Gerber copper's share of the board area and its largest copper-free circle inside the pour outline are reported; on a layer the board file pours, a copper-free circle above [copper] max_bare_mm (5 mm) is a warning, a share below [copper] min_cover on any layer is one, and on every layer so is a copper piece that touches no pad, via or plated hole (copper inside an NPTH or mounting hole is drilled away)."
why = "EasyEDA drops every pour piece that touches no pad of its net, so where the pour net has no pad that side stays bare – and a pour that was never filled, or was filled before the last copper change, looks the same in the files. GEO.copper checks only connectivity, EasyEDA's DRC (GEO.drc) does not report a missing fill, and route pours treats a read-back mismatch as harmless. In the reference project half the back of a released board stayed bare (47 % copper, a copper-free circle of Ø 9.7 mm) where its ground net had no pads; the gate and the layout review passed it, and it was seen by eye the evening before the order. Islands kept for stitching (route pours, stitch) stay on the board as loose copper when the second fill does not run."
fix = "A bare area on a poured layer: give it to a net that reaches it – a second pour net on the layer (pour_regions, priority) or a pad or via of the pour net there – then route pours and run the gate again. Loose copper: connect it with a via or a track, or delete it, and fill the pours again without islands. An area bare on purpose (an antenna keep-out): accept the warning with its reason. [copper] max_bare_mm and min_cover = {TOP = %, BOTTOM = %} in the board file set the limits of a board."
severity = "warning"
grades = { margin = "warning" }
details = [
  "copper per layer on GEO.copper's raster of the **Gerber files**, widened to the outline: the copper share of the board area (without mounting and NPTH holes) and the largest copper-free circle inside the pour outline (the outline `pcb pour` pours, 7.6) – information; on a layer the board file pours (`[[pours]]`, default GND on both) a circle above `[copper] max_bare_mm` (5 mm) warns, a share below `[copper] min_cover` warns, and on every layer a copper piece that touches no pad (FlyingProbeTesting.json), via or plated hole warns, with its area and place. Copper inside an NPTH or mounting hole is drilled away. One row per layer, so an accepted warning covers its layer – why it exists: EasyEDA drops every pour piece without a pad of its net: half the back of a released board stayed bare (47 % copper, a copper-free circle of Ø 9.7 mm) where ground had no pads, with DRC 0 and every check passed; it was seen by eye before the order",
]
replaces = ["L-15"]
sources = [
  "edakit handbook 7.6 (pours: EasyEDA drops islands, readback-mismatch) and 8.1 (L-2)",
  "The reference project, tree PCB Rev 2: release run 20261025-205344 with the back bare where GND had no pads (TOP 47 % copper, copper-free circle Ø 9.7 mm, measured by this check), passed by the gate and the layout review; the fix run 20261025-232212 with V_LED filling that area (72 %, Ø 3.8 mm) – its decisions D-48 and B-4, its layout review M-5 (\"Kupfer hinten 72 % statt 46 %\"), 2026-10-25",
  "5 mm: the reference project's measurement, between the bare run (9.7 mm) and the fixed run (3.8 mm); JLCPCB PCB Manufacturing Capabilities (read 2026-10-26) has no row on copper balance or coverage – https://jlcpcb.com/capabilities/pcb-capabilities",
]

[codes."GEO.spacing"]
title = "pads and holes keep their distance"
rule = "Every pad keeps the routing clearance from every pad of another part on another net, SMD pads on an assembled side the paste gap, hand-soldered joints their keep-out, and every two plated holes JLCPCB's hole-to-hole spacing. With layout.apart in the graph: the copper of each pair of nets keeps min_mm apart on every layer, measured on the Gerber files (grade apart, a warning while new)."
why = "Pads too close bridge in soldering; holes too close break out in drilling."
fix = "Move the parts apart or change the footprint."
severity = "error"
grades = { margin = "warning", apart = "warning" }
details = [
  "pads of different parts on different nets at least the routing clearance (`clearance_mil`) apart on every copper layer both are on; a pad without a net counts as a net of its own, pads of one part are not compared. Measured as `route check` measures it (7.5), on the pads of `route read` (`<artifacts>/route/<board>_board.json`) – pcb.json has no pad shapes –, and only while every pad there sits where the PCB has it, on its layer and net; otherwise GEO.spacing fails and asks for `route read`. `waive: {\"GEO.spacing\": \"…\"}` on one of the two parts or nets lists the pair as waived – why it exists: two resistors stood with their pads 0.09 mm apart: the plan compares boxes, `route check` measured only tracks and vias, and only EasyEDA's DRC could have seen it, after the copper was written",
  "on every side that is assembled (`[release] assembly` `sides`), SMD pads of different parts on different nets at least the paste gap (`paste_gap_mm`, 0.4 mm) apart, so that the stencil keeps a web between their prints; a pad without a net counts as a net of its own, pads of one part, through-hole pads and pads on a side that is not assembled are not compared. Measured on the pads of `route read` like GEO.spacing, and only while they are the PCB's. `waive: {\"GEO.spacing\": \"…\"}` on one of the two parts or nets lists the pair as waived – why it exists: the paste of a ground pad and a transistor base pad of neighbouring parts was 0.06 mm apart: above every copper rule, a bridge in reflow that the bare-board test cannot see; the layout review found it",
  "with `[routing] hand_solder_keep_mm` (0 = off): on the solder side of every through-hole pad of a part with `bom: false` – the layer the part does not sit on – no via and no pad of another net closer than the keep, copper to copper; a pad without a net counts as a net of its own, the part's own pads are not compared, tracks do not count. Pads as `route read` saw them, like GEO.spacing; vias from the via drill file, with the net of the tracks of pcb.json that end on them – a via no track ends on counts as another net's ('via (no track, net unknown)'). `route check` measures the same before writing, and `route dsn` keeps vias away (7.5). `waive: {\"GEO.spacing\": \"…\"}` on the joint's part or net, or on the other part or net, lists the pair as waived – why it exists: the layout review found a via 0.25 mm from a hand-soldered LED joint – a bridge would have put 5 V without its resistor on an LED –, a via 0.26 mm between potentiometer pins and a resistor pad 0.37 mm from an LED joint; every check had passed",
]
replaces = ["L-13", "L-14", "L-16", "L-18"]
