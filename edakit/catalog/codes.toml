[codes."SYNC.source"]
title = "own part = its source"
rule = "A board copied from another edakit project (own.what pcb, edakit part own) is that project's current datasheet and was copied from a commit, every datasheet a project writes (hardware/datasheet/) is of its current state, and a board that is not released at the state of its datasheet is a warning."
why = "An own board has no distributor and no manufacturer's datasheet: its parts entry is derived from the project that designed it – pins, supply range, current, compliance. When that project changes, the copy describes another board than the one that gets plugged in, and every check of the host reasons about the old one. A copy of uncommitted changes names no state anyone can find again. A board that has not passed its own gate is not checked as a product, whatever its datasheet says – that is the user's decision, so it is a warning to accept, not an error."
fix = "In the board's project: edakit part datasheet, then commit. In the host: edakit part own <path to the board's project>. Release the board there (edakit gate) and copy again, or accept the warning in the sign-off file with the reason."
severity = "error"
grades = { margin = "warning", stale = "pending", unchecked = "note" }
details = [
  "own parts (4.5): a board copied with `edakit part own` is its project's current datasheet, copied from a commit (pending otherwise); a board not released at that state is a warning; the project's own datasheets are of its current state – finds e.g.: a board changed after it was copied into the host",
]
replaces = ["P-3"]
sources = [
  "edakit handbook 4.5",
]

