# JLCPCB capabilities – GEO.hole, GEO.ring, GEO.spacing, FILES.order.

[table]
about = "JLCPCB 2-layer FR-4, 1 oz: holes, rings, spacings"
source = "JLCPCB PCB capabilities page (read 2026-10), as noted per row"
