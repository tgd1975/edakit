slot_min_mm = 0.5      # plated slots on 2 layers at least 0.5 mm wide
source = "JLCPCB capabilities: drill hole size tolerance, plated slot width"
tag = "r"

[ring]
pth_min_mm = 0.18      # PTH annular ring, absolute minimum
pth_warn_mm = 0.20     # the capability value "≧0.20mm" (margin below)
via_min_mm = 0.05      # via diameter at least hole + 0.1 mm
pad_gap_mm = 0.45      # pad hole-to-hole spacing, edge to edge
via_gap_mm = 0.2       # via hole-to-hole spacing, edge to edge
source = "JLCPCB capabilities: annular ring, hole-to-hole spacing"
