# Source models of the audio band (maker-coverage FT-18, rules-at-scale.md decision 20) – what an AC run's `source`
# names in sim.json instead of numbers (sim/ac.py): a passive pickup, a piezo disc, an electret capsule. Each row holds
# only what its maker states, read from the maker's page or datasheet, with the date it was read.
#
# What the makers publish (read 2026-10-31):
# - Seymour Duncan: DC resistance on the product pages ("DCR … the total resistance of the copper wire wound around a
#   coil form"), DC resistance and resonant peak in the archived Pickup Comparison Chart – the load the peak was
#   measured with is not stated, so no inductance is derived from it.
# - DiMarzio: DC resistance ("Resistance", measured "at normal room temperature with an ohmmeter" – FAQ, which also
#   says DiMarzio uses it to verify that a pickup is wound to its specification, not as a measure of tone or output),
#   an output in mV relative to its other pickups, an EQ chart.
# - Mojotone: DC resistance ("7.4K") and relative output and EQ numbers; the FAQ says the Quiet Coils match "the
#   resonant peak frequency and inductance of original single-coils" without giving either.
# No maker reachable states a pickup's inductance or capacitance: a named pickup needs the project's l_h (decision 20).
# Fender and EVH answer 403 and are not read.

[table]
about = "pickups (DC resistance, resonant peak where stated), piezo discs (capacitance) and electret capsules (output impedance, measurement load) as the makers state them – the source models of sim.json ac"
source = "the makers' product pages and datasheets, as noted per row, read 2026-10-31"
tag = "r"

